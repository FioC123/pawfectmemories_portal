<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex, nofollow">
  <title>十二月檔期</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Inter:opsz,wght@14..32,400..600&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #2C2825; --secondary: #6B645C; --ground: #d7e6f0; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--ground);
      color: var(--ink);
      font-family: "PingFang HK", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    }
    header { padding: 22px 20px 8px; max-width: 520px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 0 0 6px; font-weight: 650; letter-spacing: -0.02em; }
    .hint, .warn { margin: 0 0 8px; color: var(--secondary); font-size: 0.92rem; line-height: 1.55; }
    .warn { color: #7A614C; }
    .card-wrap { width: min(420px, calc(100% - 32px)); margin: 16px auto 8px; }
    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
      box-shadow: 0 10px 32px rgba(44, 40, 37, 0.12);
      touch-action: manipulation;
      background: #c9dcea;
    }
    .actions, .hidden-box { max-width: 520px; margin: 0 auto; padding: 8px 20px 28px; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    button {
      appearance: none; border: 0; border-radius: 999px;
      padding: 10px 16px; font: inherit; font-size: 0.92rem;
      background: #E8D5C0; color: #7A614C; cursor: pointer;
    }
    button.primary { background: var(--ink); color: #FFFCF8; }
    button:active { opacity: 0.8; }
    .hidden-box h2 { font-size: 0.95rem; margin: 12px 0 6px; }
    noscript p { padding: 20px; color: #7A614C; }
  </style>
</head>
<body>
  <header>
    <h1>十二月檔期</h1>
    <p class="warn">如果只見到空白畫面，請撳分享，再揀「用 Safari 開啟」。聊天或者檔案預覽有時唔會顯示到圖。</p>
    <p class="hint">撳時間可以切換已預約（劃線）或空檔。撳左邊日期可以隱藏嗰日。開始時已剔除 12/4、20、24、25、26、28、31。</p>
  </header>
  <noscript><p>呢份編輯檔需要用 Safari 開啟，先可以見到同修改檔期圖。</p></noscript>
  <div class="card-wrap">
    <canvas id="card" width="1080" height="1920"></canvas>
  </div>
  <div class="actions">
    <div class="btns">
      <button class="primary" id="download">下載檔期圖</button>
      <button id="reset">還原最初設定</button>
    </div>
  </div>
  <div class="hidden-box" id="hiddenBox"></div>
  <script>
  (function () {
    const CW = 1080, CH = 1920;
    const SLOTS = ["09:00", "13:00", "16:00"];
    const WEEKDAYS = ["一", "二", "三", "四", "五", "六", "日"];
    const INITIAL_HIDDEN = [4, 20, 24, 25, 26, 28, 31];
    const INITIAL_BOOKED = {
      6: ["13:00", "16:00"], 7: ["16:00"], 8: ["16:00"], 9: ["13:00"],
      12: ["09:00"], 14: ["13:00"], 15: ["16:00"], 17: ["13:00", "16:00"],
      18: ["16:00"], 23: ["16:00"], 27: ["13:00"], 29: ["16:00"]
    };
    const KEY = "pawfect-dec2026-schedule-v2";
    const INK = "#201c1a", MUTED = "#323036", OAK = "#7A614C";
    const BOX = { x0: 48, y0: 268, x1: 1032, y1: 1832 };
    const PAD = 44, RADIUS = 42;

    let hidden = INITIAL_HIDDEN.slice();
    let booked = JSON.parse(JSON.stringify(INITIAL_BOOKED));
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.hidden)) hidden = parsed.hidden;
        if (parsed.booked && typeof parsed.booked === "object") booked = parsed.booked;
      }
    } catch (e) {}

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify({ hidden, booked })); } catch (e) {}
    }
    function weekdayLabel(day) {
      const js = new Date(2026, 11, day).getDay();
      return WEEKDAYS[js === 0 ? 6 : js - 1];
    }
    function leftDays() {
      const out = [];
      for (let d = 1; d <= 15; d++) if (hidden.indexOf(d) === -1) out.push(d);
      return out;
    }
    function rightDays() {
      const out = [];
      for (let d = 16; d <= 31; d++) if (hidden.indexOf(d) === -1) out.push(d);
      return out;
    }

    const sky = new Image();
    const skyBlur = new Image();

    const grain = document.createElement("canvas");
    grain.width = CW;
    grain.height = CH;
    (function buildGrain() {
      const g = grain.getContext("2d");
      const img = g.createImageData(CW, CH);
      const data = img.data;
      for (let i = 0; i < data.length; i += 4) {
        const n = 128 + (Math.random() - 0.5) * 48;
        const c = n + (Math.random() - 0.5) * 8;
        data[i] = c; data[i + 1] = n; data[i + 2] = c; data[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
    })();

    function roundRect(ctx, x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function layout() {
      const x = BOX.x0 + PAD;
      const titleY = BOX.y0 + 36;
      const listTop = titleY + 154;
      const innerW = (BOX.x1 - BOX.x0) - PAD * 2;
      const gutter = 36;
      const colW = (innerW - gutter) / 2;
      const listBottom = BOX.y1 - 48;
      const rows = Math.max(leftDays().length, 1);
      const rowH = (listBottom - listTop) / rows;
      const sampleW = 86, slotGap = 18;
      const timesBlock = sampleW * 3 + slotGap * 2;
      return { x, titleY, listTop, colW, gutter, listBottom, rowH, sampleW, slotGap, timesBlock, rightX: x + colW + gutter };
    }

    function drawHeader(ctx, x, y) {
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = "rgba(20,24,36,0.22)";
      ctx.font = "800 86px 'Bricolage Grotesque', 'PingFang HK', system-ui, sans-serif";
      ctx.fillText("December", x + 0.8, y + 86 + 1);
      ctx.fillStyle = INK;
      ctx.fillText("December", x, y + 86);
      const tw = ctx.measureText("December").width;
      ctx.font = "450 28px Inter, 'PingFang HK', system-ui, sans-serif";
      ctx.fillText("2026", x + tw + 12, y + 42);
      ctx.fillStyle = OAK;
      ctx.font = "400 24px 'PingFang HK', 'PingFang TC', 'Noto Sans TC', sans-serif";
      ctx.fillText("十二月", x, y + 86 + 40);
    }

    function vcenter(ctx, x, mid, text, font, fill) {
      ctx.font = font;
      ctx.fillStyle = fill;
      ctx.textBaseline = "middle";
      ctx.textAlign = "left";
      ctx.fillText(text, x, mid);
    }

    function drawColumn(ctx, days, x, L) {
      const dateFont = "560 26px Inter, 'PingFang HK', system-ui, sans-serif";
      const wdFont = "400 22px 'PingFang HK', 'PingFang TC', sans-serif";
      const timeFont = "480 24px Inter, 'PingFang HK', system-ui, sans-serif";
      ctx.textAlign = "left";
      for (let i = 0; i < days.length; i++) {
        const y = L.listTop + i * L.rowH;
        const mid = y + L.rowH / 2;
        const day = days[i];
        ctx.strokeStyle = "rgba(255,255,255,0.55)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + L.colW, y);
        ctx.stroke();
        vcenter(ctx, x, mid, "12/" + day, dateFont, INK);
        ctx.font = dateFont;
        const dw = ctx.measureText("12/31").width;
        vcenter(ctx, x + dw + 12, mid, weekdayLabel(day), wdFont, MUTED);
        const taken = booked[day] || [];
        const timesLeft = x + L.colW - L.timesBlock;
        for (let s = 0; s < SLOTS.length; s++) {
          const slot = SLOTS[s];
          const sx = timesLeft + s * (L.sampleW + L.slotGap);
          const isBooked = taken.indexOf(slot) !== -1;
          vcenter(ctx, sx, mid, slot, timeFont, isBooked ? MUTED : INK);
          if (isBooked) {
            ctx.font = timeFont;
            const w = ctx.measureText(slot).width;
            ctx.strokeStyle = INK;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(sx - 1, mid);
            ctx.lineTo(sx + w + 1, mid);
            ctx.stroke();
          }
        }
      }
      const closeY = L.listTop + days.length * L.rowH;
      ctx.strokeStyle = "rgba(255,255,255,0.55)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, closeY);
      ctx.lineTo(x + L.colW, closeY);
      ctx.stroke();
    }

    function drawCard(canvas) {
      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      canvas.width = CW;
      canvas.height = CH;
      if (sky.naturalWidth) ctx.drawImage(sky, 0, 0, CW, CH);
      else { ctx.fillStyle = "#c9dcea"; ctx.fillRect(0, 0, CW, CH); }

      const x = BOX.x0, y = BOX.y0, w = BOX.x1 - BOX.x0, h = BOX.y1 - BOX.y0;
      ctx.save();
      ctx.shadowColor = "rgba(16,22,40,0.22)";
      ctx.shadowBlur = 28;
      ctx.shadowOffsetY = 12;
      roundRect(ctx, x, y, w, h, RADIUS);
      ctx.fillStyle = "rgba(255,255,255,0.01)";
      ctx.fill();
      ctx.restore();

      ctx.save();
      roundRect(ctx, x, y, w, h, RADIUS);
      ctx.clip();
      const pane = skyBlur.naturalWidth ? skyBlur : sky;
      if (pane.naturalWidth) ctx.drawImage(pane, -36, -36, CW + 72, CH + 72);
      ctx.fillStyle = "rgba(255,255,255,0.10)";
      ctx.fillRect(x, y, w, h);
      const grad = ctx.createLinearGradient(0, y, 0, y + h * 0.18);
      grad.addColorStop(0, "rgba(255,255,255,0.22)");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w, h * 0.18);
      ctx.restore();

      ctx.strokeStyle = "rgba(255,255,255,0.62)";
      ctx.lineWidth = 2;
      roundRect(ctx, x, y, w, h, RADIUS);
      ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,0.22)";
      ctx.lineWidth = 1;
      roundRect(ctx, x + 2, y + 2, w - 4, h - 4, RADIUS - 2);
      ctx.stroke();

      const L = layout();
      drawHeader(ctx, L.x, L.titleY);
      drawColumn(ctx, leftDays(), L.x, L);
      drawColumn(ctx, rightDays(), L.rightX, L);

      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.globalCompositeOperation = "soft-light";
      ctx.drawImage(grain, 0, 0);
      ctx.restore();
    }

    function hitTest(px, py) {
      const L = layout();
      function hitCol(days, x) {
        if (py < L.listTop || py > L.listTop + days.length * L.rowH) return null;
        if (px < x || px > x + L.colW) return null;
        const i = Math.floor((py - L.listTop) / L.rowH);
        if (i < 0 || i >= days.length) return null;
        const day = days[i];
        const timesLeft = x + L.colW - L.timesBlock;
        if (px >= timesLeft) {
          const s = Math.floor((px - timesLeft) / (L.sampleW + L.slotGap));
          if (s >= 0 && s < 3) return { kind: "slot", day, slot: SLOTS[s] };
        }
        return { kind: "date", day };
      }
      return hitCol(leftDays(), L.x) || hitCol(rightDays(), L.rightX);
    }

    const cardEl = document.getElementById("card");

    function renderHidden() {
      const box = document.getElementById("hiddenBox");
      const days = hidden.slice().sort(function (a, b) { return a - b; });
      if (!days.length) { box.innerHTML = ""; return; }
      let html = "<h2>已隱藏嘅日子</h2><div class='btns'>";
      days.forEach(function (d) {
        html += "<button type='button' data-show='" + d + "'>加返 12/" + d + "</button>";
      });
      html += "</div>";
      box.innerHTML = html;
      box.querySelectorAll("[data-show]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          hidden = hidden.filter(function (x) { return x !== Number(btn.getAttribute("data-show")); });
          save(); redraw();
        });
      });
    }

    function redraw() {
      try { drawCard(cardEl); } catch (err) { console && console.error(err); }
      renderHidden();
    }

    cardEl.addEventListener("click", function (ev) {
      ev.preventDefault();
      const rect = cardEl.getBoundingClientRect();
      const x = (ev.clientX - rect.left) * CW / rect.width;
      const y = (ev.clientY - rect.top) * CH / rect.height;
      const hit = hitTest(x, y);
      if (!hit) return;
      if (hit.kind === "slot") {
        const list = (booked[hit.day] || []).slice();
        const idx = list.indexOf(hit.slot);
        if (idx >= 0) list.splice(idx, 1);
        else list.push(hit.slot);
        if (list.length) booked[hit.day] = list;
        else delete booked[hit.day];
      } else if (hit.kind === "date") {
        if (hidden.indexOf(hit.day) === -1) hidden.push(hit.day);
        hidden.sort(function (a, b) { return a - b; });
      }
      save();
      redraw();
    });

    document.getElementById("download").addEventListener("click", async function () {
      const blob = await new Promise(function (resolve) { cardEl.toBlob(resolve, "image/png"); });
      if (!blob) return;
      const file = new File([blob], "december-2026-schedule.png", { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: "十二月檔期" }); return; } catch (e) {}
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "december-2026-schedule.png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    });
    document.getElementById("reset").addEventListener("click", function () {
      hidden = INITIAL_HIDDEN.slice();
      booked = JSON.parse(JSON.stringify(INITIAL_BOOKED));
      save();
      redraw();
    });

    function loadImg(img, src) {
      return new Promise(function (resolve) {
        var done = false;
        var ok = function () { if (!done) { done = true; resolve(); } };
        img.onload = ok;
        img.onerror = ok;
        img.src = src;
        if (img.complete && img.naturalWidth) ok();
      });
    }
