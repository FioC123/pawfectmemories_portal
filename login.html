<!DOCTYPE html>
<html lang="zh-Hant" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>登入 | Pawfect Memories Admin</title>
  
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600&family=Noto+Sans+HK:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script id="tailwind-config">
    tailwind.config = {
      future: { hoverOnlyWhenSupported: true }, 
      darkMode: 'class',
      theme: { 
        extend: { 
          colors: { 
            "pm-green": "#244018", "pm-oak": "#C4905E", "pm-cream": "#FAFAFA", "pm-dark-bg": "#0B0E0C", "pm-dark-surface": "#121714", "pm-dark-border": "#1E2621"
          }, 
          fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['"Noto Sans HK"', '"Inter"', 'sans-serif'] },
          boxShadow: { 'taste': '0 20px 40px -10px rgba(0, 0, 0, 0.08)', 'taste-dark': '0 20px 40px -10px rgba(0, 0, 0, 0.6)' }
        } 
      } 
    }
  </script>
  <style>
    body { transition: background-color var(--duration-fast) var(--ease-smooth-out), color var(--duration-fast) var(--ease-smooth-out); -webkit-font-smoothing: antialiased; }
    i[data-lucide] { display: inline-block; vertical-align: text-bottom; }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .login-input { background-color: #F9FAFB !important; border: 1px solid var(--line) !important; transition: background-color var(--duration-quick) var(--ease), border-color var(--duration-quick) var(--ease), box-shadow var(--duration-quick) var(--ease-out); }
    .dark .login-input { background-color: #1A211D !important; }
    .login-input:focus { background-color: #FFFFFF !important; border-color: #C4905E !important; box-shadow: 0 0 0 3px rgba(196, 144, 94, 0.1) !important; outline: none; }
    .dark .login-input:focus { background-color: #121714 !important; }
    input[type="password"] { letter-spacing: 0.5em; font-family: 'Inter', sans-serif; }
    input[type="password"]::placeholder { letter-spacing: normal; font-family: 'Noto Sans HK', sans-serif; font-weight: 400; font-size: 1rem; }
    #err { transition: opacity var(--duration-fast) var(--ease-smooth-out); }
  </style>
  <meta name="theme-color" content="#F3F1EC">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta && document.documentElement.classList.contains("dark")) meta.setAttribute("content", "#101411");
    })();
  </script>
  <link rel="stylesheet" href="pm.css">
</head>
<body class="pm-app pm-public bg-pm-cream dark:bg-pm-dark-bg text-gray-800 dark:text-[#EAE8E3] font-sans flex flex-col items-center justify-center min-h-screen relative selection:bg-pm-oak/30 selection:text-pm-green dark:selection:text-white">

  <div class="w-full max-w-sm px-5">
    <div id="login-card" class="bg-white dark:bg-pm-dark-surface p-6 rounded-[32px] border border-gray-200/60 dark:border-white/5 text-center">
      
      <div class="w-16 h-16 bg-pm-green/5 dark:bg-pm-oak/10 rounded-[20px] flex items-center justify-center mx-auto mb-6 text-pm-green dark:text-pm-oak border border-pm-green/10 dark:border-pm-oak/20 shadow-sm">
        <i data-lucide="shield-check" class="w-8 h-8"></i>
      </div>
      
      <h1 class="font-serif text-3xl font-bold text-gray-900 dark:text-white mb-2 tracking-tight">Pawfect Admin</h1>
      <p class="text-xs text-gray-500 dark:text-gray-400 font-medium tracking-widest uppercase mb-8">Workspace Login</p>
      
      <div class="space-y-5">
        <div id="input-wrapper">
          <input type="password" id="pin" placeholder="輸入管理員 PIN 碼" autocomplete="current-password" inputmode="numeric" class="login-input w-full rounded-2xl px-4 py-4 text-center font-bold text-2xl text-gray-900 dark:text-white placeholder:text-gray-400" onkeypress="if(event.key === 'Enter') checkLogin();">
        </div>
        
        <button id="btn-login" onclick="checkLogin()" class="pm-btn w-full">
          進入系統
        </button>
        <button type="button" onclick="toggleDarkMode()" class="w-full min-h-[44px] text-base font-semibold text-gray-600 dark:text-gray-300">
          切換深淺色主題
        </button>
      </div>

      <p id="err" class="text-sm mt-5 text-red-500 dark:text-red-400 font-semibold flex items-center justify-center gap-1.5 opacity-0">
        <i data-lucide="alert-circle" class="w-4 h-4"></i> PIN 碼錯誤，請重試
      </p>

    </div>
  </div>

  <script>
    lucide.createIcons();

    window.toggleDarkMode = function() {
      const htmlEl = document.documentElement;
      const dark = !htmlEl.classList.contains('dark');
      htmlEl.classList.toggle('dark', dark);
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = dark ? '#101411' : '#F3F1EC';
    };

    function checkLogin() {
      const pinInput = document.getElementById('pin');
      const pin = pinInput.value;
      const errText = document.getElementById('err');
      const card = document.getElementById('login-card');
      const loginBtn = document.getElementById('btn-login');

      card.classList.remove('is-shaking');
      errText.classList.remove('opacity-100');
      errText.classList.add('opacity-0');

      if (pin === '0124') { 
        // 寫入授權
        sessionStorage.setItem('pm_admin_logged', 'true');
        
        // 按鈕視覺改變
        if(loginBtn) {
            loginBtn.innerHTML = `<i data-lucide="loader" class="w-5 h-5 animate-spin"></i> 載入中...`;
            lucide.createIcons();
            loginBtn.classList.add('opacity-80', 'cursor-not-allowed');
        }
        
        // 強制跳轉 (用 replace 避免禁 Back 掣返轉頭)
        setTimeout(() => {
            window.location.replace('index.html'); 
        }, 400); 
      } else {
        pinInput.value = ''; 
        pinInput.focus();
        void card.offsetWidth; 
        card.classList.add('is-shaking');
        errText.classList.remove('opacity-0');
        errText.classList.add('opacity-100');
      }
    }
  </script>
</body>
</html>
