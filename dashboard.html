  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { renderPetAvatars, DENSE_AVATAR_LIMIT, escAttr } from "./pets-avatars.js";
    import { aggregateMonthlyIncome } from "./finance-income.js";
    import { proofSummary } from "./payment-times.js";

    const firebaseConfig = { apiKey: "AIzaSyBhFUkCP0WslzdB2WY93hp6L-Z5g8vo40E", authDomain: "pawfect-memories-2c8a0.firebaseapp.com", projectId: "pawfect-memories-2c8a0", storageBucket: "pawfect-memories-2c8a0.firebasestorage.app", messagingSenderId: "860879002502", appId: "1:860879002502:web:eeaa936317b1fefc33aa07" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    lucide.createIcons();
    function updateIcons() { lucide.createIcons(); }

    window.toggleDarkMode = function() {
      const htmlEl = document.documentElement;
      const dark = !htmlEl.classList.contains('dark');
      htmlEl.classList.toggle('dark', dark);
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = dark ? '#1A1816' : '#F6F3EE';
    };

    window.showToast = function(msg, type='success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'error' ? 'bg-red-500 text-pm-on' : 'bg-pm-ink text-pm-page';
      const icon = type === 'error' ? 'alert-triangle' : 'check-circle';
      
      toast.className = `pm-toast flex items-center gap-2 ${bgColor}`;
      toast.innerHTML = `<i data-lucide="${icon}" class="w-3.5 h-3.5"></i> ${msg}`;
      
      container.appendChild(toast);
      updateIcons();
      requestAnimationFrame(() => toast.classList.add('is-in'));
      setTimeout(() => { toast.classList.remove('is-in'); toast.classList.add('is-out'); setTimeout(() => toast.remove(), 160); }, 3000);
    }

    let allOrdersData = [];

    function renderMonthlyIncome(summary) {
      const list = document.getElementById('monthly-income-list');
      const hkMoney = (amount) => `HK$ ${Number(amount || 0).toLocaleString()}`;

      if (!summary.rows.length && summary.undated <= 0) {
        list.innerHTML = `
          <div class="py-12 flex flex-col items-center justify-center text-center opacity-80">
            <div class="w-12 h-12 rounded-full bg-gray-100 dark:bg-pm-fill text-gray-400 flex items-center justify-center mb-3">
              <i data-lucide="calendar-off" class="w-5 h-5"></i>
            </div>
            <p class="text-gray-900 dark:text-white font-bold text-sm mb-0.5">暫時未有已入帳收入</p>
            <p class="text-gray-400 dark:text-gray-500 text-xs">訂單付了訂金或尾數後，會按收款或輸入日期顯示在這裡。</p>
          </div>
        `;
        updateIcons();
        return;
      }

      const max = summary.rows.reduce((peak, row) => Math.max(peak, row.amount), 0);
      const rowsHTML = summary.rows.map((row) => {
        const width = max > 0 ? Math.max(6, Math.round((row.amount / max) * 100)) : 0;
        const panelId = `month-orders-${row.key}`;
        const badge = row.current
          ? `<span class="text-[9px] bg-pm-green/10 text-pm-oak px-1.5 py-0.5 rounded-md font-bold">本月</span>`
          : "";
        const linesHTML = (row.lines || []).map((line) => {
          const note = line.parts.length === 1
            ? escAttr(line.parts[0].label)
            : line.parts.map((part) => `${escAttr(part.label)} ${hkMoney(part.amount)}`).join(" · ");
          const times = escAttr(proofSummary(line.proof, line.parts.map((part) => part.label)));
          const avatars = renderPetAvatars(line.pets, { sizeClass: "w-8 h-8", singleClass: "border border-gray-100 dark:border-pm-dark-border", overlapClass: "-ml-2.5", maxVisible: DENSE_AVATAR_LIMIT });
          const safeId = /^[A-Za-z0-9_-]+$/.test(line.id);
          const rowClass = "px-5 md:px-6 py-3 flex items-center justify-between gap-3 hover:bg-white dark:hover:bg-pm-fill/50 transition-colors";
          const body = `
            <div class="flex items-center gap-3 overflow-hidden min-w-0">
              ${avatars}
              <div class="overflow-hidden min-w-0">
                <h4 class="font-bold text-xs text-gray-900 dark:text-white truncate">${escAttr(line.clientName)} · ${escAttr(line.petNames)}</h4>
                <p class="text-[10px] text-gray-400 dark:text-gray-500 mt-0.5 truncate">${note}</p>
                ${times ? `<p class="text-[10px] text-gray-400 dark:text-gray-500 mt-0.5 leading-relaxed">${times}</p>` : ""}
              </div>
            </div>
            <div class="text-right shrink-0 flex items-center gap-1">
              <div>
                <p class="text-[9px] text-gray-400 font-bold uppercase tracking-wider">本月入帳</p>
                <p class="font-bold text-sm text-gray-900 dark:text-white">${hkMoney(line.amount)}</p>
              </div>
              ${safeId ? `<i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 dark:text-gray-600"></i>` : ""}
            </div>
          `;
          if (!safeId) return `<div class="${rowClass}">${body}</div>`;
          return `<a href="detail.html?id=${line.id}" class="${rowClass} group">${body}</a>`;
        }).join("");
        return `
          <div>
            <button type="button" data-month-toggle aria-expanded="false" aria-controls="${panelId}" class="w-full px-5 md:px-6 py-4 flex items-center gap-3 md:gap-4 text-left hover:bg-gray-50 dark:hover:bg-pm-fill/60 transition-colors">
              <div class="w-28 shrink-0">
                <p class="font-bold text-sm text-gray-900 dark:text-white leading-tight">${row.label}</p>
                <p class="text-[10px] text-gray-400 dark:text-gray-500 mt-0.5 flex items-center gap-1.5 flex-wrap"><span>${row.orders} 單</span>${badge}</p>
              </div>
              <div class="flex-1 min-w-[3.5rem] h-2 rounded-full bg-gray-100 dark:bg-pm-fill overflow-hidden" aria-hidden="true">
                <div class="h-full rounded-full bg-pm-oak" style="width:${width}%"></div>
              </div>
              <p class="font-serif font-bold text-sm md:text-base text-gray-900 dark:text-white text-right shrink-0">${hkMoney(row.amount)}</p>
              <i data-lucide="chevron-down" class="month-chevron w-4 h-4 text-gray-300 dark:text-gray-600 shrink-0 transition-transform"></i>
            </button>
            <div id="${panelId}" class="hidden border-t border-gray-100 dark:border-pm-dark-border bg-gray-50/70 dark:bg-pm-fill/40 divide-y divide-gray-100 dark:divide-pm-dark-border">
              ${linesHTML}
            </div>
          </div>
        `;
      }).join("");

      const undatedHTML = summary.undated > 0 ? `
        <div class="px-5 md:px-6 py-3 text-[11px] text-gray-400 dark:text-gray-500">
          另有 ${hkMoney(summary.undated)} 已收款，但缺少入帳日期，未歸入月份。
        </div>
      ` : "";

      list.innerHTML = `
        ${rowsHTML}
        ${undatedHTML}
        <div class="px-5 md:px-6 py-3.5 bg-gray-50/80 dark:bg-pm-fill/40 flex items-center justify-between gap-3">
          <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400">已入帳合計</span>
          <span class="font-serif font-bold text-sm text-pm-oak">${hkMoney(summary.total)}</span>
        </div>
      `;
      list.onclick = (event) => {
        const button = event.target.closest("[data-month-toggle]");
        if (!button || !list.contains(button)) return;
        const panel = document.getElementById(button.getAttribute("aria-controls"));
        if (!panel) return;
        const open = button.getAttribute("aria-expanded") === "true";
        button.setAttribute("aria-expanded", open ? "false" : "true");
        panel.classList.toggle("hidden", open);
      };
      updateIcons();
    }


    // [SKILL: Code Review & Performance Boost] Asynchronous caching pipeline strategy
    async function loadDashboard() {
      try {
        // Parallel non-blocking extraction requests
        const [ordersSnap, clientsSnap] = await Promise.all([
          getDocs(collection(db, "Orders")),
          getDocs(collection(db, "Clients"))
        ]);

        const clientCache = {};
        clientsSnap.forEach(cDoc => { clientCache[cDoc.id] = cDoc.data(); });

        let totalRev = 0;
        let totalPending = 0;
        let pendingHTML = '';
        const incomeOrders = [];
        allOrdersData = [];

        for (let docSnap of ordersSnap.docs) {
          const data = docSnap.data();
          const orderId = docSnap.id;

          let clientName = "未知客戶"; let clientPhone = ""; let clientIg = "";
          if (data.clientId && clientCache[data.clientId]) {
            const cData = clientCache[data.clientId];
            clientName = cData.name || "未知客戶";
            clientPhone = cData.phone || "";
            clientIg = cData.instagram || "";
          }

          let pets = data.pets || [];
          if (pets.length === 0 && data.petName) pets = [{ name: data.petName, photoUrl: data.photoUrl }];
          let petNames = pets.length > 0 ? pets.map(p => p.name).join(' & ') : "未填寫";
          const avatarsHTML = renderPetAvatars(pets, { sizeClass: "w-8 h-8", singleClass: "border border-gray-100 dark:border-pm-dark-border", overlapClass: "-ml-2.5", maxVisible: DENSE_AVATAR_LIMIT });

          const price = Number(data.price || 0);
          const deposit = Number(data.depositAmount || 0);
          const balance = price - deposit;
          totalRev += price;
          incomeOrders.push({
            id: orderId,
            clientName,
            petNames,
            pets,
            price: data.price,
            depositAmount: data.depositAmount,
            paymentStatus: data.paymentStatus,
            depositPaid: data.depositPaid,
            depositReceivedAt: data.depositReceivedAt,
            balanceReceivedAt: data.balanceReceivedAt,
            depositSlipUploadedAt: data.depositSlipUploadedAt,
            balanceSlipUploadedAt: data.balanceSlipUploadedAt,
            depositDate: data.depositDate,
            balanceDate: data.balanceDate,
            createdAt: data.createdAt,
            enteredAt: data.enteredAt,
            shootDate: data.shootDate
          });

          let paymentText = "未付款";
          const pStatus = data.paymentStatus || (data.depositPaid ? "deposit" : "unpaid");
          if (pStatus === 'full') paymentText = "全數已付";
          else if (pStatus === 'deposit') paymentText = "已付訂金";

          allOrdersData.push({
            "No.": data.invoiceNumber || orderId,
            "Client": clientName,
            "Pet": petNames,
            "Tel/IG": `${clientPhone} ${clientIg ? '/ '+clientIg : ''}`.trim(),
            "Shooting date": data.shootDate || "",
            "Platform": data.platform || "",
            "Package": data.package || "",
            "Studio": data.studio || "",
            "Deposit": deposit || 0,
            "Deposit date": data.depositDate || "",
            "Balance": balance > 0 ? balance : 0,
            "Balance Date": data.balanceDate || "",
            "Product": data.product || "",
            "Payment": paymentText,
            "Total": price,
            "Submission date": data.submissionDate || "",
            "Other Fee": data.otherFee || ""
          });

          // [SKILL: UI-UX-Pro-Max] Micro-interaction List Rows
          if (pStatus === 'deposit' && balance > 0) {
            totalPending += balance;
            pendingHTML += `
              <div class="p-5 flex items-center justify-between gap-4 hover:bg-gray-50 dark:hover:bg-pm-fill/60 transition-colors cursor-pointer group" onclick="window.location.href='detail.html?id=${orderId}'">
                <div class="flex items-center gap-3 overflow-hidden">
                  ${avatarsHTML}
                  <div class="overflow-hidden">
                    <div class="flex items-center gap-2 mb-0.5">
                      <h4 class="font-bold text-xs text-gray-900 dark:text-white group-hover:text-pm-oak transition-colors truncate">${clientName} · ${petNames}</h4>
                      <span class="text-[9px] bg-pm-warning/10 border border-pm-warning/40 text-pm-warning px-1.5 py-0.5 rounded-md font-bold uppercase tracking-wider scale-90 shrink-0">欠尾數</span>
                    </div>
                    <p class="text-[10px] text-gray-400 dark:text-gray-500 flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> 拍攝日: ${data.shootDate || '未定'} | 套餐: ${data.package || '未定'}</p>
                  </div>
                </div>
                <div class="text-right shrink-0 flex items-center gap-1">
                  <div>
                    <p class="text-[9px] text-gray-400 font-bold uppercase tracking-wider">尚欠尾數</p>
                    <p class="font-bold text-red-500 dark:text-red-400 text-sm">HK$ ${balance.toLocaleString()}</p>
                  </div>
                  <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 dark:text-gray-600 transform group-hover:translate-x-0.5 transition-transform"></i>
                </div>
              </div>
            `;
          } else if (pStatus === 'unpaid' && price > 0) {
            totalPending += price;
            pendingHTML += `
              <div class="p-5 flex items-center justify-between gap-4 hover:bg-gray-50 dark:hover:bg-pm-fill/60 transition-colors cursor-pointer group" onclick="window.location.href='detail.html?id=${orderId}'">
                <div class="flex items-center gap-3 overflow-hidden">
                  ${avatarsHTML}
                  <div class="overflow-hidden">
                    <div class="flex items-center gap-2 mb-0.5">
                      <h4 class="font-bold text-xs text-gray-900 dark:text-white group-hover:text-pm-oak transition-colors truncate">${clientName} · ${petNames}</h4>
                      <span class="text-[9px] bg-red-50 dark:bg-red-500/10 border border-red-100 dark:border-red-500/20 text-red-500 px-1.5 py-0.5 rounded-md font-bold uppercase tracking-wider scale-90 shrink-0">未付款</span>
                    </div>
                    <p class="text-[10px] text-gray-400 dark:text-gray-500 truncate font-medium flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> 拍攝日: ${data.shootDate || '未定'} | 套餐: ${data.package || '未定'}</p>
                  </div>
                </div>
                <div class="text-right shrink-0 flex items-center gap-1">
                  <div>
                    <p class="text-[9px] text-gray-400 font-bold uppercase tracking-wider">總費用</p>
                    <p class="font-bold text-red-500 dark:text-red-400 text-sm">HK$ ${price.toLocaleString()}</p>
                  </div>
                  <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 dark:text-gray-600 transform group-hover:translate-x-0.5 transition-transform"></i>
                </div>
              </div>
            `;
          }
        }

        document.getElementById('total-revenue').innerText = `HK$ ${totalRev.toLocaleString()}`;
        document.getElementById('total-pending').innerText = `HK$ ${totalPending.toLocaleString()}`;
        renderMonthlyIncome(aggregateMonthlyIncome(incomeOrders));
        
        const emptyStateHTML = `
          <div class="py-12 flex flex-col items-center justify-center text-center opacity-80">
            <div class="w-12 h-12 rounded-full bg-pm-green/10 text-pm-oak flex items-center justify-center mb-3">
                <i data-lucide="party-popper" class="w-5 h-5"></i>
            </div>
            <p class="text-gray-900 dark:text-white font-bold text-sm mb-0.5">清數找齊！</p>
            <p class="text-gray-400 dark:text-gray-500 text-xs">目前沒有任何客戶拖欠尾數</p>
          </div>
        `;
        
        document.getElementById('pending-list').innerHTML = pendingHTML || emptyStateHTML;
        updateIcons();

      } catch (err) {
        // [SKILL: Code Review] Automated fallback defensive interface degradation
        console.error("Dashboard Extraction Error:", err);
        document.getElementById('dashboard-main-container').innerHTML = `
          <div class="flex flex-col items-center justify-center py-20 text-center">
            <div class="w-12 h-12 rounded-full bg-red-50 dark:bg-red-500/10 text-red-500 flex items-center justify-center mb-4"><i data-lucide="wifi-off" class="w-6 h-6"></i></div>
            <h4 class="font-bold text-gray-900 dark:text-white mb-1">同步財務數據失敗</h4>
            <p class="text-xs text-gray-400 max-w-xs mb-4">無法建立安全財務管線連接，請檢查網路狀態或重新登入憑證。</p>
            <button onclick="window.location.reload()" class="bg-pm-oak text-pm-on px-4 py-2 rounded-xl text-xs font-bold shadow-sm">重新安全連線</button>
          </div>
        `;
        updateIcons();
      }
    }

    loadDashboard();

    // Excel 匯出邏輯 (附帶自動 Micro-Interaction 按鈕回饋)
    document.getElementById('btn-export-excel').addEventListener('click', () => {
        if (allOrdersData.length === 0) {
            showToast("目前庫存無任何訂單紀錄可供匯出", "error");
            return;
        }
        
        const btn = document.getElementById('btn-export-excel');
        const originalHTML = btn.innerHTML;
        btn.innerHTML = `<i data-lucide="loader" class="w-3.5 h-3.5 animate-spin"></i> 匯出中...`;
        btn.classList.add('opacity-70', 'cursor-not-allowed');
        updateIcons();
        
        setTimeout(() => {
            try {
                const headerOrder = ["No.", "Client", "Pet", "Tel/IG", "Shooting date", "Platform", "Package", "Studio", "Deposit", "Deposit date", "Balance", "Balance Date", "Product", "Payment", "Total", "Submission date", "Other Fee"];
                const worksheet = XLSX.utils.json_to_sheet(allOrdersData, { header: headerOrder });
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "2026 Summary");

                const today = new Date().toISOString().split('T')[0];
                XLSX.writeFile(workbook, `Pawfect_Memories_Export_${today}.xlsx`);
                
                showToast("✅ 已成功匯出最新 Excel 財務報表");
            } catch(e) {
                showToast("匯出處理失敗", "error");
            } finally {
                btn.innerHTML = originalHTML;
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
                updateIcons();
            }
        }, 600);
    });
  </script>
</body>
</html>
