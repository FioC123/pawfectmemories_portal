  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');

    <div class="px-2.5 pb-6 flex flex-col gap-1.5 w-full overflow-hidden border-t border-gray-100 dark:border-white/5 pt-4">

        <i data-lucide="moon" class="w-5 h-5 shrink-0 dark:hidden"></i><i data-lucide="sun" class="w-5 h-5 shrink-0 hidden dark:block"></i>

  <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
    
    <header class="h-20 flex justify-between items-center px-6 md:px-8 shrink-0 border-b border-gray-200/60 dark:border-pm-dark-border bg-white/50 dark:bg-pm-dark-bg/50 backdrop-blur-md z-30">
      <div class="flex flex-col">
        <h2 class="font-serif text-2xl font-bold tracking-tight text-gray-900 dark:text-white">財務中心</h2>
      </div>
      
      <button id="btn-export-excel" class="excel-green text-white px-4 py-2.5 rounded-xl font-bold text-xs flex items-center gap-1.5 hover:opacity-90 active:scale-95 shadow-sm transition-all shrink-0">

    <main class="flex-1 overflow-y-auto custom-scrollbar p-6 md:p-8 space-y-6 bg-pm-cream dark:bg-pm-dark-bg" id="dashboard-main-container">
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

          <div class="absolute top-0 right-0 p-6 opacity-[0.03] dark:opacity-[0.02] group-hover:scale-110 transition-transform duration-500 pointer-events-none">

          </div>
          <p id="total-revenue" class="text-3xl md:text-4xl font-serif font-bold text-gray-900 dark:text-white">載入中...</p>

        <div class="bg-white dark:bg-pm-dark-surface p-6 md:p-8 rounded-[24px] border border-gray-200/50 dark:border-white/5 shadow-taste dark:shadow-taste-dark relative overflow-hidden group transition-colors">
          <div class="absolute top-0 right-0 p-6 opacity-[0.03] dark:opacity-[0.02] group-hover:scale-110 transition-transform duration-500 pointer-events-none">
            <i data-lucide="alert-circle" class="w-24 h-24 text-red-500"></i>
          </div>
          <div class="flex items-center gap-2 mb-3">
            <div class="w-7 h-7 rounded-full bg-red-50 dark:bg-red-500/10 text-red-500 flex items-center justify-center"><i data-lucide="clock" class="w-4 h-4"></i></div>
            <p class="text-[10px] font-bold uppercase tracking-wider text-gray-400">未收尾數總額</p>
          </div>
          <p id="total-pending" class="text-3xl md:text-4xl font-serif font-bold text-red-500 dark:text-red-400">載入中...</p>
        </div>
      </div>

      <div class="bg-white dark:bg-pm-dark-surface rounded-[24px] border border-gray-200/50 dark:border-white/5 shadow-taste dark:shadow-taste-dark overflow-hidden transition-colors">
        <div class="p-6 border-b border-gray-100 dark:border-pm-dark-border flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-red-50 dark:bg-red-500/10 text-red-500 flex items-center justify-center shrink-0">
            <i data-lucide="alert-triangle" class="w-4 h-4"></i>
          </div>
          <h3 class="font-serif font-bold text-lg text-gray-900 dark:text-white">待追收尾數名單</h3>
        </div>
        
        <div id="pending-list" class="divide-y divide-gray-100 dark:divide-pm-dark-border">
          <div class="p-6 text-center text-xs text-gray-400 animate-pulse">正在進行遠端同步與分析中...</div>
        </div>
      </div>

    </main>
  </div>

  <div id="toast-container" class="fixed bottom-8 right-8 z-[100] flex flex-col gap-3 pointer-events-none"></div>

  <nav class="md:hidden fixed bottom-0 w-full h-16 bg-white dark:bg-pm-dark-surface border-t border-gray-200/60 dark:border-pm-dark-border z-40 flex items-center justify-around px-2 pb-safe shadow-lg">
    <a href="index.html" class="flex flex-col items-center p-2 text-gray-400"><i data-lucide="layout-dashboard" class="w-5 h-5 mb-0.5"></i><span class="text-[9px] font-bold">工作區</span></a>
    <a href="add.html" class="flex flex-col items-center p-2 text-gray-400"><i data-lucide="plus-square" class="w-5 h-5 mb-0.5"></i><span class="text-[9px] font-bold">新增</span></a>
    <a href="dashboard.html" class="flex flex-col items-center p-2 text-pm-oak"><i data-lucide="pie-chart" class="w-5 h-5 mb-0.5"></i><span class="text-[9px] font-bold">財務</span></a>
    <a href="settings.html" class="flex flex-col items-center p-2 text-gray-400"><i data-lucide="settings" class="w-5 h-5 mb-0.5"></i><span class="text-[9px] font-bold">設定</span></a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBhFUkCP0WslzdB2WY93hp6L-Z5g8vo40E", authDomain: "pawfect-memories-2c8a0.firebaseapp.com", projectId: "pawfect-memories-2c8a0", storageBucket: "pawfect-memories-2c8a0.firebasestorage.app", messagingSenderId: "860879002502", appId: "1:860879002502:web:eeaa936317b1fefc33aa07" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    lucide.createIcons();
    function updateIcons() { lucide.createIcons(); }

    window.toggleDarkMode = function() {
      const htmlEl = document.documentElement;
      if (htmlEl.classList.contains('dark')) { htmlEl.classList.remove('dark'); localStorage.setItem('theme', 'light'); } 
      else { htmlEl.classList.add('dark'); localStorage.setItem('theme', 'dark'); }
    };

    window.showToast = function(msg, type='success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'error' ? 'bg-red-500 text-white' : 'bg-gray-900 dark:bg-white text-white dark:text-gray-900';
      const icon = type === 'error' ? 'alert-triangle' : 'check-circle';
      
      toast.className = `px-4 py-2.5 rounded-xl shadow-2xl text-xs font-bold transform transition-all translate-y-10 opacity-0 flex items-center gap-2 ${bgColor}`;
      toast.innerHTML = `<i data-lucide="${icon}" class="w-3.5 h-3.5"></i> ${msg}`;
      
      container.appendChild(toast);
      updateIcons();
      requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
      setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    let allOrdersData = [];

    // [SKILL: Code Review & Performance Boost] Asynchronous caching pipeline strategy
    async function loadDashboard() {
      try {
        // Parallel non-blocking extraction requests
        const [ordersSnap, clientsSnap] = await Promise.all([
          getDocs(collection(db, "Orders")),
          getDocs(collection(db, "Clients"))
        ]);

        const clientCache = {};
        clientsSnap.forEach(cDoc => { clientCache[cDoc.id] = cDoc.data(); });

        let totalRev = 0;
        let totalPending = 0;
        let pendingHTML = '';
        allOrdersData = [];

        for (let docSnap of ordersSnap.docs) {
          const data = docSnap.data();
          const orderId = docSnap.id;

          let clientName = "未知客戶"; let clientPhone = ""; let clientIg = "";
          if (data.clientId && clientCache[data.clientId]) {
            const cData = clientCache[data.clientId];
            clientName = cData.name || "未知客戶";
            clientPhone = cData.phone || "";
            clientIg = cData.instagram || "";
          }

          let pets = data.pets || [];
          if (pets.length === 0 && data.petName) pets = [{ name: data.petName, photoUrl: data.photoUrl }];
          let petNames = pets.length > 0 ? pets.map(p => p.name).join(' & ') : "未填寫";
          let avatar = pets.length > 0 && pets[0].photoUrl ? pets[0].photoUrl : "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=150&h=150&fit=crop";

          const price = Number(data.price || 0);
          const deposit = Number(data.depositAmount || 0);
          const balance = price - deposit;
          totalRev += price;

          let paymentText = "未付款";
          const pStatus = data.paymentStatus || (data.depositPaid ? "deposit" : "unpaid");
          if (pStatus === 'full') paymentText = "全數已付";
          else if (pStatus === 'deposit') paymentText = "已付訂金";

          allOrdersData.push({
            "No.": data.invoiceNumber || orderId,
            "Client": clientName,
            "Pet": petNames,
            "Tel/IG": `${clientPhone} ${clientIg ? '/ '+clientIg : ''}`.trim(),
            "Shooting date": data.shootDate || "",
            "Platform": data.platform || "",
            "Package": data.package || "",
            "Studio": data.studio || "",
            "Deposit": deposit || 0,
            "Deposit date": data.depositDate || "",
            "Balance": balance > 0 ? balance : 0,
            "Balance Date": data.balanceDate || "",
            "Product": data.product || "",
            "Payment": paymentText,
            "Total": price,
            "Submission date": data.submissionDate || "",
            "Other Fee": data.otherFee || ""
          });

          // [SKILL: UI-UX-Pro-Max] Micro-interaction List Rows
          if (pStatus === 'deposit' && balance > 0) {
            totalPending += balance;
            pendingHTML += `
              <div class="p-5 flex items-center justify-between gap-4 hover:bg-gray-50 dark:hover:bg-[#1A211D]/30 transition-colors cursor-pointer group" onclick="window.location.href='detail.html?id=${orderId}'">
                <div class="flex items-center gap-3 overflow-hidden">
                  <img src="${avatar}" class="w-8 h-8 rounded-full object-cover border border-gray-100 dark:border-pm-dark-border">
                  <div class="overflow-hidden">
                    <div class="flex items-center gap-2 mb-0.5">
                      <h4 class="font-bold text-xs text-gray-900 dark:text-white group-hover:text-pm-oak transition-colors truncate">${clientName} · ${petNames}</h4>
                      <span class="text-[9px] bg-pm-oak/10 border border-pm-oak/20 text-pm-oak px-1.5 py-0.5 rounded-md font-bold uppercase tracking-wider scale-90 shrink-0">欠尾數</span>
                    </div>
                    <p class="text-[10px] text-gray-400 dark:text-gray-500 flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> 拍攝日: ${data.shootDate || '未定'} | 套餐: ${data.package || '未定'}</p>
                  </div>
                </div>
                <div class="text-right shrink-0 flex items-center gap-1">
                  <div>
                    <p class="text-[9px] text-gray-400 font-bold uppercase tracking-wider">尚欠尾數</p>
                    <p class="font-bold text-red-500 dark:text-red-400 text-sm">HK$ ${balance.toLocaleString()}</p>
                  </div>
                  <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 dark:text-gray-600 transform group-hover:translate-x-0.5 transition-transform"></i>
                </div>
              </div>
            `;
          } else if (pStatus === 'unpaid' && price > 0) {
            totalPending += price;
            pendingHTML += `
              <div class="p-5 flex items-center justify-between gap-4 hover:bg-gray-50 dark:hover:bg-[#1A211D]/30 transition-colors cursor-pointer group" onclick="window.location.href='detail.html?id=${orderId}'">
                <div class="flex items-center gap-3 overflow-hidden">
                  <img src="${avatar}" class="w-8 h-8 rounded-full object-cover border border-gray-100 dark:border-pm-dark-border">
                  <div class="overflow-hidden">
                    <div class="flex items-center gap-2 mb-0.5">
                      <h4 class="font-bold text-xs text-gray-900 dark:text-white group-hover:text-pm-oak transition-colors truncate">${clientName} · ${petNames}</h4>
                      <span class="text-[9px] bg-red-50 dark:bg-red-500/10 border border-red-100 dark:border-red-500/20 text-red-500 px-1.5 py-0.5 rounded-md font-bold uppercase tracking-wider scale-90 shrink-0">未付款</span>
                    </div>
                    <p class="text-[10px] text-gray-400 dark:text-gray-500 truncate font-medium flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> 拍攝日: ${data.shootDate || '未定'} | 套餐: ${data.package || '未定'}</p>
                  </div>
                </div>
                <div class="text-right shrink-0 flex items-center gap-1">
                  <div>
                    <p class="text-[9px] text-gray-400 font-bold uppercase tracking-wider">總費用</p>
                    <p class="font-bold text-red-500 dark:text-red-400 text-sm">HK$ ${price.toLocaleString()}</p>
                  </div>
                  <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 dark:text-gray-600 transform group-hover:translate-x-0.5 transition-transform"></i>
                </div>
              </div>
            `;
          }
        }

        document.getElementById('total-revenue').innerText = `HK$ ${totalRev.toLocaleString()}`;
        document.getElementById('total-pending').innerText = `HK$ ${totalPending.toLocaleString()}`;
        
        const emptyStateHTML = `
          <div class="py-12 flex flex-col items-center justify-center text-center opacity-80">
            <div class="w-12 h-12 rounded-full bg-pm-green/10 text-pm-green dark:text-[#8DBA76] flex items-center justify-center mb-3">
                <i data-lucide="party-popper" class="w-5 h-5"></i>
            </div>
            <p class="text-gray-900 dark:text-white font-bold text-sm mb-0.5">清數找齊！</p>
            <p class="text-gray-400 dark:text-gray-500 text-xs">目前沒有任何客戶拖欠尾數 🥳</p>
          </div>
        `;
        
        document.getElementById('pending-list').innerHTML = pendingHTML || emptyStateHTML;
        updateIcons();

      } catch (err) {
        // [SKILL: Code Review] Automated fallback defensive interface degradation
        console.error("Dashboard Extraction Error:", err);
        document.getElementById('dashboard-main-container').innerHTML = `
          <div class="flex flex-col items-center justify-center py-20 text-center">
            <div class="w-12 h-12 rounded-full bg-red-50 dark:bg-red-500/10 text-red-500 flex items-center justify-center mb-4"><i data-lucide="wifi-off" class="w-6 h-6"></i></div>
            <h4 class="font-bold text-gray-900 dark:text-white mb-1">同步財務數據失敗</h4>
            <p class="text-xs text-gray-400 max-w-xs mb-4">無法建立安全財務管線連接，請檢查網路狀態或重新登入憑證。</p>
            <button onclick="window.location.reload()" class="bg-pm-green text-white dark:bg-pm-oak dark:text-gray-900 px-4 py-2 rounded-xl text-xs font-bold shadow-sm">重新安全連線</button>
          </div>
        `;
        updateIcons();
      }
    }

    loadDashboard();

    // Excel 匯出邏輯 (附帶自動 Micro-Interaction 按鈕回饋)
    document.getElementById('btn-export-excel').addEventListener('click', () => {
        if (allOrdersData.length === 0) {
            showToast("目前庫存無任何訂單紀錄可供匯出", "error");
            return;
        }
        
        const btn = document.getElementById('btn-export-excel');
        const originalHTML = btn.innerHTML;
        btn.innerHTML = `<i data-lucide="loader" class="w-3.5 h-3.5 animate-spin"></i> 匯出中...`;
        btn.classList.add('opacity-70', 'cursor-not-allowed');
        updateIcons();
        
        setTimeout(() => {
            try {
                const headerOrder = ["No.", "Client", "Pet", "Tel/IG", "Shooting date", "Platform", "Package", "Studio", "Deposit", "Deposit date", "Balance", "Balance Date", "Product", "Payment", "Total", "Submission date", "Other Fee"];
                const worksheet = XLSX.utils.json_to_sheet(allOrdersData, { header: headerOrder });
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "2026 Summary");

                const today = new Date().toISOString().split('T')[0];
                XLSX.writeFile(workbook, `Pawfect_Memories_Export_${today}.xlsx`);
                
                showToast("✅ 已成功匯出最新 Excel 財務報表");
            } catch(e) {
                showToast("匯出處理失敗", "error");
            } finally {
                btn.innerHTML = originalHTML;
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
                updateIcons();
            }
        }, 600);
    });
  </script>
</body>
