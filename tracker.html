<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    body { background: #131313; color: white; font-family: 'Manrope', sans-serif; }
    .step-line { position: absolute; top: 15px; left: 16px; bottom: -15px; width: 2px; background: #2a2a2a; z-index: 0; }
    .step-active .step-line { background: #4edea3; }
  </style>
</head>
<body class="p-6 md:p-12 max-w-lg mx-auto">
  
  <div class="text-center mb-10 relative">
    <button id="btn-back-portal" onclick="window.location.href='portal.html'" class="absolute left-0 top-1/2 -translate-y-1/2 hidden flex items-center gap-1 text-gray-400 hover:text-white transition-colors text-sm font-bold">
        <span class="material-symbols-outlined text-[18px]">arrow_back</span> 列表
    </button>
    <h1 class="text-3xl font-black text-[#4edea3] font-['Dancing_Script']">Pawfect Memories</h1>
    <p class="text-gray-500 text-xs mt-1 uppercase tracking-widest">Client Portal</p>
  </div>

  <div id="login-box" class="space-y-4 mb-10">
    <input type="tel" id="phone" placeholder="請輸入登記電話 (8位)" class="w-full bg-[#1c1b1b] border border-white/10 rounded-2xl px-6 py-4 text-center font-bold text-lg outline-none focus:border-[#4edea3] transition-colors">
    <button id="btn-track" class="w-full bg-gradient-to-r from-[#4edea3] to-[#10b981] text-[#003824] font-black py-4 rounded-2xl shadow-xl active:scale-95 transition-transform">即時查詢</button>
  </div>

  <div id="result" class="hidden">
    <div class="bg-[#1c1b1b] rounded-3xl p-6 border border-white/10 mb-8 shadow-2xl">
      <div class="flex justify-between items-start mb-6">
        <div>
          <p id="res-pet" class="text-xl font-black"></p>
          <p id="res-package" class="text-[10px] text-[#4edea3] font-bold uppercase tracking-widest mt-1"></p>
        </div>
        <div class="text-right">
          <p id="res-date" class="text-sm font-bold"></p>
          <p id="res-location" class="text-[10px] text-gray-500"></p>
        </div>
      </div>

      <div id="stepper" class="space-y-6">
        <div class="flex gap-4 relative" id="s-1">
            <div class="step-line"></div>
            <div class="w-8 h-8 rounded-full bg-[#2a2a2a] flex items-center justify-center z-10 s-icon"><span class="material-symbols-outlined text-sm">schedule</span></div>
            <div><p class="font-bold text-sm">新預約</p><p class="text-[10px] text-gray-500">已收到您的預約申請</p></div>
        </div>
        <div class="flex gap-4 relative" id="s-2">
            <div class="step-line"></div>
            <div class="w-8 h-8 rounded-full bg-[#2a2a2a] flex items-center justify-center z-10 s-icon"><span class="material-symbols-outlined text-sm">auto_fix_high</span></div>
            <div><p class="font-bold text-sm">基本修輯</p><p class="text-[10px] text-gray-500">正在處理光暗及色調優化</p></div>
        </div>
        <div class="flex gap-4 relative" id="s-3">
            <div class="step-line"></div>
            <div class="w-8 h-8 rounded-full bg-[#2a2a2a] flex items-center justify-center z-10 s-icon"><span class="material-symbols-outlined text-sm">photo_library</span></div>
            <div><p class="font-bold text-sm">揀相</p><p class="text-[10px] text-gray-500">相片已備妥，請挑選精修相片</p></div>
        </div>
        <div class="flex gap-4 relative" id="s-4">
            <div class="step-line"></div>
            <div class="w-8 h-8 rounded-full bg-[#2a2a2a] flex items-center justify-center z-10 s-icon"><span class="material-symbols-outlined text-sm">brush</span></div>
            <div><p class="font-bold text-sm">精修</p><p class="text-[10px] text-gray-500">正在進行精細人像/寵物修飾</p></div>
        </div>
        <div class="flex gap-4 relative" id="s-5">
            <div class="w-8 h-8 rounded-full bg-[#2a2a2a] flex items-center justify-center z-10 s-icon"><span class="material-symbols-outlined text-sm">check_circle</span></div>
            <div><p class="font-bold text-sm">完成</p><p class="text-[10px] text-gray-500">相片已全數交付，感謝您的耐心等待</p></div>
        </div>
      </div>

      <div id="gallery-box" class="mt-8 pt-6 border-t border-white/5 hidden">
          <p class="text-xs text-[#4edea3] font-bold mb-3 text-center">🎉 您的相片已準備好！</p>
          <a id="gallery-link" href="#" target="_blank" class="w-full bg-[#4edea3]/10 text-[#4edea3] py-3 rounded-xl flex items-center justify-center gap-2 font-bold text-sm border border-[#4edea3]/30 hover:bg-[#4edea3]/20 transition-colors">
            <span class="material-symbols-outlined text-lg">cloud_download</span> 前往雲端相簿
          </a>
          <div class="mt-3 flex items-center gap-2">
            <input type="text" id="gallery-url-text" readonly class="bg-black/20 border border-white/10 rounded-lg px-3 py-2.5 text-[10px] text-gray-400 w-full outline-none">
            <button onclick="copyGalleryLink()" class="bg-white/10 p-2.5 rounded-lg text-white hover:bg-white/20 transition-colors flex shrink-0 active:scale-95" title="複製連結">
              <span class="material-symbols-outlined text-sm">content_copy</span>
            </button>
          </div>
      </div>
    </div>

    <div id="finance-card" class="rounded-2xl p-5 flex justify-between items-center">
      <div>
        <p id="finance-title" class="text-[10px] uppercase font-bold tracking-widest"></p>
        <p id="res-finance" class="text-sm font-bold mt-1 text-white"></p>
      </div>
      <p id="res-balance" class="text-lg font-black"></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    
    const app = initializeApp({ apiKey: "AIzaSyBhFUkCP0WslzdB2WY93hp6L-Z5g8vo40E", authDomain: "pawfect-memories-2c8a0.firebaseapp.com", projectId: "pawfect-memories-2c8a0", storageBucket: "pawfect-memories-2c8a0.firebasestorage.app", messagingSenderId: "860879002502", appId: "1:860879002502:web:eeaa936317b1fefc33aa07" });
    const db = getFirestore(app); 
    const stepMap = { "col-new": 1, "col-basic-edit": 2, "col-pick-photos": 3, "col-final-retouch": 4, "col-completed": 5 };

    window.copyGalleryLink = () => {
      const linkInput = document.getElementById('gallery-url-text');
      navigator.clipboard.writeText(linkInput.value).then(() => { alert("✅ 已成功複製相簿連結！"); }).catch(err => alert("複製失敗，請手動複製。"));
    };

    // 🚨 自動跳過登入邏輯 🚨
    const urlParams = new URLSearchParams(window.location.search);
    const targetOrderId = urlParams.get('id');

    if (targetOrderId) {
        // 隱藏輸入框，顯示返回按鈕
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('btn-back-portal').classList.remove('hidden');
        loadOrderData(targetOrderId);
    }

    // 如果客人喺舊版 tracker 入電話，直接彈去 portal
    document.getElementById('btn-track').onclick = () => {
      const phone = document.getElementById('phone').value.trim(); 
      if(phone.length < 8) return alert("請輸入正確號碼");
      window.location.href = `portal.html?phone=${phone}`;
    };

    async function loadOrderData(orderId) {
      try {
        const snap = await getDoc(doc(db, "Orders", orderId));
        if(!snap.exists()) {
            alert("找不到此單據！");
            window.location.href = 'portal.html';
            return;
        }
        
        const d = snap.data();
        document.getElementById('res-pet').innerText = d.pets ? d.pets.map(p=>p.name).join(' & ') : ''; 
        document.getElementById('res-package').innerText = d.package;
        document.getElementById('res-date').innerText = d.shootDate; 
        document.getElementById('res-location').innerText = d.shootLocation;
        
        const cLv = stepMap[d.status] || 1;
        
        ['s-1','s-2','s-3','s-4','s-5'].forEach(sId => {
            const el = document.getElementById(sId);
            el.classList.remove('step-active');
            const icon = el.querySelector('.s-icon');
            icon.classList.replace('bg-[#4edea3]', 'bg-[#2a2a2a]');
            icon.classList.remove('text-[#003824]');
            el.querySelector('p').classList.replace('text-white', 'text-gray-500');
        });

        ['s-1','s-2','s-3','s-4','s-5'].forEach((sId, i) => {
          const el = document.getElementById(sId); 
          const icon = el.querySelector('.s-icon');
          if(i < cLv) { 
              el.classList.add('step-active'); 
              icon.classList.replace('bg-[#2a2a2a]','bg-[#4edea3]'); 
              icon.classList.add('text-[#003824]'); 
              el.querySelector('p').classList.replace('text-gray-500','text-white'); 
          }
        });

        if(cLv >= 3 && d.galleryUrl) { 
            document.getElementById('gallery-box').classList.remove('hidden'); 
            document.getElementById('gallery-link').href = d.galleryUrl;
            document.getElementById('gallery-url-text').value = d.galleryUrl;
        } else {
            document.getElementById('gallery-box').classList.add('hidden'); 
        }
        
        const pStat = d.paymentStatus || 'unpaid';
        const price = Number(d.price || 0);
        const dep = Number(d.depositAmount || 0);
        const bal = price - dep;

        const fCard = document.getElementById('finance-card');
        const fTitle = document.getElementById('finance-title');
        const fStat = document.getElementById('res-finance');
        const fBal = document.getElementById('res-balance');

        if (pStat === 'full' || bal <= 0) {
            fCard.className = "bg-[#4edea3]/5 rounded-2xl p-5 border border-[#4edea3]/20 flex justify-between items-center";
            fTitle.className = "text-[10px] text-[#4edea3] uppercase font-bold tracking-widest";
            fTitle.innerText = "財務狀態";
            fStat.innerText = "全數已付 ✅";
            fBal.innerText = "";
        } else if (pStat === 'deposit') {
            fCard.className = "bg-[#ffb95f]/5 rounded-2xl p-5 border border-[#ffb95f]/20 flex justify-between items-center";
            fTitle.className = "text-[10px] text-[#ffb95f] uppercase font-bold tracking-widest";
            fTitle.innerText = "財務狀態";
            fStat.innerText = "已付訂金，尚欠尾數";
            fBal.className = "text-xl font-black text-[#ffb95f]";
            fBal.innerText = bal > 0 ? `HK$ ${bal}` : "";
        } else {
            fCard.className = "bg-[#ffb4ab]/5 rounded-2xl p-5 border border-[#ffb4ab]/20 flex justify-between items-center";
            fTitle.className = "text-[10px] text-[#ffb4ab] uppercase font-bold tracking-widest";
            fTitle.innerText = "財務狀態";
            fStat.innerText = "尚未付款 ❌";
            fBal.className = "text-xl font-black text-[#ffb4ab]";
            fBal.innerText = `HK$ ${price}`;
        }
        
        document.getElementById('result').classList.remove('hidden');
      } catch (err) {
          console.error(err);
          alert("讀取資料失敗，請稍後再試！");
      }
    }
  </script>
</body>
</html>
