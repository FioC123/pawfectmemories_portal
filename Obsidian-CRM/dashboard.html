<!DOCTYPE html>
<html class="dark" lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <script>if(!sessionStorage.getItem('pm_admin_logged')){window.location.href='login.html';}</script>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  
  <script id="tailwind-config">
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { "surface-container-high": "#2a2a2a", "surface": "#131313", "primary": "#4edea3", "on-primary": "#003824", "surface-container-low": "#1c1b1b", "outline": "#86948a", "on-surface-variant": "#bbcabf", "on-surface": "#e5e2e1", "secondary": "#ffb95f", "error": "#ffb4ab" }, fontFamily: { headline: ['Manrope'], body: ['Inter'], cursive: ['Dancing Script'] } } } }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { min-height: 100dvh; }
  </style>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary/30 min-h-screen pb-32">

  <header class="fixed top-0 w-full z-50 bg-[#131313] bg-gradient-to-b from-[#1C1B1B] to-transparent h-20 flex justify-between items-center px-6 border-b border-white/5">
    <div class="flex items-center gap-4">
      <button onclick="window.location.href='index.html';" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-primary/10 transition-colors">
        <span class="material-symbols-outlined text-primary">arrow_back</span>
      </button>
      <div class="flex flex-col cursor-pointer select-none" onclick="window.location.href='index.html';">
        <h1 class="font-cursive text-xl text-on-surface leading-none">Pawfect Memories</h1>
        <span class="text-[8px] text-primary font-bold tracking-[0.3em] uppercase mt-0.5">Photography</span>
      </div>
    </div>
  </header>

  <main class="pt-24 px-6 max-w-4xl mx-auto space-y-8">
    
    <div class="text-center md:text-left mb-8">
      <h2 class="font-headline font-extrabold text-3xl md:text-4xl tracking-tight text-on-surface">營運與財務中心</h2>
      <p class="text-on-surface-variant text-sm mt-2">管理尾數追收與匯出財務報表</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="bg-surface-container-low p-6 rounded-xl border border-white/5 flex flex-col justify-center items-center sm:items-start">
        <p class="text-xs text-outline font-bold uppercase mb-1">系統總營業額</p>
        <p id="total-revenue" class="text-3xl font-headline font-bold text-primary">載入中...</p>
      </div>
      <div class="bg-surface-container-low p-6 rounded-xl border border-white/5 flex flex-col justify-center items-center sm:items-start">
        <p class="text-xs text-outline font-bold uppercase mb-1">未收尾數總額</p>
        <p id="total-pending" class="text-3xl font-headline font-bold text-error">載入中...</p>
      </div>
    </div>

    <div class="bg-surface-container-low rounded-xl p-6 border border-white/5 space-y-4">
        <div class="flex items-center justify-between">
            <div>
                <h3 class="font-headline font-bold text-lg text-on-surface">匯出財務報表</h3>
                <p class="text-xs text-on-surface-variant mt-1">將所有訂單資料匯出為 Excel，格式已對應你的 Google Sheets。</p>
            </div>
            <button id="btn-export-excel" class="bg-[#107c41] text-white px-4 py-3 rounded-lg font-bold flex items-center gap-2 hover:bg-[#185c37] transition-colors shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M5.884 6.68a.5.5 0 1 0-.768.64L7.349 10l-2.233 2.68a.5.5 0 0 0 .768.64L8 10.781l2.116 2.54a.5.5 0 0 0 .768-.641L8.651 10l2.233-2.68a.5.5 0 0 0-.768-.64L8 9.219l-2.116-2.54z"/>
                    <path d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2zM9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5v2z"/>
                </svg>
                一鍵匯出 Excel
            </button>
        </div>
    </div>

    <div class="bg-surface-container-low rounded-xl border border-white/5 overflow-hidden">
      <div class="p-6 border-b border-white/5 flex items-center gap-2">
        <span class="material-symbols-outlined text-error">warning</span>
        <h3 class="font-headline font-bold text-lg text-on-surface">待追收尾數名單</h3>
      </div>
      <div id="pending-list" class="divide-y divide-white/5">
        <div class="p-6 text-center text-sm text-on-surface-variant">載入中...</div>
      </div>
    </div>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBhFUkCP0WslzdB2WY93hp6L-Z5g8vo40E", authDomain: "pawfect-memories-2c8a0.firebaseapp.com", projectId: "pawfect-memories-2c8a0", storageBucket: "pawfect-memories-2c8a0.firebasestorage.app", messagingSenderId: "860879002502", appId: "1:860879002502:web:eeaa936317b1fefc33aa07" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allOrdersData = [];

    async function loadDashboard() {
      try {
        const ordersSnap = await getDocs(collection(db, "Orders"));
        let totalRev = 0;
        let totalPending = 0;
        let pendingHTML = '';
        allOrdersData = [];

        for (let docSnap of ordersSnap.docs) {
          const data = docSnap.data();
          const orderId = docSnap.id;

          let clientName = "未知客戶";
          let clientPhone = "";
          let clientIg = "";
          if (data.clientId) {
            const cSnap = await getDoc(doc(db, "Clients", data.clientId));
            if (cSnap.exists()) {
              clientName = cSnap.data().name || "未知客戶";
              clientPhone = cSnap.data().phone || "";
              clientIg = cSnap.data().instagram || "";
            }
          }

          let pets = data.pets || [];
          if (pets.length === 0 && data.petName) pets = [{ name: data.petName }];
          let petNames = pets.length > 0 ? pets.map(p => p.name).join(' & ') : "未填寫";

          const price = Number(data.price || 0);
          const deposit = Number(data.depositAmount || 0);
          const balance = price - deposit;
          totalRev += price;

          let paymentText = "未付款";
          const pStatus = data.paymentStatus || (data.depositPaid ? "deposit" : "unpaid");
          if (pStatus === 'full') paymentText = "全數已付";
          else if (pStatus === 'deposit') paymentText = "已付訂金";

          // --- 填入所有 Excel 欄位 ---
          allOrdersData.push({
            "No.": data.invoiceNumber || orderId,
            "Client": clientName,
            "Pet": petNames,
            "Tel/IG": `${clientPhone} ${clientIg ? '/ '+clientIg : ''}`.trim(),
            "Shooting date": data.shootDate || "",
            "Platform": data.platform || "",
            "Package": data.package || "",
            "Studio": data.studio || "",
            "Deposit": deposit || 0,
            "Deposit date": data.depositDate || "",
            "Balance": balance > 0 ? balance : 0,
            "Balance Date": data.balanceDate || "",
            "Product": data.product || "",
            "Payment": paymentText,
            "Total": price,
            "Submission date": data.submissionDate || "",
            "Other Fee": data.otherFee || ""
          });

          // --- 構建待收尾數列表 ---
          if (pStatus === 'deposit' && balance > 0) {
            totalPending += balance;
            pendingHTML += `
              <div class="p-4 md:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:bg-surface-container-high transition-colors cursor-pointer" onclick="window.location.href='detail.html?id=${orderId}'">
                <div>
                  <div class="flex items-center gap-2">
                    <h4 class="font-bold text-on-surface">${clientName} - ${petNames}</h4>
                    <span class="text-[10px] bg-secondary/20 text-secondary px-1.5 py-0.5 rounded font-bold">欠尾數</span>
                  </div>
                  <p class="text-xs text-on-surface-variant mt-1">拍攝日: ${data.shootDate || '未定'} | 套餐: ${data.package || '未定'}</p>
                </div>
                <div class="text-left sm:text-right">
                  <p class="text-xs text-outline mb-0.5">尚欠尾數</p>
                  <p class="font-bold text-error text-lg">HK$ ${balance}</p>
                </div>
              </div>
            `;
          } else if (pStatus === 'unpaid' && price > 0) {
             totalPending += price;
             pendingHTML += `
              <div class="p-4 md:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:bg-surface-container-high transition-colors cursor-pointer" onclick="window.location.href='detail.html?id=${orderId}'">
                <div>
                  <div class="flex items-center gap-2">
                    <h4 class="font-bold text-on-surface">${clientName} - ${petNames}</h4>
                    <span class="text-[10px] bg-error/20 text-error px-1.5 py-0.5 rounded font-bold">未付款</span>
                  </div>
                  <p class="text-xs text-on-surface-variant mt-1">拍攝日: ${data.shootDate || '未定'} | 套餐: ${data.package || '未定'}</p>
                </div>
                <div class="text-left sm:text-right">
                  <p class="text-xs text-outline mb-0.5">尚未付款</p>
                  <p class="font-bold text-error text-lg">HK$ ${price}</p>
                </div>
              </div>
            `;
          }
        }

        document.getElementById('total-revenue').innerText = `HK$ ${totalRev}`;
        document.getElementById('total-pending').innerText = `HK$ ${totalPending}`;
        document.getElementById('pending-list').innerHTML = pendingHTML || `<div class="p-6 text-center text-sm text-on-surface-variant">太棒了！目前沒有被拖欠的尾數 🎉</div>`;

      } catch (err) {
        console.error(err);
        document.getElementById('pending-list').innerHTML = `<div class="p-6 text-center text-sm text-error">載入失敗，請檢查網絡連線。</div>`;
      }
    }

    loadDashboard();

    // --- 匯出 Excel 邏輯 ---
    document.getElementById('btn-export-excel').addEventListener('click', () => {
        if (allOrdersData.length === 0) {
            alert("目前沒有任何訂單資料可以匯出！");
            return;
        }
        
        const headerOrder = ["No.", "Client", "Pet", "Tel/IG", "Shooting date", "Platform", "Package", "Studio", "Deposit", "Deposit date", "Balance", "Balance Date", "Product", "Payment", "Total", "Submission date", "Other Fee"];
        
        const worksheet = XLSX.utils.json_to_sheet(allOrdersData, { header: headerOrder });
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "2026 Summary");

        const today = new Date().toISOString().split('T')[0];
        XLSX.writeFile(workbook, `Pawfect_Memories_Export_${today}.xlsx`);
    });
  </script>
</body>
</html>
