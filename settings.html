<!DOCTYPE html>
<html lang="zh-Hant" class="light">
<head>
  <meta charset="utf-8">
  <script>if(!sessionStorage.getItem('pm_admin_logged')){window.location.href='login.html';}</script>
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600&family=Noto+Sans+HK:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script id="tailwind-config">
    tailwind.config = {
      future: { hoverOnlyWhenSupported: true }, 
      darkMode: 'class', 
      theme: { 
        extend: { 
          colors: { 
            "pm-green": "rgb(var(--pm-primary) / <alpha-value>)",
            "pm-oak": "rgb(var(--pm-primary) / <alpha-value>)",
            "pm-cream": "rgb(var(--pm-page) / <alpha-value>)",
            "pm-dark-bg": "rgb(var(--pm-page) / <alpha-value>)",
            "pm-dark-surface": "rgb(var(--pm-card) / <alpha-value>)",
            "pm-dark-border": "rgb(var(--pm-line) / <alpha-value>)",
            "pm-sidebar": "rgb(var(--pm-sidebar) / <alpha-value>)",
            "pm-fill": "rgb(var(--pm-fill) / <alpha-value>)",
            "pm-elevated": "rgb(var(--pm-elevated) / <alpha-value>)",
            "pm-ink": "rgb(var(--pm-ink) / <alpha-value>)",
            "pm-page": "rgb(var(--pm-page) / <alpha-value>)",
            "pm-on": "rgb(var(--pm-on) / <alpha-value>)",
            "pm-secondary": "rgb(var(--pm-secondary) / <alpha-value>)",
            "pm-muted": "rgb(var(--pm-muted) / <alpha-value>)",
            "pm-success": "rgb(var(--pm-success) / <alpha-value>)",
            "pm-warning": "rgb(var(--pm-warning) / <alpha-value>)",
            "pm-danger": "rgb(var(--pm-danger) / <alpha-value>)",
            "pm-info": "rgb(var(--pm-info) / <alpha-value>)",
            "pm-sage": "rgb(var(--pm-sage) / <alpha-value>)",
            "pm-clay": "rgb(var(--pm-clay) / <alpha-value>)",
            "error": "rgb(var(--pm-danger) / <alpha-value>)"
          }, 
          fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['"Noto Sans HK"', '"Inter"', 'sans-serif'] },
          boxShadow: {
            /* [SKILL: Make Interfaces Feel Better] Organic Shadows */
            'taste': '0 4px 20px -4px rgba(0, 0, 0, 0.04), 0 1px 4px -1px rgba(0, 0, 0, 0.02)', 
            'taste-dark': '0 20px 40px -10px rgba(0, 0, 0, 0.5), 0 1px 8px -1px rgba(0, 0, 0, 0.3)' 
          }
        } 
      } 
    }
  </script>
  <style>
    body { min-height: 100dvh; overflow: hidden; transition: background-color var(--duration-fast) var(--ease-smooth-out), color var(--duration-fast) var(--ease-smooth-out); -webkit-font-smoothing: antialiased; }
    i[data-lucide] { display: inline-block; vertical-align: text-bottom; }
    
    /* [SKILL: Web Design Guidelines] Seamless Inputs */
    .taste-input {
        background-color: transparent !important;
        border: 1px solid transparent !important;
        border-radius: 0.5rem;
        padding: 0.5rem 0.75rem;
        transition: background-color var(--duration-quick) var(--ease), border-color var(--duration-quick) var(--ease), box-shadow var(--duration-quick) var(--ease-out);
    }
    @media (hover: hover) and (pointer: fine) {
      .taste-input:hover { background-color: color-mix(in srgb, var(--ink) 4%, transparent) !important; }
      .dark .taste-input:hover { background-color: color-mix(in srgb, var(--ink) 6%, transparent) !important; }
    }
    .taste-input:focus {
        background-color: transparent !important;
        border-color: var(--primary) !important;
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent) !important;
        outline: none;
    }
    
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    select.taste-select { appearance: none; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%239A9288' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e"); background-position: right 0.5rem center; background-repeat: no-repeat; background-size: 1.5em 1.5em; padding-right: 2rem; }

    .row-transition { animation: none; }
  </style>
  <meta name="theme-color" content="#F6F3EE">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta && document.documentElement.classList.contains("dark")) meta.setAttribute("content", "#1A1816");
    })();
  </script>
  <link rel="stylesheet" href="pm.css">
</head>

          <div class="bg-white dark:bg-pm-dark-surface rounded-[24px] shadow-taste dark:shadow-taste-dark border border-gray-200/50 dark:border-white/5 overflow-hidden transition-colors">

              <h3 class="font-serif font-bold text-base text-gray-900 dark:text-white flex items-center gap-2">

    <a href="dashboard.html"><i data-lucide="pie-chart"></i><span>財務</span></a>

  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBhFUkCP0WslzdB2WY93hp6L-Z5g8vo40E", authDomain: "pawfect-memories-2c8a0.firebaseapp.com", projectId: "pawfect-memories-2c8a0", storageBucket: "pawfect-memories-2c8a0.firebasestorage.app", messagingSenderId: "860879002502", appId: "1:860879002502:web:eeaa936317b1fefc33aa07" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    lucide.createIcons();

    window.toggleDarkMode = function() {
      const htmlEl = document.documentElement;
      const dark = !htmlEl.classList.contains('dark');
      htmlEl.classList.toggle('dark', dark);
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = dark ? '#1A1816' : '#F6F3EE';
    };

    window.showToast = function(msg, type='success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'error' ? 'bg-red-500 text-pm-on' : 'bg-pm-ink text-pm-page';
      const icon = type === 'error' ? 'alert-triangle' : 'check-circle';
      
      toast.className = `pm-toast flex items-center gap-2 ${bgColor}`;
      toast.innerHTML = `<i data-lucide="${icon}" class="w-3.5 h-3.5"></i> ${msg}`;
      
      container.appendChild(toast);
      lucide.createIcons();
      requestAnimationFrame(() => toast.classList.add('is-in'));
      setTimeout(() => { toast.classList.remove('is-in'); toast.classList.add('is-out'); setTimeout(() => toast.remove(), 160); }, 3000);
    }

    let packages = []; 
    let tags = [];

    const colorOptions = [
        { label: "浪漫薰衣草紫 (Purple)", val: "bg-purple-500/10 text-purple-600 dark:text-purple-400 border border-purple-500/20", dot: "#a855f7" },
        { label: "天空蔚藍 (Blue)", val: "bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20", dot: "#3b82f6" },
        { label: "暖陽鵝黃 (Yellow)", val: "bg-yellow-500/10 text-yellow-600 dark:text-yellow-400 border border-yellow-500/20", dot: "#eab308" },
        { label: "珊瑚烈紅 (Red)", val: "bg-red-500/10 text-red-600 dark:text-red-400 border border-red-500/20", dot: "#ef4444" },
        { label: "深林翡翠 (Green)", val: "bg-green-500/10 text-green-600 dark:text-green-400 border border-green-500/20", dot: "#22c55e" },
        { label: "奢華橡木金 (Oak)", val: "bg-pm-oak/10 text-pm-oak border border-pm-oak/20", dot: "#C4A484" },
        { label: "晨霧迷蹤灰 (Gray)", val: "bg-gray-100 dark:bg-pm-dark-border text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-transparent", dot: "#6b7280" }
    ];

    async function loadSettings() {
      try {
          // [SKILL: Flow Parallelization] Fetch system configurations in parallel
          const [snapPkg, snapTag] = await Promise.all([
            getDoc(doc(db, "Settings", "packages_config")),
            getDoc(doc(db, "Settings", "tags_config"))
          ]);

          packages = snapPkg.exists() ? snapPkg.data().list : [];
          tags = snapTag.exists() ? snapTag.data().list : [];
          
          renderPackages(); 
          renderTags();
      } catch (e) {
          showToast("遠端同步設定管線失敗", "error");
      }
    }

    function renderPackages() {
      if (packages.length === 0) {
          document.getElementById('package-list').innerHTML = `<div class="p-8 text-center text-xs text-gray-400">目前核心系統庫無任何套餐配置紀錄</div>`;
          return;
      }
        
      document.getElementById('package-list').innerHTML = packages.map((pkg, i) => `
        <div class="row-transition px-6 py-3.5 flex flex-col sm:grid sm:grid-cols-12 gap-3 sm:gap-4 items-start sm:items-center hover:bg-gray-50/50 dark:hover:bg-pm-fill/60 transition-colors group">
          <div class="w-full sm:col-span-5 relative">
            <label class="sm:hidden text-[9px] text-gray-400 uppercase font-bold mb-1 block">套餐名稱</label>
            <input type="text" value="${pkg.name}" onchange="updatePkg(${i}, 'name', this.value)" class="taste-input w-full text-gray-900 dark:text-white font-bold text-xs" placeholder="輸入套餐名稱">
          </div>
          <div class="w-full sm:col-span-3 relative flex items-center">
            <label class="sm:hidden text-[9px] text-gray-400 uppercase font-bold w-24">定價</label>
            <span class="absolute left-3 text-gray-400 text-xs pointer-events-none">HK$</span>
            <input type="number" value="${pkg.price}" onchange="updatePkg(${i}, 'price', this.value)" class="bg-transparent taste-input w-full pl-9 text-pm-oak font-bold text-xs">
          </div>
          <div class="w-full sm:col-span-3 relative flex items-center">
            <label class="sm:hidden text-[9px] text-gray-400 uppercase font-bold w-24">包底地租上限</label>
            <span class="absolute left-3 text-gray-400 text-xs pointer-events-none">HK$</span>
            <input type="number" value="${pkg.studioLimit || 0}" onchange="updatePkg(${i}, 'studioLimit', this.value)" class="bg-transparent taste-input w-full pl-9 text-gray-900 dark:text-white font-semibold text-xs">
          </div>
          <div class="w-full sm:col-span-1 flex justify-end sm:justify-center mt-1 sm:mt-0">
            <button onclick="removePkg(${i})" class="w-7 h-7 rounded-full flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors" title="移除此項目">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function renderTags() {
      if (tags.length === 0) {
          document.getElementById('tag-list').innerHTML = `<div class="p-8 text-center text-xs text-gray-400">目前核心系統庫無任何標籤配置紀錄</div>`;
          return;
      }

      document.getElementById('tag-list').innerHTML = tags.map((tag, i) => {
        const currentOpt = colorOptions.find(opt => opt.val === tag.color) || colorOptions[0];
        
        return `
        <div class="row-transition px-6 py-3.5 flex flex-col sm:grid sm:grid-cols-12 gap-3 sm:gap-4 items-start sm:items-center hover:bg-gray-50/50 dark:hover:bg-pm-fill/60 transition-colors group">
          <div class="w-full sm:col-span-7">
            <label class="sm:hidden text-[9px] text-gray-400 uppercase font-bold mb-1 block">標籤名稱</label>
            <input type="text" value="${tag.name}" onchange="updateTag(${i}, 'name', this.value)" class="taste-input w-full text-gray-900 dark:text-white font-bold text-xs" placeholder="輸入標籤名稱">
          </div>
          <div class="w-full sm:col-span-4 relative flex items-center">
            <label class="sm:hidden text-[9px] text-gray-400 uppercase font-bold w-20">渲染色彩</label>
            <div class="relative w-full">
                <div class="absolute left-3 top-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full shadow-sm pointer-events-none" style="background-color: ${currentOpt.dot}"></div>
                <select onchange="updateTag(${i}, 'color', this.value)" class="bg-transparent taste-select taste-input w-full pl-8 text-xs text-gray-600 dark:text-gray-400 font-semibold cursor-pointer">
                  ${colorOptions.map(opt => `<option value="${opt.val}" ${tag.color === opt.val ? 'selected' : ''}>${opt.label}</option>`).join('')}
                </select>
            </div>
          </div>
          <div class="w-full sm:col-span-1 flex justify-end sm:justify-center mt-1 sm:mt-0">
            <button onclick="removeTag(${i})" class="w-7 h-7 rounded-full flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors" title="移除此項目">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      `}).join('');
      lucide.createIcons();
    }

    window.updatePkg = (i, key, val) => { packages[i][key] = (key === 'name' ? val : Number(val)); }; 
    window.removePkg = (i) => { packages.splice(i, 1); renderPackages(); };
    document.getElementById('btn-add-pkg').onclick = () => { packages.push({ name: "新拍攝套餐項目", price: 0, studioLimit: 0 }); renderPackages(); };
    
    // [SKILL: Code Review] Defensive serialization and saving strategy
    const btnSavePkg = document.getElementById('btn-save-pkgs'); 
    const txtSavePkg = document.getElementById('text-save-pkgs');
    btnSavePkg.onclick = async () => { 
        // [SKILL: Code Review] Clean out empty data structures defensively
        const sanitizedList = packages.filter(p => p.name.trim() !== "");
        
        txtSavePkg.innerText = "儲存中..."; 
        btnSavePkg.classList.add('opacity-70', 'cursor-not-allowed');
        try {
            await setDoc(doc(db, "Settings", "packages_config"), { list: sanitizedList }); 
            showToast("服務套餐配置核心庫修改已套用成功");
            packages = sanitizedList;
            renderPackages();
        } catch(e) {
            showToast("系統寫入數據庫核心出錯", "error");
        } finally {
            txtSavePkg.innerText = "儲存套餐"; 
            btnSavePkg.classList.remove('opacity-70', 'cursor-not-allowed');
        }
    };

    window.updateTag = (i, key, val) => { tags[i][key] = val; if(key === 'color') renderTags(); }; 
    window.removeTag = (i) => { tags.splice(i, 1); renderTags(); };
    document.getElementById('btn-add-tag').onclick = () => { tags.push({ name: "全新核心分類標籤", color: colorOptions[0].val }); renderTags(); };
    
    const btnSaveTag = document.getElementById('btn-save-tags'); 
    const txtSaveTag = document.getElementById('text-save-tags');
    btnSaveTag.onclick = async () => {
        // [SKILL: Code Review] Clean out empty data structures defensively
        const sanitizedTags = tags.filter(t => t.name.trim() !== "");
        
        txtSaveTag.innerText = "儲存中..."; 
        btnSaveTag.classList.add('opacity-70', 'cursor-not-allowed');
        try {
            await setDoc(doc(db, "Settings", "tags_config"), { list: sanitizedTags }); 
            showToast("分類標籤配置核心庫修改已套用成功");
            tags = sanitizedTags;
            renderTags();
        } catch(e) {
            showToast("系統寫入數據庫核心出錯", "error");
        } finally {
            txtSaveTag.innerText = "儲存標籤"; 
            btnSaveTag.classList.remove('opacity-70', 'cursor-not-allowed');
        }
    };

    loadSettings();
  </script>
</body>
</html>
