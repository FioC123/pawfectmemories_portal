<!DOCTYPE html>
<html lang="zh-Hant" class="light">
<head>
  <meta charset="utf-8">
  <script>if(!sessionStorage.getItem('pm_admin_logged')){window.location.href='login.html';}</script>
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <title>系統設定 | Pawfect Memories</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600&family=Noto+Sans+HK:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script id="tailwind-config">
    tailwind.config = { 
      darkMode: 'class', 
      theme: { 
        extend: { 
          colors: { 
            "pm-green": "#244018",       
            "pm-oak": "#C4905E",         
            "pm-cream": "#FAFAFA",       
            "pm-dark-bg": "#0B0E0C",       
            "pm-dark-surface": "#121714",  
            "pm-dark-border": "#1E2621",
            "error": "#EF4444"
          }, 
          fontFamily: { 
            serif: ['"Playfair Display"', 'serif'], 
            sans: ['"Noto Sans HK"', '"Inter"', 'sans-serif'] 
          },
          boxShadow: {
            'taste': '0 4px 24px -8px rgba(0, 0, 0, 0.05)',
            'taste-dark': '0 4px 24px -8px rgba(0, 0, 0, 0.4)'
          }
        } 
      } 
    }
  </script>
  <style>
    body { min-height: 100dvh; transition: background-color 0.4s ease, color 0.4s ease; -webkit-font-smoothing: antialiased; }
    i[data-lucide] { display: inline-block; vertical-align: text-bottom; }
    
    /* Taste-style seamless inputs */
    .taste-input {
        background: transparent;
        border: 1px solid transparent;
        border-radius: 0.5rem;
        padding: 0.5rem 0.75rem;
        transition: all 0.2s ease;
    }
    .taste-input:hover {
        background: rgba(0,0,0,0.02);
    }
    .dark .taste-input:hover {
        background: rgba(255,255,255,0.02);
    }
    .taste-input:focus {
        background: transparent;
        border-color: #C4905E;
        box-shadow: 0 0 0 3px rgba(196, 144, 94, 0.1);
        outline: none;
    }
    
    /* 隱藏 Number input 嘅箭咀 */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
        -webkit-appearance: none; 
        margin: 0; 
    }
    input[type=number] {
        -moz-appearance: textfield;
    }

    select.taste-select {
        appearance: none;
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%239ca3af' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
        background-position: right 0.5rem center;
        background-repeat: no-repeat;
        background-size: 1.5em 1.5em;
        padding-right: 2rem;
    }
  </style>
</head>
<body class="bg-pm-cream dark:bg-pm-dark-bg text-gray-800 dark:text-[#EAE8E3] font-sans selection:bg-pm-oak/30 selection:text-pm-green dark:selection:text-white pb-32">

  <header class="bg-white/80 dark:bg-pm-dark-bg/80 backdrop-blur-md border-b border-gray-200/60 dark:border-pm-dark-border fixed top-0 w-full z-50 h-16 md:h-20 flex justify-between items-center px-4 md:px-8 transition-colors duration-400">
    <div class="flex items-center gap-4">
      <button type="button" onclick="window.location.href='index.html';" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-pm-dark-surface text-gray-500 dark:text-gray-400 transition-colors cursor-pointer">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>
      <div class="flex flex-col cursor-pointer select-none" onclick="window.location.href='index.html';">
        <h1 class="font-serif text-xl md:text-2xl text-pm-green dark:text-[#D1E2C7] font-bold leading-none tracking-tight">Pawfect Memories</h1>
        <span class="text-[9px] text-pm-oak font-bold tracking-[0.3em] uppercase mt-1 ml-0.5">Settings</span>
      </div>
    </div>
    
    <div class="flex items-center gap-2 shrink-0">
      <button onclick="toggleDarkMode()" class="w-10 h-10 flex items-center justify-center rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-pm-dark-surface transition-colors" title="Theme">
        <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
        <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
      </button>
    </div>
  </header>

  <main class="pt-24 md:pt-32 px-4 md:px-8 max-w-3xl mx-auto space-y-10">
    
    <div class="mb-8">
      <h2 class="font-serif font-bold text-3xl md:text-4xl tracking-tight text-gray-900 dark:text-white mb-2">系統設定</h2>
      <p class="text-gray-500 dark:text-gray-400 text-sm">管理您的拍攝套餐及客戶分類標籤</p>
    </div>

    <section>
      <div class="flex items-center justify-between mb-4 px-2">
        <h3 class="font-serif font-bold text-xl text-gray-900 dark:text-white flex items-center gap-2">
          <i data-lucide="package" class="w-5 h-5 text-pm-oak"></i> 拍攝套餐配置
        </h3>
      </div>
      <p class="text-xs text-gray-500 dark:text-gray-400 mb-4 px-2">設定基礎收費與包底地租。如果訂單實際地租超過「包底地租」，系統會自動於新增預約時計算補錢差額。</p>
      
      <div class="bg-white dark:bg-pm-dark-surface rounded-[24px] shadow-taste dark:shadow-taste-dark border border-gray-200/60 dark:border-white/5 overflow-hidden transition-colors">
        
        <div class="hidden sm:grid grid-cols-12 gap-4 px-6 py-4 border-b border-gray-100 dark:border-pm-dark-border bg-gray-50/50 dark:bg-[#1A211D]/50 text-[10px] font-bold uppercase tracking-wider text-gray-400">
          <div class="col-span-5">套餐名稱 (Package Name)</div>
          <div class="col-span-3">定價 (Price)</div>
          <div class="col-span-3">包底地租 (Studio Limit)</div>
          <div class="col-span-1 text-center">刪除</div>
        </div>

        <div id="package-list" class="divide-y divide-gray-100 dark:divide-pm-dark-border">
            <div class="p-6 flex items-center gap-4 animate-pulse">
                <div class="h-8 bg-gray-100 dark:bg-[#1A211D] w-full rounded-lg"></div>
            </div>
        </div>
        
        <div class="p-4 bg-gray-50/50 dark:bg-[#1A211D]/50 border-t border-gray-100 dark:border-pm-dark-border">
          <button id="btn-add-pkg" class="w-full py-2.5 flex items-center justify-center gap-2 text-sm font-semibold text-pm-oak hover:bg-pm-oak/10 rounded-xl transition-colors">
            <i data-lucide="plus" class="w-4 h-4"></i> 新增套餐
          </button>
        </div>
      </div>
      
      <div class="mt-4 flex justify-end">
        <button id="btn-save-pkgs" class="bg-pm-green dark:bg-pm-oak text-white dark:text-[#121714] font-semibold py-3 px-8 rounded-xl shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center gap-2">
          <i data-lucide="save" class="w-4 h-4"></i> <span id="text-save-pkgs">儲存套餐設定</span>
        </button>
      </div>
    </section>

    <hr class="border-gray-200 dark:border-pm-dark-border">

    <section>
      <div class="flex items-center justify-between mb-4 px-2">
        <h3 class="font-serif font-bold text-xl text-gray-900 dark:text-white flex items-center gap-2">
          <i data-lucide="tag" class="w-5 h-5 text-pm-oak"></i> 客戶標籤配置
        </h3>
      </div>
      <p class="text-xs text-gray-500 dark:text-gray-400 mb-4 px-2">設定可用於分類客人的標籤，方便在看板或列表一眼辨識客人的特殊屬性 (如：VIP、熟客)。</p>
      
      <div class="bg-white dark:bg-pm-dark-surface rounded-[24px] shadow-taste dark:shadow-taste-dark border border-gray-200/60 dark:border-white/5 overflow-hidden transition-colors">
        
        <div class="hidden sm:grid grid-cols-12 gap-4 px-6 py-4 border-b border-gray-100 dark:border-pm-dark-border bg-gray-50/50 dark:bg-[#1A211D]/50 text-[10px] font-bold uppercase tracking-wider text-gray-400">
          <div class="col-span-7">標籤名稱 (Tag Name)</div>
          <div class="col-span-4">顏色 (Color)</div>
          <div class="col-span-1 text-center">刪除</div>
        </div>

        <div id="tag-list" class="divide-y divide-gray-100 dark:divide-pm-dark-border">
            <div class="p-6 flex items-center gap-4 animate-pulse">
                <div class="h-8 bg-gray-100 dark:bg-[#1A211D] w-full rounded-lg"></div>
            </div>
        </div>
        
        <div class="p-4 bg-gray-50/50 dark:bg-[#1A211D]/50 border-t border-gray-100 dark:border-pm-dark-border">
          <button id="btn-add-tag" class="w-full py-2.5 flex items-center justify-center gap-2 text-sm font-semibold text-pm-oak hover:bg-pm-oak/10 rounded-xl transition-colors">
            <i data-lucide="plus" class="w-4 h-4"></i> 新增標籤
          </button>
        </div>
      </div>

      <div class="mt-4 flex justify-end">
        <button id="btn-save-tags" class="bg-pm-green dark:bg-pm-oak text-white dark:text-[#121714] font-semibold py-3 px-8 rounded-xl shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center gap-2">
          <i data-lucide="save" class="w-4 h-4"></i> <span id="text-save-tags">儲存標籤設定</span>
        </button>
      </div>
    </section>

  </main>

  <div id="toast-container" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-3 pointer-events-none"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBhFUkCP0WslzdB2WY93hp6L-Z5g8vo40E", authDomain: "pawfect-memories-2c8a0.firebaseapp.com", projectId: "pawfect-memories-2c8a0", storageBucket: "pawfect-memories-2c8a0.firebasestorage.app", messagingSenderId: "860879002502", appId: "1:860879002502:web:eeaa936317b1fefc33aa07" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    lucide.createIcons();

    window.toggleDarkMode = function() {
      const htmlEl = document.documentElement;
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        htmlEl.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    };

    window.showToast = function(msg, type='success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'error' ? 'bg-red-500 text-white' : 'bg-gray-900 dark:bg-white text-white dark:text-gray-900';
      const icon = type === 'error' ? 'alert-triangle' : 'check-circle';
      
      toast.className = `px-5 py-3 rounded-full shadow-2xl text-sm font-medium transform transition-all translate-y-10 opacity-0 flex items-center gap-2 ${bgColor}`;
      toast.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4"></i> ${msg}`;
      
      container.appendChild(toast);
      lucide.createIcons();
      
      requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
      setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    let packages = []; 
    let tags = [];

    // 標籤顏色選項，加入咗 Tailwind 顏色代碼做預覽
    const colorOptions = [
        { label: "紫色 (Purple)", val: "bg-purple-500/10 text-purple-600 dark:text-purple-400 border border-purple-500/20", dot: "#a855f7" },
        { label: "藍色 (Blue)", val: "bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20", dot: "#3b82f6" },
        { label: "黃色 (Yellow)", val: "bg-yellow-500/10 text-yellow-600 dark:text-yellow-400 border border-yellow-500/20", dot: "#eab308" },
        { label: "紅色 (Red)", val: "bg-red-500/10 text-red-600 dark:text-red-400 border border-red-500/20", dot: "#ef4444" },
        { label: "綠色 (Green)", val: "bg-green-500/10 text-green-600 dark:text-green-400 border border-green-500/20", dot: "#22c55e" },
        { label: "橡木金 (Oak)", val: "bg-pm-oak/10 text-pm-oak border border-pm-oak/20", dot: "#C4905E" },
        { label: "灰色 (Gray)", val: "bg-gray-100 dark:bg-pm-dark-border text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-transparent", dot: "#6b7280" }
    ];

    async function loadSettings() {
      try {
          const snapPkg = await getDoc(doc(db, "Settings", "packages_config"));
          packages = snapPkg.exists() ? snapPkg.data().list : [
            { name: "Pawfect Outdoor", price: 2788, studioLimit: 0 },
            { name: "Pawfect Studio", price: 3888, studioLimit: 1000 },
            { name: "Pawfect Premium", price: 5888, studioLimit: 1000 },
            { name: "Pawfect On-site", price: 2100, studioLimit: 0 }
          ];
          
          const snapTag = await getDoc(doc(db, "Settings", "tags_config"));
          tags = snapTag.exists() ? snapTag.data().list : [
              { name: "熟客 VIP", color: colorOptions[0].val }, 
              { name: "轉介紹", color: colorOptions[1].val }
          ];
          
          renderPackages(); 
          renderTags();
      } catch (e) {
          showToast("讀取設定失敗", "error");
      }
    }

    function renderPackages() {
      if (packages.length === 0) {
          document.getElementById('package-list').innerHTML = `<div class="p-8 text-center text-sm text-gray-400">目前沒有設定任何套餐</div>`;
          return;
      }
        
      document.getElementById('package-list').innerHTML = packages.map((pkg, i) => `
        <div class="px-6 py-4 flex flex-col sm:grid sm:grid-cols-12 gap-3 sm:gap-4 items-start sm:items-center hover:bg-gray-50 dark:hover:bg-[#1A211D]/30 transition-colors group">
          <div class="w-full sm:col-span-5 relative">
            <label class="sm:hidden text-[10px] text-gray-400 uppercase font-bold mb-1 block">套餐名稱</label>
            <input type="text" value="${pkg.name}" onchange="updatePkg(${i}, 'name', this.value)" class="taste-input w-full text-gray-900 dark:text-white font-semibold" placeholder="輸入套餐名稱">
          </div>
          <div class="w-full sm:col-span-3 relative flex items-center">
            <label class="sm:hidden text-[10px] text-gray-400 uppercase font-bold w-24">定價</label>
            <span class="absolute left-3 text-gray-400 text-sm pointer-events-none">HK$</span>
            <input type="number" value="${pkg.price}" onchange="updatePkg(${i}, 'price', this.value)" class="taste-input w-full pl-9 text-pm-green dark:text-pm-oak font-bold">
          </div>
          <div class="w-full sm:col-span-3 relative flex items-center">
            <label class="sm:hidden text-[10px] text-gray-400 uppercase font-bold w-24">包底地租</label>
            <span class="absolute left-3 text-gray-400 text-sm pointer-events-none">HK$</span>
            <input type="number" value="${pkg.studioLimit || 0}" onchange="updatePkg(${i}, 'studioLimit', this.value)" class="taste-input w-full pl-9 text-gray-900 dark:text-white font-medium">
          </div>
          <div class="w-full sm:col-span-1 flex justify-end sm:justify-center mt-2 sm:mt-0">
            <button onclick="removePkg(${i})" class="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors opacity-100 sm:opacity-0 group-hover:opacity-100" title="刪除此套餐">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function renderTags() {
      if (tags.length === 0) {
          document.getElementById('tag-list').innerHTML = `<div class="p-8 text-center text-sm text-gray-400">目前沒有設定任何標籤</div>`;
          return;
      }

      document.getElementById('tag-list').innerHTML = tags.map((tag, i) => {
        // 搵返目前揀緊嗰隻色嘅 Hex code，用嚟顯示 Color Dot
        const currentOpt = colorOptions.find(opt => opt.val === tag.color) || colorOptions[0];
        
        return `
        <div class="px-6 py-4 flex flex-col sm:grid sm:grid-cols-12 gap-3 sm:gap-4 items-start sm:items-center hover:bg-gray-50 dark:hover:bg-[#1A211D]/30 transition-colors group">
          <div class="w-full sm:col-span-7">
            <label class="sm:hidden text-[10px] text-gray-400 uppercase font-bold mb-1 block">標籤名稱</label>
            <input type="text" value="${tag.name}" onchange="updateTag(${i}, 'name', this.value)" class="taste-input w-full text-gray-900 dark:text-white font-semibold" placeholder="輸入標籤名稱">
          </div>
          <div class="w-full sm:col-span-4 relative flex items-center">
            <label class="sm:hidden text-[10px] text-gray-400 uppercase font-bold w-20">顏色</label>
            <div class="relative w-full">
                <div class="absolute left-3 top-1/2 -translate-y-1/2 w-3 h-3 rounded-full shadow-sm pointer-events-none" style="background-color: ${currentOpt.dot}"></div>
                <select onchange="updateTag(${i}, 'color', this.value)" class="taste-select taste-input w-full pl-9 text-sm text-gray-700 dark:text-gray-300 font-medium">
                  ${colorOptions.map(opt => `<option value="${opt.val}" ${tag.color === opt.val ? 'selected' : ''}>${opt.label}</option>`).join('')}
                </select>
            </div>
          </div>
          <div class="w-full sm:col-span-1 flex justify-end sm:justify-center mt-2 sm:mt-0">
            <button onclick="removeTag(${i})" class="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors opacity-100 sm:opacity-0 group-hover:opacity-100" title="刪除此標籤">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      `}).join('');
      lucide.createIcons();
    }

    window.updatePkg = (i, key, val) => { packages[i][key] = (key === 'name' ? val : Number(val)); }; 
    window.removePkg = (i) => { packages.splice(i, 1); renderPackages(); };
    document.getElementById('btn-add-pkg').onclick = () => { packages.push({ name: "新套餐", price: 0, studioLimit: 0 }); renderPackages(); };
    
    const btnSavePkg = document.getElementById('btn-save-pkgs'); 
    const txtSavePkg = document.getElementById('text-save-pkgs');
    btnSavePkg.onclick = async () => { 
        txtSavePkg.innerText = "儲存中..."; 
        btnSavePkg.classList.add('opacity-70', 'cursor-not-allowed');
        try {
            await setDoc(doc(db, "Settings", "packages_config"), { list: packages }); 
            showToast("套餐設定已儲存");
        } catch(e) {
            showToast("儲存失敗", "error");
        } finally {
            txtSavePkg.innerText = "儲存套餐設定"; 
            btnSavePkg.classList.remove('opacity-70', 'cursor-not-allowed');
        }
    };

    window.updateTag = (i, key, val) => { tags[i][key] = val; if(key === 'color') renderTags(); }; 
    window.removeTag = (i) => { tags.splice(i, 1); renderTags(); };
    document.getElementById('btn-add-tag').onclick = () => { tags.push({ name: "新標籤", color: colorOptions[0].val }); renderTags(); };
    
    const btnSaveTag = document.getElementById('btn-save-tags'); 
    const txtSaveTag = document.getElementById('text-save-tags');
    btnSaveTag.onclick = async () => { 
        txtSaveTag.innerText = "儲存中..."; 
        btnSaveTag.classList.add('opacity-70', 'cursor-not-allowed');
        try {
            await setDoc(doc(db, "Settings", "tags_config"), { list: tags }); 
            showToast("標籤設定已儲存");
        } catch(e) {
            showToast("儲存失敗", "error");
        } finally {
            txtSaveTag.innerText = "儲存標籤設定"; 
            btnSaveTag.classList.remove('opacity-70', 'cursor-not-allowed');
        }
    };

    loadSettings();
  </script>
</body>
</html>
