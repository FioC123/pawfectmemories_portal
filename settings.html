<!DOCTYPE html>
<html class="dark" lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <script>if(!sessionStorage.getItem('pm_admin_logged')){window.location.href='login.html';}</script>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script id="tailwind-config">
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { "surface": "#131313", "primary": "#4edea3", "surface-container-low": "#1c1b1b", "error": "#ffb4ab" } } } }
  </script>
  <style>.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }</style>
</head>
<body class="bg-surface text-white font-sans p-6 min-h-screen pb-32">
  
  <header class="flex items-center gap-4 mb-8 max-w-2xl mx-auto">
    <button onclick="window.location.href='index.html';" class="p-2 hover:bg-white/10 rounded-full transition-colors">
      <span class="material-symbols-outlined text-primary">arrow_back</span>
    </button>
    <h1 class="text-2xl font-bold text-primary">系統設定</h1>
  </header>

  <main class="max-w-2xl mx-auto space-y-8">
    <section class="bg-surface-container-low p-6 rounded-xl border border-white/5">
      <h3 class="text-lg font-bold mb-2 flex items-center gap-2 text-primary"><span class="material-symbols-outlined">shopping_bag</span> 拍攝套餐管理</h3>
      <p class="text-sm text-gray-400 mb-6">設定基礎收費與包底地租。如果訂單實際地租超過「包底地租」，系統會自動計算補錢差額。</p>
      
      <div id="package-list" class="space-y-3 mb-6"></div>
      
      <button id="btn-add-pkg" class="w-full py-3 border border-dashed border-primary/50 text-primary rounded-lg text-sm font-bold hover:bg-primary/10 transition-colors">+ 新增套餐</button>
      <button id="btn-save-pkgs" class="w-full mt-6 bg-primary text-[#003824] font-bold py-4 rounded-lg shadow-lg active:scale-95 transition-transform">💾 儲存套餐設定</button>
    </section>

    <section class="bg-surface-container-low p-6 rounded-xl border border-white/5">
      <h3 class="text-lg font-bold mb-2 flex items-center gap-2 text-primary"><span class="material-symbols-outlined">label</span> 客戶標籤管理</h3>
      <p class="text-sm text-gray-400 mb-6">設定可用於分類客人的標籤 (如：VIP、黑名單、熟客)。</p>
      
      <div id="tag-list" class="space-y-3 mb-6"></div>
      
      <button id="btn-add-tag" class="w-full py-3 border border-dashed border-primary/50 text-primary rounded-lg text-sm font-bold hover:bg-primary/10 transition-colors">+ 新增標籤</button>
      <button id="btn-save-tags" class="w-full mt-6 bg-primary text-[#003824] font-bold py-4 rounded-lg shadow-lg active:scale-95 transition-transform">💾 儲存標籤設定</button>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBhFUkCP0WslzdB2WY93hp6L-Z5g8vo40E", authDomain: "pawfect-memories-2c8a0.firebaseapp.com", projectId: "pawfect-memories-2c8a0", storageBucket: "pawfect-memories-2c8a0.firebasestorage.app", messagingSenderId: "860879002502", appId: "1:860879002502:web:eeaa936317b1fefc33aa07" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let packages = []; 
    let tags = [];

    async function loadSettings() {
      const snapPkg = await getDoc(doc(db, "Settings", "packages_config"));
      packages = snapPkg.exists() ? snapPkg.data().list : [
        { name: "Pawfect Outdoor", price: 2788, studioLimit: 0 },
        { name: "Pawfect Studio", price: 3888, studioLimit: 1000 },
        { name: "Pawfect Premium", price: 5888, studioLimit: 1000 },
        { name: "Pawfect On-site", price: 2100, studioLimit: 0 }
      ];
      
      const snapTag = await getDoc(doc(db, "Settings", "tags_config"));
      tags = snapTag.exists() ? snapTag.data().list : [
          { name: "熟客 VIP", color: "bg-purple-500/20 text-purple-400 border-purple-500" }, 
          { name: "轉介紹", color: "bg-blue-500/20 text-blue-400 border-blue-500" }
      ];
      
      renderPackages(); 
      renderTags();
    }

    function renderPackages() {
      document.getElementById('package-list').innerHTML = packages.map((pkg, i) => `
        <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-center bg-[#2a2a2a] p-4 rounded-lg border border-white/5 relative">
          <div class="w-full sm:flex-1">
            <label class="text-[10px] text-gray-400 uppercase font-bold">套餐名稱</label>
            <input type="text" value="${pkg.name}" onchange="updatePkg(${i}, 'name', this.value)" class="w-full bg-transparent border-b border-white/20 text-sm outline-none focus:border-primary py-1 font-bold">
          </div>
          <div class="w-full sm:w-24">
            <label class="text-[10px] text-gray-400 uppercase font-bold">定價 (HK$)</label>
            <input type="number" value="${pkg.price}" onchange="updatePkg(${i}, 'price', this.value)" class="w-full bg-transparent border-b border-white/20 text-sm outline-none focus:border-primary py-1 font-bold text-primary">
          </div>
          <div class="w-full sm:w-28">
            <label class="text-[10px] text-gray-400 uppercase font-bold">包底地租 (HK$)</label>
            <input type="number" value="${pkg.studioLimit || 0}" onchange="updatePkg(${i}, 'studioLimit', this.value)" class="w-full bg-transparent border-b border-white/20 text-sm outline-none focus:border-primary py-1 font-bold">
          </div>
          <button onclick="removePkg(${i})" class="absolute top-4 right-4 sm:static sm:mt-4 text-error hover:text-red-400 transition-colors">
            <span class="material-symbols-outlined text-[20px]">delete</span>
          </button>
        </div>
      `).join('');
    }

    function renderTags() {
      document.getElementById('tag-list').innerHTML = tags.map((tag, i) => `
        <div class="flex gap-3 items-center bg-[#2a2a2a] p-3 rounded-lg border border-white/5">
          <input type="text" value="${tag.name}" onchange="updateTag(${i}, 'name', this.value)" class="w-full bg-transparent border-b border-white/20 text-sm outline-none focus:border-primary py-1 font-bold flex-1">
          <select onchange="updateTag(${i}, 'color', this.value)" class="bg-[#131313] text-sm border-white/20 rounded p-1 outline-none focus:border-primary">
            <option value="bg-purple-500/20 text-purple-400 border-purple-500" ${tag.color.includes('purple')?'selected':''}>紫色</option>
            <option value="bg-blue-500/20 text-blue-400 border-blue-500" ${tag.color.includes('blue')?'selected':''}>藍色</option>
            <option value="bg-yellow-500/20 text-yellow-400 border-yellow-500" ${tag.color.includes('yellow')?'selected':''}>黃色</option>
            <option value="bg-red-500/20 text-red-400 border-red-500" ${tag.color.includes('red')?'selected':''}>紅色</option>
            <option value="bg-green-500/20 text-green-400 border-green-500" ${tag.color.includes('green')?'selected':''}>綠色</option>
          </select>
          <button onclick="removeTag(${i})" class="text-error hover:text-red-400 transition-colors">
            <span class="material-symbols-outlined text-[20px]">delete</span>
          </button>
        </div>
      `).join('');
    }

    window.updatePkg = (i, key, val) => { packages[i][key] = (key === 'name' ? val : Number(val)); }; 
    window.removePkg = (i) => { packages.splice(i, 1); renderPackages(); };
    document.getElementById('btn-add-pkg').onclick = () => { packages.push({ name: "新套餐", price: 0, studioLimit: 0 }); renderPackages(); };
    
    const btnSavePkg = document.getElementById('btn-save-pkgs'); 
    btnSavePkg.onclick = async () => { 
        btnSavePkg.innerText = "儲存中..."; 
        await setDoc(doc(db, "Settings", "packages_config"), { list: packages }); 
        btnSavePkg.innerText = "✅ 儲存成功"; 
        setTimeout(() => btnSavePkg.innerText = "💾 儲存套餐設定", 2000); 
    };

    window.updateTag = (i, key, val) => { tags[i][key] = val; }; 
    window.removeTag = (i) => { tags.splice(i, 1); renderTags(); };
    document.getElementById('btn-add-tag').onclick = () => { tags.push({ name: "新標籤", color: "bg-blue-500/20 text-blue-400 border-blue-500" }); renderTags(); };
    
    const btnSaveTag = document.getElementById('btn-save-tags'); 
    btnSaveTag.onclick = async () => { 
        btnSaveTag.innerText = "儲存中..."; 
        await setDoc(doc(db, "Settings", "tags_config"), { list: tags }); 
        btnSaveTag.innerText = "✅ 儲存成功"; 
        setTimeout(() => btnSaveTag.innerText = "💾 儲存標籤設定", 2000); 
    };

    loadSettings();
  </script>
</body>
</html>
