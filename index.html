              <th class="px-6 py-4.5">拍攝日期</th>

          </thead>
          <tbody id="table-body" class="divide-y divide-gray-100 dark:divide-pm-dark-border text-xs font-medium"></tbody>

  <div id="drawer-backdrop" class="pm-backdrop fixed inset-0 bg-gray-900/40 z-50 hidden" onclick="closeDrawer()"></div>

    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100 dark:border-pm-dark-border shrink-0">
      <h3 id="drawer-title" class="font-bold text-lg text-gray-900 dark:text-white">快速預覽</h3>
      <button type="button" onclick="closeDrawer()" class="pm-iconbtn" aria-label="關閉">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    
    <div class="pm-sheet-body flex-1 p-4" id="drawer-content"></div>

    <div class="pm-actionbar shrink-0">
      <button id="drawer-btn-edit" class="w-full bg-white dark:bg-[#1A211D] border border-gray-200 dark:border-pm-dark-border text-gray-700 dark:text-gray-300 py-3 rounded-xl font-semibold hover:border-pm-oak hover:text-pm-oak transition-colors text-xs flex items-center justify-center gap-1.5 shadow-sm">
        <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> 完整編輯
      </button>
      <button id="drawer-btn-detail" class="w-full bg-pm-green dark:bg-pm-oak text-white dark:text-[#121714] py-3 rounded-xl font-semibold shadow-md hover:shadow-lg pm-named text-xs flex items-center justify-center gap-1.5">

      </button>

  <nav class="pm-tabbar" aria-label="主要導覽">

    <a href="add.html" class="flex flex-col items-center p-2 text-gray-400"><i data-lucide="plus-square" class="w-5 h-5 mb-0.5"></i><span class="text-[9px] font-bold">新增</span></a>
    <a href="dashboard.html" class="flex flex-col items-center p-2 text-gray-400"><i data-lucide="pie-chart" class="w-5 h-5 mb-0.5"></i><span class="text-[9px] font-bold">財務</span></a>
    <a href="settings.html" class="flex items-center p-2 text-gray-400"><i data-lucide="settings" class="w-5 h-5 mb-0.5"></i><span class="text-[9px] font-bold">設定</span></a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { renderPetAvatars, escAttr, petPhotoSrc, DENSE_AVATAR_LIMIT } from "./pets-avatars.js";

    const firebaseConfig = { apiKey: "AIzaSyBhFUkCP0WslzdB2WY93hp6L-Z5g8vo40E", authDomain: "pawfect-memories-2c8a0.firebaseapp.com", projectId: "pawfect-memories-2c8a0", storageBucket: "pawfect-memories-2c8a0.firebasestorage.app", messagingSenderId: "860879002502", appId: "1:860879002502:web:eeaa936317b1fefc33aa07" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 定義抽屜全域 DOM 節點變數
    const backdrop = document.getElementById('drawer-backdrop');
    const drawer = document.getElementById('quick-drawer');

    lucide.createIcons();

    // 主題切換
    window.toggleDarkMode = function() {
      const htmlEl = document.documentElement;
      const dark = !htmlEl.classList.contains('dark');
      htmlEl.classList.toggle('dark', dark);
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = dark ? '#101411' : '#F3F1EC';
    };

    // [SKILL: Keyboard-First] Safely intercept global keyboard controls
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeDrawer(); }
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault(); document.getElementById('global-search').focus();
      }
    });

    const btnKanban = document.getElementById('btn-view-kanban');
    const btnTable = document.getElementById('btn-view-table');
    const viewKanban = document.getElementById('view-kanban');
    const viewTable = document.getElementById('view-table');

    function setWorkspaceView(mode) {
      const kanban = mode === 'kanban';
      btnKanban.setAttribute('aria-pressed', kanban ? 'true' : 'false');
      btnTable.setAttribute('aria-pressed', kanban ? 'false' : 'true');
      viewKanban.classList.toggle('hidden', !kanban);
      viewTable.classList.toggle('hidden', kanban);
    }
    btnKanban.onclick = () => setWorkspaceView('kanban');
    btnTable.onclick = () => setWorkspaceView('table');

    let allOrdersData = [];

    function renderDrawerAvatars(pets) {
      const list = pets && pets.length ? pets : [{ name: "", photoUrl: "" }];
      if (list.length === 1) {
        return `<div class="w-14 h-14 rounded-full overflow-hidden border border-gray-100 dark:border-pm-dark-border shadow-sm shrink-0"><img src="${escAttr(petPhotoSrc(list[0]))}" alt="${escAttr(list[0].name || "")}" class="w-full h-full object-cover"></div>`;
      }
      return renderPetAvatars(list, { sizeClass: "w-14 h-14 shadow-sm", overlapClass: "-ml-5", maxVisible: DENSE_AVATAR_LIMIT });
    }

    // 開啟 Drawer 預覽功能
    window.openDrawer = function(orderId) {
      const data = allOrdersData.find(o => o.id === orderId);
      if(!data) return;

      document.getElementById('drawer-btn-edit').onclick = () => window.location.href = `add.html?editId=${orderId}`;
      document.getElementById('drawer-btn-detail').onclick = () => window.location.href = `detail.html?id=${orderId}`;

      const bal = data.price - (data.depositAmount || Math.floor(data.price/2));
      const payBadge = data.paymentStatus === 'full' 
        ? `<span class="bg-pm-green/10 text-pm-green dark:text-[#8DBA76] px-2 py-0.5 rounded-md text-[10px] font-bold">全數已付</span>`
        : (data.paymentStatus === 'deposit' ? `<span class="bg-pm-oak/10 text-pm-oak px-2 py-0.5 rounded-md text-[10px] font-bold">欠 HK$${bal.toLocaleString()}</span>` : `<span class="bg-red-50 text-red-500 px-2 py-0.5 rounded-md text-[10px] font-bold">未付款</span>`);

      document.getElementById('drawer-content').innerHTML = `
        <div class="flex items-center gap-4 mb-2">
          ${renderDrawerAvatars(data.pets)}
          <div class="overflow-hidden flex-1">
            <h4 class="font-serif font-bold text-xl text-gray-900 dark:text-white truncate">${data.petsStr}</h4>
            <p class="text-xs text-gray-500 dark:text-gray-400 font-medium mt-0.5">${data.clientName} ${data.clientPhone ? '· '+data.clientPhone : ''}</p>
          </div>
        </div>
        
        <div class="grid grid-cols-2 gap-3 mt-6">
          <div class="bg-gray-50 dark:bg-[#1A211D] p-3 rounded-xl border border-gray-100 dark:border-pm-dark-border">
            <p class="text-[9px] text-gray-400 uppercase font-bold tracking-wider mb-0.5">拍攝日期</p>
            <p class="text-xs font-semibold text-gray-900 dark:text-white">${data.shootDate || '未定'}</p>
          </div>
          <div class="bg-gray-50 dark:bg-[#1A211D] p-3 rounded-xl border border-gray-100 dark:border-pm-dark-border">
            <p class="text-[9px] text-gray-400 uppercase font-bold tracking-wider mb-0.5">總收費</p>
            <p class="text-xs font-bold text-pm-oak flex items-center justify-between">${payBadge}</p>
          </div>
        </div>

        <div class="mt-6 border-t border-gray-100 dark:border-pm-dark-border pt-5">
          <p class="text-[9px] text-gray-400 uppercase font-bold tracking-wider mb-2">備註 / 特殊要求</p>
          <div class="bg-yellow-50/40 dark:bg-yellow-900/5 p-4 rounded-xl text-xs text-gray-600 dark:text-gray-400 whitespace-pre-wrap border border-yellow-100/60 dark:border-yellow-900/10 leading-relaxed">
            ${data.notes || '無特別備註'}
          </div>
        </div>
      `;

      backdrop.classList.remove('hidden');
      void backdrop.offsetWidth;
      backdrop.classList.add('is-open');
      drawer.classList.add('is-open');
      lucide.createIcons();
    };

    window.closeDrawer = function() {
      drawer.classList.remove('is-open');
      backdrop.classList.remove('is-open');
      setTimeout(() => backdrop.classList.add('hidden'), 380);
    };

    // [SKILL: Code Review & Superpowers] TDD defensive parallel asynchronous strategy
    async function loadOrders() {
      const colIds = ['col-new', 'col-basic-edit', 'col-pick-photos', 'col-final-retouch', 'col-completed'];
      colIds.forEach(id => document.getElementById(id).innerHTML = `<div class="h-20 bg-white dark:bg-pm-dark-surface rounded-2xl border border-gray-100 dark:border-pm-dark-border animate-pulse"></div>`);
      const counts = { 'col-new': 0, 'col-basic-edit': 0, 'col-pick-photos': 0, 'col-final-retouch': 0, 'col-completed': 0 };

      try {
        // [SKILL: Flow Parallelization] Batch retrieve to boost performance
        const [ordersSnap, clientsSnap] = await Promise.all([
          getDocs(collection(db, "Orders")),
          getDocs(collection(db, "Clients"))
        ]);

        // Build a fast indexed memory cache for client records
        const clientCache = {};
        clientsSnap.forEach(cDoc => { clientCache[cDoc.id] = cDoc.data(); });

        colIds.forEach(id => document.getElementById(id).innerHTML = '');
        allOrdersData = [];
        let tableRows = '';

        for (let docSnap of ordersSnap.docs) {
          const d = docSnap.data();
          const id = docSnap.id;

          // Read instantly from optimized client memory index cache
          let clientName = "Unknown"; let clientPhone = "";
          if (d.clientId && clientCache[d.clientId]) {
            clientName = clientCache[d.clientId].name || "Unknown";
            clientPhone = clientCache[d.clientId].phone || "";
          }

          let pets = d.pets || [];
          if (pets.length === 0 && d.petName) pets = [{ name: d.petName, photoUrl: d.photoUrl }];
          let petsStr = pets.length > 0 ? pets.map(p => p.name).join(' & ') : "Unknown Pet";
          const kanbanAvatars = renderPetAvatars(pets, { sizeClass: "w-9 h-9", singleClass: "border border-gray-100 dark:border-pm-dark-border", overlapClass: "-ml-3", maxVisible: DENSE_AVATAR_LIMIT });
          const tableAvatars = renderPetAvatars(pets, { sizeClass: "w-7 h-7", overlapClass: "-ml-2", maxVisible: DENSE_AVATAR_LIMIT });

          const colId = d.status || 'col-new';
          if(counts[colId] !== undefined) counts[colId]++;

          allOrdersData.push({ id, ...d, clientName, clientPhone, petsStr, pets });

          const kanbanContainer = document.getElementById(colId) || document.getElementById('col-new');
          const searchStr = `${clientName} ${petsStr} ${d.package || ''}`.toLowerCase();
          
          let paymentBadge = d.paymentStatus === 'full' ? `<span class="bg-gray-100 dark:bg-[#1A211D] text-gray-400 dark:text-gray-500 px-1.5 py-0.5 rounded text-[9px] font-bold">已付</span>` : 
                             (d.paymentStatus === 'deposit' ? `<span class="bg-pm-oak/10 text-pm-oak px-1.5 py-0.5 rounded text-[9px] font-bold">訂金</span>` : `<span class="bg-red-50 dark:bg-red-500/10 text-red-500 px-1.5 py-0.5 rounded text-[9px] font-bold">未付</span>`);

          kanbanContainer.insertAdjacentHTML('beforeend', `
            <div data-order-id="${id}" data-search="${searchStr}" class="kanban-card active-glow bg-white dark:bg-pm-dark-surface border border-gray-200/50 dark:border-white/5 p-4 rounded-2xl cursor-pointer shadow-taste dark:shadow-taste-dark pm-named mb-3" onclick="openDrawer('${id}')">
              <div class="flex items-start gap-3">
                ${kanbanAvatars}
                <div class="overflow-hidden flex-1">
                  <h4 class="font-bold text-xs text-gray-900 dark:text-white truncate mb-0.5">${petsStr}</h4>
                  <p class="text-[10px] text-gray-400 dark:text-gray-500 truncate mb-2.5 font-medium">${clientName}</p>
                  <div class="flex items-center justify-between flex-wrap gap-1">
                    <span class="text-[9px] text-gray-400 dark:text-gray-500 font-bold flex items-center gap-1 uppercase tracking-wider"><i data-lucide="calendar" class="w-3 h-3"></i> ${d.shootDate || '未定'}</span>
                    ${paymentBadge}
                  </div>
                </div>
              </div>
            </div>
          `);

          const statusMap = { "col-new": "新預約", "col-basic-edit": "基本修輯", "col-pick-photos": "揀相", "col-final-retouch": "精修", "col-completed": "已完成" };
          const bal = Number(d.price||0) - (Number(d.depositAmount) || Math.floor(Number(d.price||0)/2));
          const balText = d.paymentStatus === 'full' ? '-' : `HK$ ${bal.toLocaleString()}`;
          const balClass = d.paymentStatus === 'full' ? 'text-gray-400' : 'text-red-500 font-bold';

          tableRows += `
            <tr class="hover:bg-gray-50/80 dark:hover:bg-[#1A211D]/40 border-b border-gray-100 dark:border-pm-dark-border/40 transition-colors cursor-pointer" onclick="openDrawer('${id}')">
              <td class="px-6 py-3.5 flex items-center gap-3">
                ${tableAvatars}
                <div><p class="font-bold text-gray-900 dark:text-white">${petsStr}</p><p class="text-[10px] text-gray-400 font-medium">${clientName}</p></div>
              </td>
              <td class="px-6 py-3.5"><span class="bg-gray-50 dark:bg-pm-dark-border text-gray-500 dark:text-gray-400 text-[9px] px-2 py-0.5 rounded-md font-bold border border-gray-200 dark:border-transparent">${statusMap[colId]}</span></td>
              <td class="px-6 py-3.5 text-gray-500 dark:text-gray-400 font-semibold text-[11px] tracking-wide">${d.shootDate || '未定'}</td>
              <td class="px-6 py-3.5 text-gray-400 text-[11px] font-medium">${d.package || '-'}</td>
              <td class="px-6 py-3.5 text-right ${balClass}">${balText}</td>
            </tr>
          `;
        }

        colIds.forEach(id => {
            const countEl = document.getElementById(`count-${id}`);
            if(countEl) countEl.innerText = counts[id];
        });

        document.getElementById('table-body').innerHTML = tableRows;
        lucide.createIcons();

        colIds.forEach(colId => {
          const el = document.getElementById(colId);
          if (el) {
            new Sortable(el, {
              group: 'kanban', animation: 220, dragClass: 'sortable-drag', delay: window.innerWidth < 768 ? 200 : 0, delayOnTouchOnly: true,
              onEnd: async function(evt) {
                const itemEl = evt.item; const targetColId = evt.to.id; const orderId = itemEl.getAttribute('data-order-id');
                if (orderId && evt.from.id !== evt.to.id) {
                  try { 
                      await updateDoc(doc(db, "Orders", orderId), { status: targetColId }); 
                      setTimeout(() => loadOrders(), 400);
                  } catch(e) { evt.from.appendChild(itemEl); }
                }
              }
            });
          }
        });

        document.getElementById('global-search').addEventListener('input', (e) => {
          const term = e.target.value.toLowerCase();
          document.querySelectorAll('.kanban-card').forEach(card => {
            card.style.display = (card.getAttribute('data-search').includes(term)) ? 'block' : 'none';
          });
        });

      } catch (err) { 
        // [SKILL: Code Review] Graceful degradation safety UI anchor
        console.error("Pipeline Sync Error:", err); 
        document.getElementById('main-view-container').innerHTML = `
          <div class="flex flex-col items-center justify-center h-full p-6 text-center">
            <div class="w-12 h-12 rounded-full bg-red-50 dark:bg-red-500/10 text-red-500 flex items-center justify-center mb-4"><i data-lucide="wifi-off" class="w-6 h-6"></i></div>
            <h4 class="font-bold text-gray-900 dark:text-white mb-1">同步數據庫失敗</h4>
            <p class="text-xs text-gray-400 max-w-xs mb-4">無法安全連接到遠端服務，這可能是由於網絡波動或憑證過期引起。</p>
            <button onclick="window.location.reload()" class="bg-pm-green text-white dark:bg-pm-oak dark:text-gray-900 px-4 py-2 rounded-xl text-xs font-bold shadow-sm">重新嘗試安全連接</button>
          </div>
        `;
        lucide.createIcons();
      }
    }

    loadOrders();
  </script>
</body>
</html>
