<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <script>if(!sessionStorage.getItem('pm_admin_logged')){window.location.href='login.html';}</script>
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <script id="tailwind-config">
    tailwind.config = { 
      darkMode: 'class',
      theme: { 
        extend: { 
          colors: { 
            "pm-green": "#2D4F1E", 
            "pm-oak": "#D4A373", 
            "pm-cream": "#FDFBF7", 
            "pm-accent": "#E8B4B8",
            "whatsapp": "#25D366",
            "pm-dark-bg": "#161916",

            serif: ['"Playfair Display"', 'serif'],

  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    body { min-height: 100dvh; overflow: hidden; transition: background-color 0.3s ease, color 0.3s ease; }
    
    /* 拖拽微交互效果 */
    .sortable-ghost { opacity: 0.4; background-color: #FDFBF7; border: 2px dashed #D4A373; border-radius: 0.75rem; }
    .dark .sortable-ghost { background-color: #161916; border-color: #D4A373; }
    .sortable-drag { transform: scale(1.02) rotate(2deg); opacity: 0.95 !important; cursor: grabbing !important; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.15); }
    
    /* Skeleton Loading 動畫 */
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    .animate-pulse-soft { animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>

  <div id="custom-confirm-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/40 backdrop-blur-sm transition-opacity opacity-0">

      <div class="w-12 h-12 rounded-full bg-red-50 dark:bg-red-900/20 flex items-center justify-center mb-4">
        <span class="material-symbols-outlined text-red-500 dark:text-red-400 text-2xl">warning</span>
      </div>
      <h3 class="text-xl font-serif font-bold text-gray-900 dark:text-white mb-2">確定刪除預約？</h3>
      <p class="text-gray-500 dark:text-gray-400 text-sm mb-8 leading-relaxed">刪除後此訂單的所有資料將無法復原。請確認是否繼續操作。</p>

        <button id="modal-confirm-btn" class="px-5 py-2.5 rounded-xl text-sm font-bold bg-red-500 hover:bg-red-600 text-white shadow-md transition-colors active:scale-95">確認刪除</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-3 pointer-events-none"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, updateDoc, collection, getDocs, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBhFUkCP0WslzdB2WY93hp6L-Z5g8vo40E", authDomain: "pawfect-memories-2c8a0.firebaseapp.com", projectId: "pawfect-memories-2c8a0", storageBucket: "pawfect-memories-2c8a0.firebasestorage.app", messagingSenderId: "860879002502", appId: "1:860879002502:web:eeaa936317b1fefc33aa07" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Dark Mode 切換邏輯
    window.toggleDarkMode = function() {
      const htmlEl = document.documentElement;
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        htmlEl.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    };

    // 鍵盤快捷鍵 '/' 快速搜尋
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        document.getElementById('global-search').focus();
      }
    });

    // 輕量提示 (Toast)
    window.showToast = function(msg, type='success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'error' ? 'bg-red-500' : 'bg-pm-green dark:bg-pm-oak';
      const textColor = type === 'error' ? 'text-white' : 'text-white dark:text-[#2A1E11]';
      const icon = type === 'error' ? 'error' : 'check_circle';
      
      toast.className = `px-5 py-3 rounded-xl shadow-xl ${textColor} text-sm font-medium transform transition-all translate-y-10 opacity-0 flex items-center gap-3 ${bgColor}`;
      toast.innerHTML = `<span class="material-symbols-outlined text-[20px]">${icon}</span> ${msg}`;
      
      container.appendChild(toast);
      
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-10', 'opacity-0');
      });
      
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // 自訂 Modal 刪除邏輯
    let deleteTargetId = null;
    const modal = document.getElementById('custom-confirm-modal');
    const modalConfirmBtn = document.getElementById('modal-confirm-btn');
    const modalCancelBtn = document.getElementById('modal-cancel-btn');

    function closeModal() {
      modal.classList.add('opacity-0');
      modal.firstElementChild.classList.remove('scale-100');
      modal.firstElementChild.classList.add('scale-95');
      setTimeout(() => modal.classList.add('hidden'), 300);
      deleteTargetId = null;
    }

    window.deleteOrder = function(orderId) {
      deleteTargetId = orderId;
      modal.classList.remove('hidden');
      // Trigger reflow for animation
      void modal.offsetWidth; 
      modal.classList.remove('opacity-0');
      modal.firstElementChild.classList.remove('scale-95');
      modal.firstElementChild.classList.add('scale-100');
    };

    modalCancelBtn.onclick = closeModal;
    modalConfirmBtn.onclick = async function() {
      if (!deleteTargetId) return;
      const id = deleteTargetId;
      closeModal();
      
      // 顯示 loading 狀態嘅卡片
      const card = document.querySelector(`[data-order-id="${id}"]`);
      if(card) {
        card.style.opacity = '0.5';
        card.style.pointerEvents = 'none';
      }

      try { 
        await deleteDoc(doc(db, "Orders", id)); 
        if(card) card.remove();
        showToast("訂單已成功刪除");
        // 重新檢查 Empty State
        checkEmptyStates();
      } 
      catch (e) { 
        if(card) { card.style.opacity = '1'; card.style.pointerEvents = 'auto'; }
        showToast("刪除失敗，請檢查網絡連線", "error"); 
      }
    };

    let eventsByDate = {};
    let currentCalYear = new Date().getFullYear();
    let currentCalMonth = new Date().getMonth();
    let selectedDateStr = "";

    function getFormattedDateStr(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // 生成 Skeleton HTML
    function getSkeletonHTML() {
      return `
        <div class="bg-gray-50 dark:bg-pm-dark-surface border border-gray-100 dark:border-pm-dark-border p-4 rounded-xl flex items-center gap-3 animate-pulse-soft mb-3">
          <div class="w-12 h-12 rounded-full bg-gray-200 dark:bg-pm-dark-border shrink-0"></div>
          <div class="flex-1">
            <div class="h-4 bg-gray-200 dark:bg-pm-dark-border rounded w-3/4 mb-2"></div>
            <div class="h-3 bg-gray-200 dark:bg-pm-dark-border rounded w-1/2"></div>
          </div>
        </div>
      `;
    }

    // 生成 Empty State HTML
    function getEmptyStateHTML(type) {
      const msg = type === 'calendar' ? '是日無預約行程' : '暫無處理訂單';
      const icon = type === 'calendar' ? 'event_busy' : 'inbox';
      return `
        <div class="flex flex-col items-center justify-center h-32 text-gray-400 dark:text-gray-500 opacity-60 pointer-events-none empty-state-marker">
          <span class="material-symbols-outlined text-3xl mb-2">${icon}</span>
          <p class="text-xs font-medium">${msg}</p>
        </div>
      `;
    }

    function checkEmptyStates() {
      ['col-new', 'col-basic-edit', 'col-pick-photos', 'col-final-retouch', 'col-completed'].forEach(colId => {
        const col = document.getElementById(colId);
        // 如果無 kanban-card，就顯示 Empty state
        if (col.querySelectorAll('.kanban-card').length === 0) {
          if (!col.querySelector('.empty-state-marker')) {
            col.innerHTML = getEmptyStateHTML('kanban');
          }
        } else {
          const emptyMarker = col.querySelector('.empty-state-marker');
          if (emptyMarker) emptyMarker.remove();
        }
      });
    }

    async function loadOrders() {
      const colIds = ['col-new', 'col-basic-edit', 'col-pick-photos', 'col-final-retouch', 'col-completed'];
      
      // 1. 顯示 Skeleton Loading
      colIds.forEach(id => {
        document.getElementById(id).innerHTML = getSkeletonHTML() + getSkeletonHTML();
      });

      try {
        const ordersSnap = await getDocs(collection(db, "Orders"));
        let monthCount = 0; 
        let totalRev = 0; 
        const now = new Date();
        const currentMonthPrefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        
        // 清除 Skeleton
        colIds.forEach(id => document.getElementById(id).innerHTML = '');
        eventsByDate = {};

        for (let docSnap of ordersSnap.docs) {
          const data = docSnap.data();
          const orderId = docSnap.id;

          totalRev += Number(data.price || 0);

          let clientName = "未知客戶";
          let clientPhone = "";
          if (data.clientId) {
            const cSnap = await getDoc(doc(db, "Clients", data.clientId));
            if (cSnap.exists()) {
              clientName = cSnap.data().name;
              clientPhone = cSnap.data().phone || "";
            }
          }

          let pets = data.pets || [];
          if (pets.length === 0 && data.petName) pets = [{ name: data.petName, photoUrl: data.photoUrl }];
          let displayName = pets.length > 0 ? pets.map(p => p.name).join(' & ') : "未知寵物";
          
          let avatarsHTML = '';
          if (pets.length === 0) {
            avatarsHTML = `<img class="w-12 h-12 rounded-full object-cover border-2 border-white dark:border-[#242A26] shadow-sm shrink-0" src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=150&h=150&fit=crop">`;
          } else {
            pets.slice(0, 3).forEach((p, j) => {
              const zIndex = 30 - (j * 10);
              const marginClass = j > 0 ? '-ml-5' : '';
              const imgSrc = p.photoUrl || "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=150&h=150&fit=crop";
              if (j === 2 && pets.length > 3) {
                avatarsHTML += `<div class="w-12 h-12 rounded-full border-2 border-white dark:border-[#242A26] shadow-sm relative flex items-center justify-center bg-gray-100 dark:bg-pm-dark-border text-gray-500 dark:text-gray-300 text-xs font-bold shrink-0 ${marginClass}" style="z-index:${zIndex};">+${pets.length - 2}</div>`;
              } else {
                avatarsHTML += `<img class="w-12 h-12 rounded-full object-cover border-2 border-white dark:border-[#242A26] shadow-sm relative shrink-0 bg-gray-50 dark:bg-[#131613] ${marginClass}" style="z-index:${zIndex};" src="${imgSrc}">`;
              }
            });
          }

          if (data.shootDate) {
            if (data.shootDate.startsWith(currentMonthPrefix)) monthCount++;
            const eventColor = data.status === 'col-completed' ? '#D4A373' : '#2D4F1E';
            const eventObj = { 
                id: orderId, title: `${clientName} - ${displayName}`, time: data.shootTime || "全日", 
                color: eventColor, package: data.package || "預約", url: `detail.html?id=${orderId}`, 
                location: data.shootLocation || "", price: Number(data.price || 0) 
            };
            if (!eventsByDate[data.shootDate]) eventsByDate[data.shootDate] = [];
            eventsByDate[data.shootDate].push(eventObj);
          }

          let rawStatus = data.paymentStatus ? String(data.paymentStatus).toLowerCase() : '';
          let paymentBadge = '';
          if (rawStatus === 'full' || rawStatus === 'paid') {
            paymentBadge = `<span class="bg-pm-green/10 text-pm-green dark:text-[#8DBA76] border border-pm-green/20 dark:border-[#8DBA76]/30 px-2 py-0.5 rounded text-[10px] font-bold whitespace-nowrap">全數已付</span>`;
          } else if (rawStatus === 'deposit' || data.depositPaid === true) {
            paymentBadge = `<span class="bg-pm-oak/10 text-pm-oak border border-pm-oak/20 dark:border-pm-oak/30 px-2 py-0.5 rounded text-[10px] font-bold whitespace-nowrap">已付訂</span>`;
          } else {
            paymentBadge = `<span class="bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 border border-red-100 dark:border-red-800/50 px-2 py-0.5 rounded text-[10px] font-bold whitespace-nowrap">未付訂</span>`;
          }

          let tagsHTML = '';
          let tagsSearchString = ''; 
          if (data.tags && Array.isArray(data.tags)) {
            tagsHTML = data.tags.map(tag => {
              tagsSearchString += ` ${tag.name}`;
              return `<span class="px-2 py-0.5 rounded text-[10px] font-bold whitespace-nowrap bg-gray-100 dark:bg-pm-dark-border text-gray-500 dark:text-gray-300">${tag.name}</span>`;
            }).join('');
          }

          let waBtn = '';
          if (clientPhone) {
            const cleanPhone = clientPhone.replace(/\D/g, '');
            const msg = encodeURIComponent(`Hi ${clientName}，這裡是 Pawfect Memories！想同你確認一下預約詳情 📸`);
            waBtn = `
              <a href="https://wa.me/852${cleanPhone}?text=${msg}" target="_blank" onclick="event.stopPropagation();" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-whatsapp/10 text-gray-400 dark:text-gray-500 hover:text-whatsapp dark:hover:text-whatsapp transition-colors cursor-pointer" title="WhatsApp 聯絡">
                <span class="material-symbols-outlined text-[18px]">chat</span>
              </a>
            `;
          }

          const colId = data.status || 'col-new';
          const container = document.getElementById(colId) || document.getElementById('col-new');
          const searchStr = `${clientName} ${displayName} ${data.package || ''} ${tagsSearchString}`.toLowerCase();

          container.insertAdjacentHTML('beforeend', `
            <div data-order-id="${orderId}" data-search="${searchStr}" class="kanban-card bg-white dark:bg-[#242A26] border border-gray-100 dark:border-[#2A302B] p-4 rounded-xl flex items-center justify-between cursor-pointer border-l-4 border-l-pm-green dark:border-l-[#8DBA76] hover:shadow-lg dark:hover:shadow-black/40 hover:border-l-pm-oak dark:hover:border-l-pm-oak transition-all mb-3 shadow-sm group">
              <div onclick="window.location.href='detail.html?id=${orderId}'" class="flex items-center gap-3 md:gap-4 flex-1 overflow-hidden">
                <div class="flex items-center shrink-0 pl-1">${avatarsHTML}</div>
                <div class="overflow-hidden flex flex-col justify-center w-full pr-2">
                  <h4 class="font-bold text-sm md:text-base text-gray-800 dark:text-[#F0F0F0] truncate mb-0.5">${displayName}</h4>
                  <p class="text-[10px] md:text-xs text-gray-500 dark:text-gray-400 truncate">${clientName}</p>
                  <div class="flex items-center gap-1.5 mt-2 flex-wrap">
                    <span class="text-[10px] text-gray-600 dark:text-gray-300 whitespace-nowrap font-medium bg-gray-50 dark:bg-[#1C211D] px-2 py-0.5 rounded flex items-center gap-1 border border-transparent dark:border-pm-dark-border"><span class="material-symbols-outlined text-[12px]">calendar_today</span> ${data.shootDate || '未定日期'}</span>
                    ${paymentBadge}
                    ${tagsHTML}
                  </div>
                </div>
              </div>
              <div class="flex flex-col gap-1 shrink-0 ml-1 z-20 relative opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                ${waBtn}
                <button onclick="event.stopPropagation(); window.location.href='add.html?editId=${orderId}';" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-pm-green/10 dark:hover:bg-pm-oak/10 text-gray-400 dark:text-gray-500 hover:text-pm-green dark:hover:text-pm-oak transition-colors cursor-pointer" title="編輯訂單">
                  <span class="material-symbols-outlined text-[18px]">edit</span>
                </button>
                <button onclick="event.stopPropagation(); window.deleteOrder('${orderId}');" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 dark:hover:bg-red-900/20 text-gray-400 dark:text-gray-500 hover:text-red-500 dark:hover:text-red-400 transition-colors cursor-pointer" title="刪除訂單">
                  <span class="material-symbols-outlined text-[18px]">delete</span>
                </button>
              </div>
            </div>
          `);
        }

        document.getElementById('stat-count').innerText = monthCount;
        document.getElementById('stat-revenue').innerText = "HK$ " + totalRev; 
        
        // 檢查並加入 Empty States
        checkEmptyStates();

        const searchInput = document.getElementById('global-search');
        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.kanban-card').forEach(card => {
              const text = card.getAttribute('data-search');
              card.style.display = (text && text.includes(term)) ? 'flex' : 'none';
            });
          });
        }
      } catch (err) { 
        colIds.forEach(id => document.getElementById(id).innerHTML = getEmptyStateHTML('kanban'));
        showToast("無法載入資料，請檢查網絡連線", "error");
      }
    }

    window.renderCustomCalendar = function() {
      const grid = document.getElementById('custom-calendar-grid');
      const title = document.getElementById('custom-month-title');
      const revenueLabel = document.getElementById('custom-month-revenue');
      
      const monthNames = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
      title.innerText = `${currentCalYear}年 ${monthNames[currentCalMonth]}`;
      grid.innerHTML = '';

      let currentMonthRevenue = 0;

      const firstDay = new Date(currentCalYear, currentCalMonth, 1).getDay();
      const days = new Date(currentCalYear, currentCalMonth + 1, 0).getDate();
      for (let i = 0; i < firstDay; i++) grid.innerHTML += '<div></div>';

      for (let d = 1; d <= days; d++) {
        const dStr = getFormattedDateStr(new Date(currentCalYear, currentCalMonth, d));
        const hasEvent = eventsByDate[dStr];
        
        if (hasEvent) {
          hasEvent.forEach(ev => { currentMonthRevenue += ev.price; });
        }

        const isSelected = dStr === selectedDateStr;
        grid.innerHTML += `
          <div onclick="window.handleDaySelection('${dStr}')" class="flex flex-col items-center py-2 cursor-pointer rounded-xl transition-colors ${isSelected ? 'bg-pm-green/5 dark:bg-pm-oak/10' : 'hover:bg-gray-50 dark:hover:bg-pm-dark-border'}">
            <div class="w-8 h-8 flex items-center justify-center rounded-full ${isSelected ? 'bg-pm-green dark:bg-pm-oak text-white dark:text-[#2A1E11] font-bold shadow-md' : 'text-gray-600 dark:text-gray-400'}">${d}</div>
            <div class="flex gap-1 h-1 mt-1">${hasEvent ? '<div class="w-1.5 h-1.5 bg-pm-oak rounded-full"></div>' : ''}</div>
          </div>`;
      }
      
      revenueLabel.innerText = `當月營業額: HK$ ${currentMonthRevenue}`;
    };

    window.handleDaySelection = function(dateStr) {
      selectedDateStr = dateStr;
      window.renderCustomCalendar();
      const list = document.getElementById('agenda-list');
      const header = document.getElementById('list-date-header');
      const events = eventsByDate[dateStr] || [];
      header.innerText = dateStr; header.classList.remove('hidden');
      
      if (events.length === 0) {
        list.innerHTML = getEmptyStateHTML('calendar');
      } else {
        list.innerHTML = events.map(ev => `
          <div onclick="window.location.href='${ev.url}'" class="bg-gray-50 dark:bg-[#242A26] hover:bg-pm-green/5 dark:hover:bg-pm-oak/5 transition-colors p-4 rounded-xl flex justify-between items-center cursor-pointer border-l-[6px] border border-gray-100 dark:border-pm-dark-border" style="border-left-color:${ev.color === '#2D4F1E' ? (document.documentElement.classList.contains('dark') ? '#8DBA76' : '#2D4F1E') : ev.color}">
            <div class="pr-2">
                <p class="font-bold text-gray-800 dark:text-[#F0F0F0] leading-snug">${ev.title}</p>
                <div class="flex items-center gap-2 mt-1.5">
                  <span class="text-xs text-pm-green dark:text-[#8DBA76] font-medium bg-pm-green/10 dark:bg-[#8DBA76]/10 px-2 py-0.5 rounded border border-pm-green/20 dark:border-[#8DBA76]/20">${ev.package}</span>
                  ${ev.location ? `<span class="text-xs text-gray-500 dark:text-gray-400 flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">location_on</span>${ev.location}</span>` : ''}
                </div>
            </div>
            <p class="text-sm font-bold text-pm-oak shrink-0">${ev.time}</p>
          </div>
        `).join('');
      }
    };

    async function startApp() {
      await loadOrders();
      if (!selectedDateStr) selectedDateStr = getFormattedDateStr(new Date());
      window.renderCustomCalendar();
      window.handleDaySelection(selectedDateStr);
      
      ['col-new', 'col-basic-edit', 'col-pick-photos', 'col-final-retouch', 'col-completed'].forEach(colId => {
        const el = document.getElementById(colId);
        if (el && typeof Sortable !== 'undefined') {
          new Sortable(el, {
            group: 'kanban',
            animation: 250, // 增加動畫順滑度
            dragClass: 'sortable-drag', // 加入拖曳實體感 class
            delay: window.innerWidth < 768 ? 200 : 0,
            delayOnTouchOnly: true,
            onEnd: async function(evt) {
              const itemEl = evt.item;
              const targetColId = evt.to.id;
              const orderId = itemEl.getAttribute('data-order-id');
              
              // 拖曳結束後即時檢查兩邊嘅 Empty States
              checkEmptyStates();

              if (orderId && evt.from.id !== evt.to.id) {
                try { 
                  await updateDoc(doc(db, "Orders", orderId), { status: targetColId }); 
                  showToast("狀態已更新");
                } 
                catch(e) { 
                  evt.from.appendChild(itemEl); 
                  checkEmptyStates(); // 還原狀態
                  showToast("更新失敗，請檢查網絡", "error");
                }
              }
            }
          });
        }
      });
    }
    
    startApp();

    document.getElementById('prev-month-btn').onclick = () => { currentCalMonth--; if(currentCalMonth<0){currentCalMonth=11;currentCalYear--;} window.renderCustomCalendar(); };
    document.getElementById('next-month-btn').onclick = () => { currentCalMonth++; if(currentCalMonth>11){currentCalMonth=0;currentCalYear++;} window.renderCustomCalendar(); };

    document.getElementById('btn-view-kanban').onclick = function() {
      const isDark = document.documentElement.classList.contains('dark');
      this.className = `px-5 py-2.5 rounded-lg text-sm font-bold shadow-md flex items-center gap-2 transition-all ${isDark ? 'bg-pm-oak text-[#2A1E11]' : 'bg-pm-green text-white'}`;
      document.getElementById('btn-view-calendar').className = "px-5 py-2.5 rounded-lg text-sm font-bold text-gray-500 dark:text-gray-400 hover:text-pm-green dark:hover:text-white transition-all flex items-center gap-2";
      document.getElementById('view-kanban').classList.remove('hidden'); document.getElementById('view-calendar').classList.add('hidden');
    };
    
    document.getElementById('btn-view-calendar').onclick = function() {
      const isDark = document.documentElement.classList.contains('dark');
      this.className = `px-5 py-2.5 rounded-lg text-sm font-bold shadow-md flex items-center gap-2 transition-all ${isDark ? 'bg-pm-oak text-[#2A1E11]' : 'bg-pm-green text-white'}`;
      document.getElementById('btn-view-kanban').className = "px-5 py-2.5 rounded-lg text-sm font-bold text-gray-500 dark:text-gray-400 hover:text-pm-green dark:hover:text-white transition-all flex items-center gap-2";
      document.getElementById('view-kanban').classList.add('hidden'); document.getElementById('view-calendar').classList.remove('hidden');
    };
  </script>
</body>
</html>
