<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <script>if(!sessionStorage.getItem('pm_admin_logged')){window.location.href='login.html';}</script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

    tailwind.config = {

<body class="bg-pm-cream text-gray-800 font-sans h-[100dvh] flex flex-col selection:bg-pm-oak selection:text-white">
  <header class="bg-white shadow-sm shrink-0 w-full z-50 h-16 md:h-20 flex justify-between items-center px-4 md:px-6">

      <div class="flex flex-col cursor-pointer select-none" onclick="window.location.href='index.html';">

      <button onclick="window.open('tracker.html', '_blank');" class="ml-2 w-8 h-8 flex items-center justify-center rounded-lg bg-gray-50 text-gray-400 hover:text-pm-green transition-colors" title="前往客人查詢頁">
        <span class="material-symbols-outlined text-[18px]">open_in_new</span>
      </button>
    </div>
    
    <div class="hidden md:flex relative w-64 mx-4">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-[18px]">search</span>
      <input type="text" id="global-search" placeholder="搜尋客人、寵物、標籤..." class="w-full bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-full pl-9 pr-4 py-2 focus:outline-none focus:border-pm-green focus:ring-1 focus:ring-pm-green transition-all">
    </div>

    <div class="flex items-center gap-2 md:gap-4 shrink-0">
      <button onclick="window.location.href='dashboard.html';" class="w-9 h-9 md:w-10 md:h-10 flex items-center justify-center rounded-full text-gray-400 hover:text-pm-green hover:bg-pm-green/10 transition-colors">
        <span class="material-symbols-outlined text-xl md:text-2xl">bar_chart</span>
      </button>
      <button onclick="window.location.href='settings.html';" class="w-9 h-9 md:w-10 md:h-10 flex items-center justify-center rounded-full text-gray-400 hover:text-pm-green hover:bg-pm-green/10 transition-colors">
        <span class="material-symbols-outlined text-xl md:text-2xl">settings</span>
      </button>
      <button onclick="window.location.href='add.html';" class="bg-pm-green text-white w-9 h-9 md:w-10 md:h-10 rounded-full flex items-center justify-center shadow-lg hover:bg-[#223d16] active:scale-95 transition-all">
        <span class="material-symbols-outlined font-bold text-xl">add</span>
      </button>
    </div>
  </header>

  <main class="flex-1 px-4 md:px-6 flex flex-col max-w-[1400px] mx-auto w-full overflow-hidden pb-4 md:pb-8 pt-2">
    <div class="py-2 md:py-6 flex flex-col md:flex-row md:items-end justify-between gap-4 shrink-0">
      <div class="w-full md:w-auto">
        <h2 class="font-serif text-2xl md:text-4xl font-bold tracking-tight text-pm-green mb-3">訂單進度</h2>
        <div class="flex gap-4 items-center bg-white px-5 py-3 rounded-xl border border-gray-100 shadow-sm w-full md:w-fit">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-pm-oak text-[20px]">calendar_today</span>
            <span class="text-sm text-gray-500">本月預約: <strong id="stat-count" class="text-gray-800 text-base">0</strong></span>
          </div>
          <div class="w-[1px] h-6 bg-gray-200"></div>
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-pm-oak text-[20px]">payments</span>
            <span class="text-sm text-gray-500">總營業額: <strong id="stat-revenue" class="text-pm-green font-bold text-base">HK$ 0</strong></span>
          </div>
        </div>
      </div>
      <div class="flex bg-gray-100 rounded-xl p-1 border border-gray-200 shrink-0 w-fit">
        <button id="btn-view-kanban" class="px-5 py-2.5 rounded-lg text-sm font-bold bg-pm-green text-white shadow-md flex items-center gap-2 transition-all"><span class="material-symbols-outlined text-[18px]">view_column</span> 看板</button>
        <button id="btn-view-calendar" class="px-5 py-2.5 rounded-lg text-sm font-bold text-gray-500 hover:text-pm-green hover:bg-white transition-all flex items-center gap-2"><span class="material-symbols-outlined text-[18px]">calendar_month</span> 月曆</button>
      </div>
    </div>

    <div class="flex-1 min-h-0 relative">
      <div id="view-kanban" class="w-full h-full overflow-x-auto no-scrollbar block">
        <div class="flex gap-4 h-full min-w-max pb-2">
          <section class="w-[300px] flex flex-col bg-white border border-gray-100 shadow-sm rounded-2xl p-4 h-full shrink-0">
            <h3 class="font-bold text-sm text-gray-500 flex items-center gap-2 mb-4 border-b border-gray-50 pb-2"><span class="material-symbols-outlined text-[18px] text-gray-400">fiber_new</span> 新預約</h3>
            <div id="col-new" class="flex-1 overflow-y-auto no-scrollbar space-y-3"></div>
          </section>
          <section class="w-[300px] flex flex-col bg-white border border-gray-100 shadow-sm rounded-2xl p-4 h-full shrink-0">
            <h3 class="font-bold text-sm text-pm-oak flex items-center gap-2 mb-4 border-b border-gray-50 pb-2"><span class="material-symbols-outlined text-[18px]">palette</span> 基本修輯</h3>
            <div id="col-basic-edit" class="flex-1 overflow-y-auto no-scrollbar space-y-3"></div>
          </section>
          <section class="w-[300px] flex flex-col bg-white border border-gray-100 shadow-sm rounded-2xl p-4 h-full shrink-0">
            <h3 class="font-bold text-sm text-blue-500 flex items-center gap-2 mb-4 border-b border-gray-50 pb-2"><span class="material-symbols-outlined text-[18px]">photo_library</span> 揀相</h3>
            <div id="col-pick-photos" class="flex-1 overflow-y-auto no-scrollbar space-y-3"></div>
          </section>
          <section class="w-[300px] flex flex-col bg-white border border-gray-100 shadow-sm rounded-2xl p-4 h-full shrink-0">
            <h3 class="font-bold text-sm text-purple-500 flex items-center gap-2 mb-4 border-b border-gray-50 pb-2"><span class="material-symbols-outlined text-[18px]">auto_fix_high</span> 精修</h3>
            <div id="col-final-retouch" class="flex-1 overflow-y-auto no-scrollbar space-y-3"></div>
          </section>
          <section class="w-[300px] flex flex-col bg-white border border-gray-100 shadow-sm rounded-2xl p-4 h-full shrink-0">
            <h3 class="font-bold text-sm text-pm-green flex items-center gap-2 mb-4 border-b border-gray-50 pb-2"><span class="material-symbols-outlined text-[18px]">check_circle</span> 完成</h3>
            <div id="col-completed" class="flex-1 overflow-y-auto no-scrollbar space-y-3"></div>
          </section>
        </div>
      </div>

      <div id="view-calendar" class="w-full h-full hidden flex-col overflow-hidden bg-white border border-gray-100 shadow-sm rounded-2xl p-4 md:p-6">
        <div class="w-full shrink-0 mb-4 md:w-[600px] md:mx-auto">
          <div class="flex justify-between items-center mb-6">
            <button id="prev-month-btn" class="w-10 h-10 flex items-center justify-center bg-gray-50 rounded-full text-pm-oak hover:bg-pm-oak/10 transition-colors"><span class="material-symbols-outlined">chevron_left</span></button>
            <div class="flex flex-col items-center">
              <h3 id="custom-month-title" class="font-serif text-2xl font-bold text-pm-green leading-tight"></h3>
              <span id="custom-month-revenue" class="text-xs text-pm-oak font-bold bg-pm-oak/10 px-3 py-1 rounded-full mt-1.5 border border-pm-oak/20">HK$ 0</span>
            </div>
            <button id="next-month-btn" class="w-10 h-10 flex items-center justify-center bg-gray-50 rounded-full text-pm-oak hover:bg-pm-oak/10 transition-colors"><span class="material-symbols-outlined">chevron_right</span></button>
          </div>
          <div class="grid grid-cols-7 text-center text-xs font-bold text-gray-400 uppercase mb-3">
            <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
          </div>
          <div id="custom-calendar-grid" class="grid grid-cols-7 gap-y-3"></div>
        </div>
        <div class="flex-1 border-t border-gray-100 overflow-y-auto no-scrollbar pt-6 md:w-[600px] md:mx-auto w-full">
            <h4 id="list-date-header" class="text-pm-green font-serif font-bold text-xl mb-4 hidden"></h4>
            <div id="agenda-list" class="flex flex-col gap-3"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, updateDoc, collection, getDocs, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBhFUkCP0WslzdB2WY93hp6L-Z5g8vo40E", authDomain: "pawfect-memories-2c8a0.firebaseapp.com", projectId: "pawfect-memories-2c8a0", storageBucket: "pawfect-memories-2c8a0.firebasestorage.app", messagingSenderId: "860879002502", appId: "1:860879002502:web:eeaa936317b1fefc33aa07" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.deleteOrder = async function(orderId) {
      if (!confirm("⚠️ 警告：確定要刪除這筆預約單嗎？\n刪除後將無法復原！")) return;
      try { await deleteDoc(doc(db, "Orders", orderId)); window.location.reload(); } 
      catch (e) { alert("刪除失敗，請檢查網路！"); }
    };

    let eventsByDate = {};
    let currentCalYear = new Date().getFullYear();
    let currentCalMonth = new Date().getMonth();
    let selectedDateStr = "";

    function getFormattedDateStr(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    async function loadOrders() {
      try {
        const ordersSnap = await getDocs(collection(db, "Orders"));
        let monthCount = 0; 
        let totalRev = 0; 
        const now = new Date();
        const currentMonthPrefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        
        document.getElementById('col-new').innerHTML = '';
        document.getElementById('col-basic-edit').innerHTML = '';
        document.getElementById('col-pick-photos').innerHTML = '';
        document.getElementById('col-final-retouch').innerHTML = '';
        document.getElementById('col-completed').innerHTML = '';
        eventsByDate = {};

        for (let docSnap of ordersSnap.docs) {
          const data = docSnap.data();
          const orderId = docSnap.id;

          totalRev += Number(data.price || 0);

          let clientName = "未知客戶";
          let clientPhone = "";
          if (data.clientId) {
            const cSnap = await getDoc(doc(db, "Clients", data.clientId));
            if (cSnap.exists()) {
              clientName = cSnap.data().name;
              clientPhone = cSnap.data().phone || "";
            }
          }

          let pets = data.pets || [];
          if (pets.length === 0 && data.petName) pets = [{ name: data.petName, photoUrl: data.photoUrl }];
          let displayName = pets.length > 0 ? pets.map(p => p.name).join(' & ') : "未知寵物";
          
          let avatarsHTML = '';
          if (pets.length === 0) {
            avatarsHTML = `<img class="w-12 h-12 rounded-full object-cover border-2 border-white shadow-sm shrink-0" src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=150&h=150&fit=crop">`;
          } else {
            pets.slice(0, 3).forEach((p, j) => {
              const zIndex = 30 - (j * 10);
              const marginClass = j > 0 ? '-ml-5' : '';
              const imgSrc = p.photoUrl || "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=150&h=150&fit=crop";
              if (j === 2 && pets.length > 3) {
                avatarsHTML += `<div class="w-12 h-12 rounded-full border-2 border-white shadow-sm relative flex items-center justify-center bg-gray-100 text-gray-500 text-xs font-bold shrink-0 ${marginClass}" style="z-index:${zIndex};">+${pets.length - 2}</div>`;
              } else {
                avatarsHTML += `<img class="w-12 h-12 rounded-full object-cover border-2 border-white shadow-sm relative shrink-0 bg-gray-50 ${marginClass}" style="z-index:${zIndex};" src="${imgSrc}">`;
              }
            });
          }

          if (data.shootDate) {
            if (data.shootDate.startsWith(currentMonthPrefix)) monthCount++;
            const eventColor = data.status === 'col-completed' ? '#D4A373' : '#2D4F1E';
            const eventObj = { 
                id: orderId, title: `${clientName} - ${displayName}`, time: data.shootTime || "全日", 
                color: eventColor, package: data.package || "預約", url: `detail.html?id=${orderId}`, 
                location: data.shootLocation || "", price: Number(data.price || 0) 
            };
            if (!eventsByDate[data.shootDate]) eventsByDate[data.shootDate] = [];
            eventsByDate[data.shootDate].push(eventObj);
          }

          let rawStatus = data.paymentStatus ? String(data.paymentStatus).toLowerCase() : '';
          let paymentBadge = '';
          if (rawStatus === 'full' || rawStatus === 'paid') {
            paymentBadge = `<span class="bg-pm-green/10 text-pm-green border border-pm-green/20 px-2 py-0.5 rounded text-[10px] font-bold whitespace-nowrap">全數已付</span>`;
          } else if (rawStatus === 'deposit' || data.depositPaid === true) {
            paymentBadge = `<span class="bg-pm-oak/10 text-pm-oak border border-pm-oak/20 px-2 py-0.5 rounded text-[10px] font-bold whitespace-nowrap">已付訂</span>`;
          } else {
            paymentBadge = `<span class="bg-red-50 text-red-600 border border-red-100 px-2 py-0.5 rounded text-[10px] font-bold whitespace-nowrap">未付訂</span>`;
          }

          let tagsHTML = '';
          let tagsSearchString = ''; 
          if (data.tags && Array.isArray(data.tags)) {
            tagsHTML = data.tags.map(tag => {
              tagsSearchString += ` ${tag.name}`;
              return `<span class="px-2 py-0.5 rounded text-[10px] font-bold whitespace-nowrap bg-gray-100 text-gray-500">${tag.name}</span>`;
            }).join('');
          }

          let waBtn = '';
          if (clientPhone) {
            const cleanPhone = clientPhone.replace(/\D/g, '');
            const msg = encodeURIComponent(`Hi ${clientName}，這裡是 Pawfect Memories！想同你確認一下預約詳情 📸`);
            waBtn = `
              <a href="https://wa.me/852${cleanPhone}?text=${msg}" target="_blank" onclick="event.stopPropagation();" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-whatsapp/10 text-gray-400 hover:text-whatsapp transition-colors cursor-pointer" title="WhatsApp 聯絡">
                <span class="material-symbols-outlined text-[18px]">chat</span>
              </a>
            `;
          }

          const colId = data.status || 'col-new';
          const container = document.getElementById(colId) || document.getElementById('col-new');
          const searchStr = `${clientName} ${displayName} ${data.package || ''} ${tagsSearchString}`.toLowerCase();

          container.insertAdjacentHTML('beforeend', `
            <div data-order-id="${orderId}" data-search="${searchStr}" class="kanban-card bg-white border border-gray-100 p-4 rounded-xl flex items-center justify-between cursor-pointer border-l-4 border-l-pm-green hover:shadow-lg hover:border-l-pm-oak transition-all mb-3 shadow-sm group">
              <div onclick="window.location.href='detail.html?id=${orderId}'" class="flex items-center gap-3 md:gap-4 flex-1 overflow-hidden">
                <div class="flex items-center shrink-0 pl-1">${avatarsHTML}</div>
                <div class="overflow-hidden flex flex-col justify-center w-full pr-2">
                  <h4 class="font-bold text-sm md:text-base text-gray-800 truncate mb-0.5">${displayName}</h4>
                  <p class="text-[10px] md:text-xs text-gray-500 truncate">${clientName}</p>
                  <div class="flex items-center gap-1.5 mt-2 flex-wrap">
                    <span class="text-[10px] text-gray-600 whitespace-nowrap font-medium bg-gray-50 px-2 py-0.5 rounded flex items-center gap-1"><span class="material-symbols-outlined text-[12px]">calendar_today</span> ${data.shootDate || '未定日期'}</span>
                    ${paymentBadge}
                    ${tagsHTML}
                  </div>
                </div>
              </div>
              <div class="flex flex-col gap-1 shrink-0 ml-1 z-20 relative opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                ${waBtn}
                <button onclick="event.stopPropagation(); window.location.href='add.html?editId=${orderId}';" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-pm-green/10 text-gray-400 hover:text-pm-green transition-colors cursor-pointer" title="編輯訂單">
                  <span class="material-symbols-outlined text-[18px]">edit</span>
                </button>
                <button onclick="event.stopPropagation(); window.deleteOrder('${orderId}');" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-gray-400 hover:text-red-500 transition-colors cursor-pointer" title="刪除訂單">
                  <span class="material-symbols-outlined text-[18px]">delete</span>
                </button>
              </div>
            </div>
          `);
        }

        document.getElementById('stat-count').innerText = monthCount;
        document.getElementById('stat-revenue').innerText = "HK$ " + totalRev; 
        
        const searchInput = document.getElementById('global-search');
        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.kanban-card').forEach(card => {
              const text = card.getAttribute('data-search');
              card.style.display = (text && text.includes(term)) ? 'flex' : 'none';
            });
          });
        }
      } catch (err) { console.error("載入失敗:", err); }
    }

    window.renderCustomCalendar = function() {
      const grid = document.getElementById('custom-calendar-grid');
      const title = document.getElementById('custom-month-title');
      const revenueLabel = document.getElementById('custom-month-revenue');
      
      const monthNames = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
      title.innerText = `${currentCalYear}年 ${monthNames[currentCalMonth]}`;
      grid.innerHTML = '';

      let currentMonthRevenue = 0;

      const firstDay = new Date(currentCalYear, currentCalMonth, 1).getDay();
      const days = new Date(currentCalYear, currentCalMonth + 1, 0).getDate();
      for (let i = 0; i < firstDay; i++) grid.innerHTML += '<div></div>';

      for (let d = 1; d <= days; d++) {
        const dStr = getFormattedDateStr(new Date(currentCalYear, currentCalMonth, d));
        const hasEvent = eventsByDate[dStr];
        
        if (hasEvent) {
          hasEvent.forEach(ev => { currentMonthRevenue += ev.price; });
        }

        const isSelected = dStr === selectedDateStr;
        grid.innerHTML += `
          <div onclick="window.handleDaySelection('${dStr}')" class="flex flex-col items-center py-2 cursor-pointer rounded-xl transition-colors ${isSelected ? 'bg-pm-green/5' : 'hover:bg-gray-50'}">
            <div class="w-8 h-8 flex items-center justify-center rounded-full ${isSelected ? 'bg-pm-green text-white font-bold shadow-md' : 'text-gray-600'}">${d}</div>
            <div class="flex gap-1 h-1 mt-1">${hasEvent ? '<div class="w-1.5 h-1.5 bg-pm-oak rounded-full"></div>' : ''}</div>
          </div>`;
      }
      
      revenueLabel.innerText = `當月營業額: HK$ ${currentMonthRevenue}`;
    };

    window.handleDaySelection = function(dateStr) {
      selectedDateStr = dateStr;
      window.renderCustomCalendar();
      const list = document.getElementById('agenda-list');
      const header = document.getElementById('list-date-header');
      const events = eventsByDate[dateStr] || [];
      header.innerText = dateStr; header.classList.remove('hidden');
      
      if (events.length === 0) {
        list.innerHTML = '<p class="text-center text-gray-400 text-sm py-8 bg-gray-50 rounded-xl border border-gray-100">是日無預約行程</p>';
      } else {
        list.innerHTML = events.map(ev => `
          <div onclick="window.location.href='${ev.url}'" class="bg-gray-50 hover:bg-pm-green/5 transition-colors p-4 rounded-xl flex justify-between items-center cursor-pointer border-l-[6px] border border-gray-100" style="border-left-color:${ev.color}">
            <div class="pr-2">
                <p class="font-bold text-gray-800 leading-snug">${ev.title}</p>
                <div class="flex items-center gap-2 mt-1.5">
                  <span class="text-xs text-pm-green font-medium bg-pm-green/10 px-2 py-0.5 rounded border border-pm-green/20">${ev.package}</span>
                  ${ev.location ? `<span class="text-xs text-gray-500 flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">location_on</span>${ev.location}</span>` : ''}
                </div>
            </div>
            <p class="text-sm font-bold text-pm-oak shrink-0">${ev.time}</p>
          </div>
        `).join('');
      }
    };

    async function startApp() {
      await loadOrders();
      if (!selectedDateStr) selectedDateStr = getFormattedDateStr(new Date());
      window.renderCustomCalendar();
      window.handleDaySelection(selectedDateStr);
      
      ['col-new', 'col-basic-edit', 'col-pick-photos', 'col-final-retouch', 'col-completed'].forEach(colId => {
        const el = document.getElementById(colId);
        if (el && typeof Sortable !== 'undefined') {
          new Sortable(el, {
            group: 'kanban',
            animation: 150,
            delay: window.innerWidth < 768 ? 200 : 0,
            delayOnTouchOnly: true,
            onEnd: async function(evt) {
              const itemEl = evt.item;
              const targetColId = evt.to.id;
              const orderId = itemEl.getAttribute('data-order-id');
              if (orderId && evt.from.id !== evt.to.id) {
                try { await updateDoc(doc(db, "Orders", orderId), { status: targetColId }); } 
                catch(e) { evt.from.appendChild(itemEl); }
              }
            }
          });
        }
      });
    }
    
    startApp();

    document.getElementById('prev-month-btn').onclick = () => { currentCalMonth--; if(currentCalMonth<0){currentCalMonth=11;currentCalYear--;} window.renderCustomCalendar(); };
    document.getElementById('next-month-btn').onclick = () => { currentCalMonth++; if(currentCalMonth>11){currentCalMonth=0;currentCalYear++;} window.renderCustomCalendar(); };

    document.getElementById('btn-view-kanban').onclick = function() {
      this.className = "px-5 py-2.5 rounded-lg text-sm font-bold bg-pm-green text-white shadow-md flex items-center gap-2 transition-all";
      document.getElementById('btn-view-calendar').className = "px-5 py-2.5 rounded-lg text-sm font-bold text-gray-500 hover:text-pm-green hover:bg-white transition-all flex items-center gap-2";
      document.getElementById('view-kanban').classList.remove('hidden'); document.getElementById('view-calendar').classList.add('hidden');
    };
    
    document.getElementById('btn-view-calendar').onclick = function() {
      this.className = "px-5 py-2.5 rounded-lg text-sm font-bold bg-pm-green text-white shadow-md flex items-center gap-2 transition-all";
      document.getElementById('btn-view-kanban').className = "px-5 py-2.5 rounded-lg text-sm font-bold text-gray-500 hover:text-pm-green hover:bg-white transition-all flex items-center gap-2";
      document.getElementById('view-kanban').classList.add('hidden'); document.getElementById('view-calendar').classList.remove('hidden');
    };
  </script>
</body>
</html>
