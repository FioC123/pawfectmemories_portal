<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawfect Memories | Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+HK:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'pm-green': '#2D4F1E',
                        'pm-oak': '#D4A373',
                        'pm-cream': '#FDFBF7',
                        'pm-accent': '#E8B4B8',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans HK"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-pm-cream text-gray-800 font-sans flex h-screen overflow-hidden">

    <aside class="w-64 bg-white shadow-lg flex flex-col">
        <div class="p-6 border-b border-gray-100 text-center">
            <h1 class="font-serif text-2xl text-pm-green font-bold">Pawfect<br>Memories</h1>
            <p class="text-xs text-pm-oak mt-1 tracking-widest uppercase">Portal</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-pm-green text-white rounded-xl shadow-md transition">
                <i class="fa-solid fa-house"></i> 首頁總覽
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-green-50 hover:text-pm-green rounded-xl transition">
                <i class="fa-solid fa-calendar-days"></i> 預約日曆
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-green-50 hover:text-pm-green rounded-xl transition">
                <i class="fa-solid fa-file-invoice-dollar"></i> 款項驗證
            </a>
        </nav>
        <div class="p-4 border-t border-gray-100">
            <button id="logoutBtn" class="w-full flex items-center justify-center gap-2 px-4 py-2 text-red-500 hover:bg-red-50 rounded-xl transition">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> 登出
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        
        <header class="mb-8 flex justify-between items-end">
            <div>
                <h2 class="font-serif text-4xl text-pm-green mb-2">早晨，攝影師</h2>
                <p class="text-gray-500">今日係準備好捕捉美好回憶嘅一日。</p>
            </div>
            <div class="text-pm-oak font-medium">
                <i class="fa-regular fa-clock mr-1"></i> <span id="currentDate">2024年...</span>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-[0_10px_30px_rgba(45,79,30,0.05)] border border-gray-50 border-b-4 border-b-pm-green">
                <div class="flex justify-between items-start mb-4">
                    <div class="p-3 bg-green-50 text-pm-green rounded-lg"><i class="fa-solid fa-camera fa-lg"></i></div>
                </div>
                <h3 class="text-3xl font-bold text-gray-800 mb-1" id="stat-today-bookings">--</h3>
                <p class="text-gray-500 text-sm">今日預約拍攝</p>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-[0_10px_30px_rgba(45,79,30,0.05)] border border-gray-50 border-b-4 border-b-pm-oak">
                <div class="flex justify-between items-start mb-4">
                    <div class="p-3 bg-orange-50 text-pm-oak rounded-lg"><i class="fa-solid fa-money-check-dollar fa-lg"></i></div>
                </div>
                <h3 class="text-3xl font-bold text-gray-800 mb-1" id="stat-pending-payments">--</h3>
                <p class="text-gray-500 text-sm">待驗證線下款項</p>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-[0_10px_30px_rgba(45,79,30,0.05)] border border-gray-50 border-b-4 border-b-pm-accent">
                <div class="flex justify-between items-start mb-4">
                    <div class="p-3 bg-pink-50 text-pm-accent rounded-lg"><i class="fa-solid fa-wand-magic-sparkles fa-lg"></i></div>
                </div>
                <h3 class="text-3xl font-bold text-gray-800 mb-1" id="stat-pending-edits">--</h3>
                <p class="text-gray-500 text-sm">待處理修圖訂單</p>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-[0_10px_30px_rgba(45,79,30,0.05)] overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h3 class="font-serif text-2xl text-pm-green">近期預約狀態</h3>
                <button class="text-pm-oak hover:text-pm-green transition text-sm font-medium">查看全部 <i class="fa-solid fa-chevron-right text-xs"></i></button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-500 text-sm">
                            <th class="p-4 font-medium">客戶資料</th>
                            <th class="p-4 font-medium">拍攝日期</th>
                            <th class="p-4 font-medium">方案</th>
                            <th class="p-4 font-medium">款項狀態</th>
                            <th class="p-4 font-medium">操作</th>
                        </tr>
                    </thead>
                    <tbody id="booking-table-body" class="divide-y divide-gray-100">
                        <tr class="hover:bg-gray-50 transition">
                            <td class="p-4">
                                <div class="font-medium text-gray-800">李生 (金毛尋回犬)</div>
                                <div class="text-xs text-gray-500">9876 5432</div>
                            </td>
                            <td class="p-4 text-gray-600">2024-07-05 14:00</td>
                            <td class="p-4"><span class="px-3 py-1 bg-green-50 text-pm-green text-xs rounded-full">戶外寫生</span></td>
                            <td class="p-4">
                                <span class="px-3 py-1 bg-red-50 text-red-600 text-xs font-bold rounded-full border border-red-100">待驗證 (HSBC)</span>
                            </td>
                            <td class="p-4">
                                <button class="text-pm-oak hover:text-pm-green transition"><i class="fa-solid fa-pen-to-square"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        // 簡單嘅日期顯示腳本
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('zh-HK', options);
        
        /* * 你嘅 Firebase 邏輯可以放喺度：

         * const tbody = document.getElementById('booking-table-body');
         * tbody.innerHTML = '';
         * snapshot.forEach(doc => {
         * const data = doc.data();
         * // 生成 <tr> 加入 tbody...
         * });
         * });
         */
    </script>
</body>
</html>
