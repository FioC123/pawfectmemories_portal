<!DOCTYPE html>
<html lang="zh-Hant" class="light">
<head>
  <meta charset="utf-8">
  <script>if(!sessionStorage.getItem('pm_admin_logged')){window.location.href='login.html';}</script>
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script id="tailwind-config">
    tailwind.config = { 
      darkMode: 'class',
      theme: { 
        extend: { 
          colors: { 
            "pm-green": "#244018",       
            "pm-oak": "#C4905E",         
            "pm-cream": "#FAFAFA",       
            "pm-accent": "#E8B4B8",
            "whatsapp": "#25D366",
            "pm-dark-bg": "#0B0E0C",       
            "pm-dark-surface": "#121714",  
            "pm-dark-border": "#1E2621"    
          }, 
          fontFamily: { 
            serif: ['"Playfair Display"', 'serif'], 
            sans: ['"Inter"', 'sans-serif'] 
          },
          boxShadow: {
            'taste': '0 4px 24px -8px rgba(0, 0, 0, 0.05)', 
            'taste-dark': '0 4px 24px -8px rgba(0, 0, 0, 0.4)'
          }
        } 
      } 
    }
  </script>
  <style>
    body { min-height: 100dvh; overflow: hidden; transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.4s ease; font-feature-settings: "cv02", "cv03", "cv04", "cv11"; }
    
    /* 隱藏預設捲軸 (保留畀其他唔需要捲軸嘅組件用) */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    
    /* 🔥 全新高級感自訂捲軸 (Custom Scrollbar) 🔥 */
    .custom-scrollbar::-webkit-scrollbar {
      height: 8px; /* 向橫捲軸嘅高度 */
      width: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
      border-radius: 10px;
    }
    /* Light Mode 捲軸顏色 */
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4); /* 柔和半透明灰色 */
      border-radius: 10px;
      transition: background 0.3s;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(107, 114, 128, 0.7); /* Mouse Hover 加深 */
    }
    /* Dark Mode 捲軸顏色 */
    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(75, 85, 99, 0.4);
    }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.7);
    }

    .sortable-ghost { opacity: 0.3; background-color: transparent; border: 1px dashed #C4905E; border-radius: 0.75rem; }
    .dark .sortable-ghost { border-color: #C4905E; }
    .sortable-drag { transform: scale(1.02); opacity: 0.95 !important; cursor: grabbing !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 1px solid rgba(196,144,94,0.3); }
    
    @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    .animate-pulse-soft { animation: pulse-soft 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    i[data-lucide] { display: inline-block; vertical-align: text-bottom; }
  </style>
</head>

  <div id="custom-confirm-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-gray-900/20 dark:bg-black/60 backdrop-blur-sm transition-opacity opacity-0">

      </div>
      <h3 class="text-xl font-serif font-bold text-gray-900 dark:text-white mb-2">Delete Booking?</h3>
      <p class="text-gray-500 dark:text-gray-400 text-sm mb-8 leading-relaxed">This action cannot be undone. All data associated with this booking will be permanently removed.</p>

        <button id="modal-confirm-btn" class="px-5 py-2.5 rounded-lg text-sm font-medium bg-red-500 hover:bg-red-600 text-white shadow-sm transition-colors active:scale-95">Delete</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-8 right-8 z-[100] flex flex-col gap-3 pointer-events-none"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, updateDoc, collection, getDocs, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBhFUkCP0WslzdB2WY93hp6L-Z5g8vo40E", authDomain: "pawfect-memories-2c8a0.firebaseapp.com", projectId: "pawfect-memories-2c8a0", storageBucket: "pawfect-memories-2c8a0.firebasestorage.app", messagingSenderId: "860879002502", appId: "1:860879002502:web:eeaa936317b1fefc33aa07" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    lucide.createIcons();
    
    function updateIcons() {
      lucide.createIcons();
    }

    window.toggleDarkMode = function() {
      const htmlEl = document.documentElement;
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        htmlEl.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    };

    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        document.getElementById('global-search').focus();
      }
    });

    window.showToast = function(msg, type='success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'error' ? 'bg-red-500 text-white' : 'bg-gray-900 dark:bg-white text-white dark:text-gray-900';
      const icon = type === 'error' ? 'alert-triangle' : 'check-circle';
      
      toast.className = `px-4 py-3 rounded-lg shadow-2xl text-sm font-medium transform transition-all translate-y-10 opacity-0 flex items-center gap-3 ${bgColor}`;
      toast.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4"></i> ${msg}`;
      
      container.appendChild(toast);
      updateIcons();
      
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-10', 'opacity-0');
      });
      
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    let deleteTargetId = null;
    const modal = document.getElementById('custom-confirm-modal');
    const modalConfirmBtn = document.getElementById('modal-confirm-btn');
    const modalCancelBtn = document.getElementById('modal-cancel-btn');

    function closeModal() {
      modal.classList.add('opacity-0');
      modal.firstElementChild.classList.remove('scale-100');
      modal.firstElementChild.classList.add('scale-95');
      setTimeout(() => modal.classList.add('hidden'), 300);
      deleteTargetId = null;
    }

    window.deleteOrder = function(orderId) {
      deleteTargetId = orderId;
      modal.classList.remove('hidden');
      void modal.offsetWidth; 
      modal.classList.remove('opacity-0');
      modal.firstElementChild.classList.remove('scale-95');
      modal.firstElementChild.classList.add('scale-100');
    };

    modalCancelBtn.onclick = closeModal;
    modalConfirmBtn.onclick = async function() {
      if (!deleteTargetId) return;
      const id = deleteTargetId;
      closeModal();
      
      const card = document.querySelector(`[data-order-id="${id}"]`);
      if(card) {
        card.style.opacity = '0.4';
        card.style.pointerEvents = 'none';
      }

      try { 
        await deleteDoc(doc(db, "Orders", id)); 
        if(card) card.remove();
        showToast("Booking deleted");
        checkEmptyStates();
      } 
      catch (e) { 
        if(card) { card.style.opacity = '1'; card.style.pointerEvents = 'auto'; }
        showToast("Failed to delete", "error"); 
      }
    };

    let eventsByDate = {};
    let currentCalYear = new Date().getFullYear();
    let currentCalMonth = new Date().getMonth();
    let selectedDateStr = "";

    function getFormattedDateStr(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getSkeletonHTML() {
      return `
        <div class="bg-white dark:bg-pm-dark-surface border border-gray-100 dark:border-pm-dark-border p-4 rounded-xl flex items-center gap-3 animate-pulse-soft mb-3 shadow-sm">
          <div class="w-10 h-10 rounded-full bg-gray-100 dark:bg-[#1E2621] shrink-0"></div>
          <div class="flex-1">
            <div class="h-3 bg-gray-100 dark:bg-[#1E2621] rounded w-2/3 mb-2"></div>
            <div class="h-2 bg-gray-50 dark:bg-[#1E2621]/50 rounded w-1/3"></div>
          </div>
        </div>
      `;
    }

    function getEmptyStateHTML(type) {
      const msg = type === 'calendar' ? 'No scheduled shoots' : 'No tasks';
      return `
        <div class="flex flex-col items-center justify-center h-24 text-gray-400 dark:text-gray-600 opacity-80 pointer-events-none empty-state-marker">
          <p class="text-xs font-medium tracking-wide">${msg}</p>
        </div>
      `;
    }

    function checkEmptyStates() {
      ['col-new', 'col-basic-edit', 'col-pick-photos', 'col-final-retouch', 'col-completed'].forEach(colId => {
        const col = document.getElementById(colId);
        if (col.querySelectorAll('.kanban-card').length === 0) {
          if (!col.querySelector('.empty-state-marker')) col.innerHTML = getEmptyStateHTML('kanban');
        } else {
          const emptyMarker = col.querySelector('.empty-state-marker');
          if (emptyMarker) emptyMarker.remove();
        }
      });
    }

    async function loadOrders() {
      const colIds = ['col-new', 'col-basic-edit', 'col-pick-photos', 'col-final-retouch', 'col-completed'];
      colIds.forEach(id => { document.getElementById(id).innerHTML = getSkeletonHTML() + getSkeletonHTML(); });

      try {
        const ordersSnap = await getDocs(collection(db, "Orders"));
        let monthCount = 0; 
        let totalRev = 0; 
        const now = new Date();
        const currentMonthPrefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        
        colIds.forEach(id => document.getElementById(id).innerHTML = '');
        eventsByDate = {};

        for (let docSnap of ordersSnap.docs) {
          const data = docSnap.data();
          const orderId = docSnap.id;

          totalRev += Number(data.price || 0);

          let clientName = "Unknown";
          let clientPhone = "";
          if (data.clientId) {
            const cSnap = await getDoc(doc(db, "Clients", data.clientId));
            if (cSnap.exists()) {
              clientName = cSnap.data().name;
              clientPhone = cSnap.data().phone || "";
            }
          }

          let pets = data.pets || [];
          if (pets.length === 0 && data.petName) pets = [{ name: data.petName, photoUrl: data.photoUrl }];
          let displayName = pets.length > 0 ? pets.map(p => p.name).join(' & ') : "Unknown Pet";
          
          let avatarsHTML = '';
          if (pets.length === 0) {
            avatarsHTML = `<img class="w-10 h-10 rounded-full object-cover ring-2 ring-white dark:ring-[#121714] shrink-0 bg-gray-50 dark:bg-pm-dark-bg" src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=150&h=150&fit=crop">`;
          } else {
            pets.slice(0, 3).forEach((p, j) => {
              const zIndex = 30 - (j * 10);
              const marginClass = j > 0 ? '-ml-3' : '';
              const imgSrc = p.photoUrl || "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=150&h=150&fit=crop";
              if (j === 2 && pets.length > 3) {
                avatarsHTML += `<div class="w-10 h-10 rounded-full ring-2 ring-white dark:ring-[#121714] relative flex items-center justify-center bg-gray-100 dark:bg-pm-dark-border text-gray-500 dark:text-gray-300 text-[10px] font-medium shrink-0 ${marginClass}" style="z-index:${zIndex};">+${pets.length - 2}</div>`;
              } else {
                avatarsHTML += `<img class="w-10 h-10 rounded-full object-cover ring-2 ring-white dark:ring-[#121714] relative shrink-0 bg-gray-50 dark:bg-pm-dark-bg ${marginClass}" style="z-index:${zIndex};" src="${imgSrc}">`;
              }
            });
          }

          if (data.shootDate) {
            if (data.shootDate.startsWith(currentMonthPrefix)) monthCount++;
            const eventColor = data.status === 'col-completed' ? '#8DBA76' : '#C4905E';
            const eventObj = { 
                id: orderId, title: `${clientName} - ${displayName}`, time: data.shootTime || "All Day", 
                color: eventColor, package: data.package || "Booking", url: `detail.html?id=${orderId}`, 
                location: data.shootLocation || "", price: Number(data.price || 0) 
            };
            if (!eventsByDate[data.shootDate]) eventsByDate[data.shootDate] = [];
            eventsByDate[data.shootDate].push(eventObj);
          }

          let rawStatus = data.paymentStatus ? String(data.paymentStatus).toLowerCase() : '';
          let paymentBadge = '';
          if (rawStatus === 'full' || rawStatus === 'paid') {
            paymentBadge = `<span class="bg-gray-100/50 dark:bg-[#1E2621] text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded text-[10px] font-medium whitespace-nowrap">Paid</span>`;
          } else if (rawStatus === 'deposit' || data.depositPaid === true) {
            paymentBadge = `<span class="bg-pm-oak/10 text-pm-oak px-2 py-0.5 rounded text-[10px] font-medium whitespace-nowrap">Deposit</span>`;
          } else {
            paymentBadge = `<span class="bg-red-50 dark:bg-red-500/10 text-red-500 px-2 py-0.5 rounded text-[10px] font-medium whitespace-nowrap">Unpaid</span>`;
          }

          let waBtn = '';
          if (clientPhone) {
            const cleanPhone = clientPhone.replace(/\D/g, '');
            const msg = encodeURIComponent(`Hi ${clientName}, this is Pawfect Memories...`);
            waBtn = `
              <a href="https://wa.me/852${cleanPhone}?text=${msg}" target="_blank" onclick="event.stopPropagation();" class="w-7 h-7 flex items-center justify-center rounded-md hover:bg-gray-100 dark:hover:bg-pm-dark-border text-gray-400 hover:text-whatsapp transition-colors cursor-pointer" title="WhatsApp">
                <i data-lucide="message-circle" class="w-3.5 h-3.5"></i>
              </a>
            `;
          }

          const colId = data.status || 'col-new';
          const container = document.getElementById(colId) || document.getElementById('col-new');
          const searchStr = `${clientName} ${displayName} ${data.package || ''}`.toLowerCase();

          container.insertAdjacentHTML('beforeend', `
            <div data-order-id="${orderId}" data-search="${searchStr}" class="kanban-card bg-white dark:bg-pm-dark-surface border border-gray-200/60 dark:border-white/5 p-4 rounded-xl flex items-center justify-between cursor-pointer hover:shadow-taste dark:hover:border-pm-oak/30 transition-all mb-3 group">
              <div onclick="window.location.href='detail.html?id=${orderId}'" class="flex items-center gap-3 flex-1 overflow-hidden">
                <div class="flex items-center shrink-0 pl-1">${avatarsHTML}</div>
                <div class="overflow-hidden flex flex-col justify-center w-full pr-2">
                  <h4 class="font-medium text-sm text-gray-900 dark:text-[#F0F0F0] truncate mb-0.5">${displayName}</h4>
                  <p class="text-[11px] text-gray-500 dark:text-gray-400 truncate mb-2">${clientName}</p>
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="text-[10px] text-gray-500 dark:text-gray-400 font-medium flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> ${data.shootDate || 'TBD'}</span>
                    <span class="text-gray-300 dark:text-gray-600 px-1">•</span>
                    ${paymentBadge}
                  </div>
                </div>
              </div>
              <div class="flex flex-col gap-1 shrink-0 ml-1 z-20 relative opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                ${waBtn}
                <button onclick="event.stopPropagation(); window.location.href='add.html?editId=${orderId}';" class="w-7 h-7 flex items-center justify-center rounded-md hover:bg-gray-100 dark:hover:bg-pm-dark-border text-gray-400 hover:text-pm-oak transition-colors cursor-pointer" title="Edit">
                  <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                </button>
                <button onclick="event.stopPropagation(); window.deleteOrder('${orderId}');" class="w-7 h-7 flex items-center justify-center rounded-md hover:bg-red-50 dark:hover:bg-red-500/10 text-gray-400 hover:text-red-500 transition-colors cursor-pointer" title="Delete">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>
          `);
        }

        document.getElementById('stat-count').innerText = monthCount;
        document.getElementById('stat-revenue').innerText = "HK$ " + totalRev.toLocaleString(); 
        
        checkEmptyStates();
        updateIcons(); 

        const searchInput = document.getElementById('global-search');
        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.kanban-card').forEach(card => {
              const text = card.getAttribute('data-search');
              card.style.display = (text && text.includes(term)) ? 'flex' : 'none';
            });
          });
        }
      } catch (err) { 
        colIds.forEach(id => document.getElementById(id).innerHTML = getEmptyStateHTML('kanban'));
        showToast("Connection failed", "error");
      }
    }

    window.renderCustomCalendar = function() {
      const grid = document.getElementById('custom-calendar-grid');
      const title = document.getElementById('custom-month-title');
      const revenueLabel = document.getElementById('custom-month-revenue');
      
      const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      title.innerText = `${monthNames[currentCalMonth]} ${currentCalYear}`;
      grid.innerHTML = '';

      let currentMonthRevenue = 0;

      const firstDay = new Date(currentCalYear, currentCalMonth, 1).getDay();
      const days = new Date(currentCalYear, currentCalMonth + 1, 0).getDate();
      for (let i = 0; i < firstDay; i++) grid.innerHTML += '<div></div>';

      for (let d = 1; d <= days; d++) {
        const dStr = getFormattedDateStr(new Date(currentCalYear, currentCalMonth, d));
        const hasEvent = eventsByDate[dStr];
        
        if (hasEvent) {
          hasEvent.forEach(ev => { currentMonthRevenue += ev.price; });
        }

        const isSelected = dStr === selectedDateStr;
        grid.innerHTML += `
          <div onclick="window.handleDaySelection('${dStr}')" class="flex flex-col items-center py-2 cursor-pointer rounded-xl transition-all ${isSelected ? 'bg-gray-100 dark:bg-pm-dark-border' : 'hover:bg-gray-50 dark:hover:bg-pm-dark-border/50'}">
            <div class="w-8 h-8 flex items-center justify-center rounded-full ${isSelected ? 'bg-gray-900 dark:bg-white text-white dark:text-gray-900 font-medium shadow-sm' : 'text-gray-600 dark:text-gray-400'}">${d}</div>
            <div class="flex gap-1 h-1 mt-1">${hasEvent ? '<div class="w-1 h-1 bg-pm-oak rounded-full"></div>' : ''}</div>
          </div>`;
      }
      
      revenueLabel.innerText = `REVENUE: HK$ ${currentMonthRevenue.toLocaleString()}`;
    };

    window.handleDaySelection = function(dateStr) {
      selectedDateStr = dateStr;
      window.renderCustomCalendar();
      const list = document.getElementById('agenda-list');
      const header = document.getElementById('list-date-header');
      const events = eventsByDate[dateStr] || [];
      
      const dateObj = new Date(dateStr);
      header.innerText = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }); 
      header.classList.remove('hidden');
      
      if (events.length === 0) {
        list.innerHTML = getEmptyStateHTML('calendar');
      } else {
        list.innerHTML = events.map(ev => `
          <div onclick="window.location.href='${ev.url}'" class="bg-white dark:bg-pm-dark-surface border border-gray-200/60 dark:border-white/5 hover:shadow-taste dark:hover:border-pm-oak/30 transition-all p-5 rounded-xl flex justify-between items-center cursor-pointer border-l-4" style="border-left-color:${ev.color}">
            <div class="pr-2">
                <p class="font-medium text-gray-900 dark:text-[#F0F0F0] leading-snug">${ev.title}</p>
                <div class="flex items-center gap-3 mt-2">
                  <span class="text-[11px] text-gray-500 dark:text-gray-400">${ev.package}</span>
                  ${ev.location ? `<span class="text-[11px] text-gray-400 dark:text-gray-500 flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i> ${ev.location}</span>` : ''}
                </div>
            </div>
            <p class="text-sm font-medium text-gray-500 dark:text-gray-400 shrink-0">${ev.time}</p>
          </div>
        `).join('');
        updateIcons();
      }
    };

    async function startApp() {
      await loadOrders();
      if (!selectedDateStr) selectedDateStr = getFormattedDateStr(new Date());
      window.renderCustomCalendar();
      window.handleDaySelection(selectedDateStr);
      
      ['col-new', 'col-basic-edit', 'col-pick-photos', 'col-final-retouch', 'col-completed'].forEach(colId => {
        const el = document.getElementById(colId);
        if (el && typeof Sortable !== 'undefined') {
          new Sortable(el, {
            group: 'kanban',
            animation: 250, 
            dragClass: 'sortable-drag', 
            delay: window.innerWidth < 768 ? 200 : 0,
            delayOnTouchOnly: true,
            onEnd: async function(evt) {
              const itemEl = evt.item;
              const targetColId = evt.to.id;
              const orderId = itemEl.getAttribute('data-order-id');
              
              checkEmptyStates();

              if (orderId && evt.from.id !== evt.to.id) {
                try { 
                  await updateDoc(doc(db, "Orders", orderId), { status: targetColId }); 
                  showToast("Status updated");
                } 
                catch(e) { 
                  evt.from.appendChild(itemEl); 
                  checkEmptyStates(); 
                  showToast("Update failed", "error");
                }
              }
            }
          });
        }
      });
    }
    
    startApp();

    document.getElementById('prev-month-btn').onclick = () => { currentCalMonth--; if(currentCalMonth<0){currentCalMonth=11;currentCalYear--;} window.renderCustomCalendar(); };
    document.getElementById('next-month-btn').onclick = () => { currentCalMonth++; if(currentCalMonth>11){currentCalMonth=0;currentCalYear++;} window.renderCustomCalendar(); };

    document.getElementById('btn-view-kanban').onclick = function() {
      this.className = `px-5 py-2 rounded-md text-sm font-medium shadow-sm flex items-center gap-2 transition-all bg-white dark:bg-[#1E2621] text-gray-900 dark:text-white`;
      document.getElementById('btn-view-calendar').className = "px-5 py-2 rounded-md text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all flex items-center gap-2";
      document.getElementById('view-kanban').classList.remove('hidden'); document.getElementById('view-calendar').classList.add('hidden');
    };
    
    document.getElementById('btn-view-calendar').onclick = function() {
      this.className = `px-5 py-2 rounded-md text-sm font-medium shadow-sm flex items-center gap-2 transition-all bg-white dark:bg-[#1E2621] text-gray-900 dark:text-white`;
      document.getElementById('btn-view-kanban').className = "px-5 py-2 rounded-md text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all flex items-center gap-2";
      document.getElementById('view-kanban').classList.add('hidden'); document.getElementById('view-calendar').classList.remove('hidden');
    };
  </script>
</body>
</html>
