      <nav class="w-full mt-6 flex flex-col gap-2 px-3">

    <div class="px-3 pb-6 flex flex-col gap-2 w-full overflow-hidden border-t border-gray-100 dark:border-white/5 pt-4">
      <button onclick="toggleDarkMode()" class="flex items-center px-3 py-3 rounded-xl text-gray-500 hover:bg-gray-100 dark:hover:bg-[#1A211D] hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-colors w-full overflow-hidden">
        <i data-lucide="moon" class="w-5 h-5 shrink-0 dark:hidden"></i><i data-lucide="sun" class="w-5 h-5 shrink-0 hidden dark:block"></i>

      </button>
      <a href="tracker.html" target="_blank" class="flex items-center px-3 py-3 rounded-xl text-pm-green bg-pm-green/5 dark:text-[#8DBA76] dark:bg-[#8DBA76]/10 hover:bg-pm-green/10 transition-colors w-full overflow-hidden mt-2">
        <i data-lucide="external-link" class="w-5 h-5 shrink-0"></i>
        <span class="ml-4 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity duration-300 font-semibold text-sm">客戶大堂 (Portal)</span>
      </a>
    </div>
  </aside>

  <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
    
    <header class="h-20 flex justify-between items-center px-6 md:px-8 shrink-0 border-b border-gray-200/60 dark:border-pm-dark-border bg-white/50 dark:bg-pm-dark-bg/50 backdrop-blur-md z-30">
      <div class="flex flex-col">
        <h2 class="font-serif text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Pipeline</h2>
      </div>
      
      <div class="relative w-full max-w-md mx-4 hidden sm:block">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
        <input type="text" id="global-search" placeholder="Search bookings (Press '/')" class="w-full bg-gray-100/80 dark:bg-pm-dark-surface border border-transparent text-gray-900 dark:text-white text-sm rounded-xl pl-10 pr-4 py-2.5 focus:bg-white focus:border-pm-oak/40 focus:ring-4 focus:ring-pm-oak/10 outline-none transition-all placeholder:text-gray-400">
      </div>

      <div class="flex bg-gray-100 dark:bg-[#1A211D] p-1 rounded-lg border border-gray-200/50 dark:border-pm-dark-border shrink-0">
        <button id="btn-view-kanban" class="px-4 py-1.5 rounded-md text-sm font-semibold bg-white dark:bg-pm-dark-surface text-gray-900 dark:text-white shadow-sm flex items-center gap-2 transition-all"><i data-lucide="kanban" class="w-4 h-4"></i> 看板</button>
        <button id="btn-view-table" class="px-4 py-1.5 rounded-md text-sm font-semibold text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all flex items-center gap-2"><i data-lucide="list" class="w-4 h-4"></i> 列表</button>
      </div>
    </header>

    <main class="flex-1 overflow-hidden relative bg-pm-cream dark:bg-pm-dark-bg">
      
      <div id="view-kanban" class="absolute inset-0 overflow-x-auto overflow-y-hidden custom-scrollbar px-6 md:px-8 py-6">
        <div class="flex gap-6 h-full min-w-max pb-4">
          <section class="w-[320px] flex flex-col h-full shrink-0">
            <h3 class="font-semibold text-sm text-gray-500 dark:text-gray-400 flex items-center gap-2 mb-4 pl-1"><i data-lucide="sparkles" class="w-4 h-4"></i> 新預約 (New) <span id="count-col-new" class="bg-gray-200 dark:bg-pm-dark-border text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded-full text-[10px]">0</span></h3>
            <div id="col-new" class="flex-1 overflow-y-auto custom-scrollbar space-y-3 pb-20 pr-1"></div>
          </section>
          <section class="w-[320px] flex flex-col h-full shrink-0">
            <h3 class="font-semibold text-sm text-pm-oak flex items-center gap-2 mb-4 pl-1"><i data-lucide="sliders" class="w-4 h-4"></i> 基本修輯 (Retouch) <span id="count-col-basic-edit" class="bg-pm-oak/10 text-pm-oak px-2 py-0.5 rounded-full text-[10px]">0</span></h3>

          </section>
          <section class="w-[320px] flex flex-col h-full shrink-0">
            <h3 class="font-semibold text-sm text-blue-500 dark:text-blue-400 flex items-center gap-2 mb-4 pl-1"><i data-lucide="image" class="w-4 h-4"></i> 揀相 (Selection) <span id="count-col-pick-photos" class="bg-blue-500/10 text-blue-500 px-2 py-0.5 rounded-full text-[10px]">0</span></h3>
            <div id="col-pick-photos" class="flex-1 overflow-y-auto custom-scrollbar space-y-3 pb-20 pr-1"></div>
          </section>
          <section class="w-[320px] flex flex-col h-full shrink-0">
            <h3 class="font-semibold text-sm text-purple-500 dark:text-purple-400 flex items-center gap-2 mb-4 pl-1"><i data-lucide="wand-2" class="w-4 h-4"></i> 精修 (Final Polish) <span id="count-col-final-retouch" class="bg-purple-500/10 text-purple-500 px-2 py-0.5 rounded-full text-[10px]">0</span></h3>
            <div id="col-final-retouch" class="flex-1 overflow-y-auto custom-scrollbar space-y-3 pb-20 pr-1"></div>
          </section>
          <section class="w-[320px] flex flex-col h-full shrink-0">
            <h3 class="font-semibold text-sm text-pm-green dark:text-[#8DBA76] flex items-center gap-2 mb-4 pl-1"><i data-lucide="check-circle" class="w-4 h-4"></i> 已完成 (Delivered)</h3>
            <div id="col-completed" class="flex-1 overflow-y-auto custom-scrollbar space-y-3 pb-20 pr-1"></div>
          </section>
        </div>
      </div>

      <div id="view-table" class="absolute inset-0 overflow-y-auto custom-scrollbar hidden bg-white dark:bg-pm-dark-surface m-6 rounded-[20px] border border-gray-200/60 dark:border-white/5 shadow-taste dark:shadow-taste-dark">
        <table class="w-full text-left border-collapse whitespace-nowrap">
          <thead class="sticky top-0 bg-gray-50/90 dark:bg-[#1A211D]/90 backdrop-blur-md z-10 text-[10px] uppercase font-bold text-gray-400 tracking-wider border-b border-gray-200/60 dark:border-pm-dark-border">
            <tr>
              <th class="px-6 py-4">客戶 & 寵物</th>

             </tbody>

  </div>

  <div id="drawer-backdrop" class="fixed inset-0 bg-gray-900/20 dark:bg-black/40 backdrop-blur-sm z-50 hidden opacity-0" onclick="closeDrawer()"></div>
  <div id="quick-drawer" class="fixed top-0 right-0 h-full w-full sm:w-[420px] bg-white dark:bg-pm-dark-surface shadow-2xl border-l border-gray-200/60 dark:border-white/5 z-[60] transform translate-x-full flex flex-col">
    <div class="h-20 flex items-center justify-between px-6 border-b border-gray-100 dark:border-pm-dark-border shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-pm-oak/10 text-pm-oak flex items-center justify-center"><i data-lucide="zap" class="w-4 h-4"></i></div>
        <h3 class="font-serif font-bold text-lg text-gray-900 dark:text-white">快速預覽</h3>
      </div>
      <button onclick="closeDrawer()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-50 dark:bg-[#1A211D] text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
    
    <div class="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-6" id="drawer-content">
      </div>

    <div class="p-6 border-t border-gray-100 dark:border-pm-dark-border bg-gray-50/50 dark:bg-[#1A211D]/30 shrink-0 grid grid-cols-2 gap-3">
      <button id="drawer-btn-edit" class="w-full bg-white dark:bg-[#1A211D] border border-gray-200 dark:border-pm-dark-border text-gray-700 dark:text-gray-300 py-3 rounded-xl font-semibold hover:border-pm-oak hover:text-pm-oak transition-colors text-sm flex items-center justify-center gap-2 shadow-sm">
        <i data-lucide="edit-3" class="w-4 h-4"></i> 完整編輯
      </button>
      <button id="drawer-btn-detail" class="w-full bg-pm-green dark:bg-pm-oak text-white dark:text-[#121714] py-3 rounded-xl font-semibold shadow-md hover:shadow-lg transition-all text-sm flex items-center justify-center gap-2">
        <i data-lucide="file-text" class="w-4 h-4"></i> 查看詳情
      </button>
    </div>
  </div>

  <nav class="md:hidden fixed bottom-0 w-full h-16 bg-white dark:bg-pm-dark-surface border-t border-gray-200/60 dark:border-pm-dark-border z-40 flex items-center justify-around px-2 pb-safe">
    <a href="index.html" class="flex flex-col items-center p-2 text-pm-oak"><i data-lucide="layout-dashboard" class="w-5 h-5 mb-0.5"></i><span class="text-[9px] font-bold">工作區</span></a>
    <a href="add.html" class="flex flex-col items-center p-2 text-gray-400 hover:text-gray-900 dark:hover:text-white"><i data-lucide="plus-square" class="w-5 h-5 mb-0.5"></i><span class="text-[9px] font-bold">新增</span></a>
    <a href="dashboard.html" class="flex flex-col items-center p-2 text-gray-400 hover:text-gray-900 dark:hover:text-white"><i data-lucide="pie-chart" class="w-5 h-5 mb-0.5"></i><span class="text-[9px] font-bold">財務</span></a>
    <a href="settings.html" class="flex flex-col items-center p-2 text-gray-400 hover:text-gray-900 dark:hover:text-white"><i data-lucide="settings" class="w-5 h-5 mb-0.5"></i><span class="text-[9px] font-bold">設定</span></a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBhFUkCP0WslzdB2WY93hp6L-Z5g8vo40E", authDomain: "pawfect-memories-2c8a0.firebaseapp.com", projectId: "pawfect-memories-2c8a0", storageBucket: "pawfect-memories-2c8a0.firebasestorage.app", messagingSenderId: "860879002502", appId: "1:860879002502:web:eeaa936317b1fefc33aa07" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    lucide.createIcons();

    // Dark Mode 切換
    window.toggleDarkMode = function() {
      const htmlEl = document.documentElement;
      if (htmlEl.classList.contains('dark')) { htmlEl.classList.remove('dark'); localStorage.setItem('theme', 'light'); } 
      else { htmlEl.classList.add('dark'); localStorage.setItem('theme', 'dark'); }
    };

    // 快捷鍵 `/` 搜尋
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault(); document.getElementById('global-search').focus();
      }
    });

    // 視圖切換 (Kanban vs Table)
    const btnKanban = document.getElementById('btn-view-kanban');
    const btnTable = document.getElementById('btn-view-table');
    const viewKanban = document.getElementById('view-kanban');
    const viewTable = document.getElementById('view-table');

    btnKanban.onclick = () => {
      btnKanban.className = "px-4 py-1.5 rounded-md text-sm font-semibold bg-white dark:bg-pm-dark-surface text-gray-900 dark:text-white shadow-sm flex items-center gap-2 transition-all";
      btnTable.className = "px-4 py-1.5 rounded-md text-sm font-semibold text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all flex items-center gap-2";
      viewKanban.classList.remove('hidden'); viewTable.classList.add('hidden');
    };
    
    btnTable.onclick = () => {
      btnTable.className = "px-4 py-1.5 rounded-md text-sm font-semibold bg-white dark:bg-pm-dark-surface text-gray-900 dark:text-white shadow-sm flex items-center gap-2 transition-all";
      btnKanban.className = "px-4 py-1.5 rounded-md text-sm font-semibold text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all flex items-center gap-2";
      viewKanban.classList.add('hidden'); viewTable.classList.remove('hidden');
    };

    let allOrdersData = []; // 用於 Drawer 快速讀取

    // === Drawer 邏輯 ===
    const drawer = document.getElementById('quick-drawer');
    const backdrop = document.getElementById('drawer-backdrop');
    
    window.openDrawer = function(orderId) {
      const data = allOrdersData.find(o => o.id === orderId);
      if(!data) return;

      // 更新 Footer 連結
      document.getElementById('drawer-btn-edit').onclick = () => window.location.href = `add.html?editId=${orderId}`;
      document.getElementById('drawer-btn-detail').onclick = () => window.location.href = `detail.html?id=${orderId}`;

      // 構建 Drawer 內容
      const bal = data.price - (data.depositAmount || Math.floor(data.price/2));
      const payBadge = data.paymentStatus === 'full' 
        ? `<span class="bg-pm-green/10 text-pm-green dark:text-[#8DBA76] px-2 py-0.5 rounded text-[10px] font-bold">全數已付</span>`
        : (data.paymentStatus === 'deposit' ? `<span class="bg-pm-oak/10 text-pm-oak px-2 py-0.5 rounded text-[10px] font-bold">欠 HK$${bal}</span>` : `<span class="bg-red-50 text-red-500 px-2 py-0.5 rounded text-[10px] font-bold">未付款</span>`);

      document.getElementById('drawer-content').innerHTML = `
        <div class="flex items-center gap-4 mb-2">
          <div class="w-16 h-16 rounded-full overflow-hidden border border-gray-100 dark:border-pm-dark-border shadow-sm shrink-0">
            <img src="${data.avatar}" class="w-full h-full object-cover">
          </div>
          <div>
            <h4 class="font-serif font-bold text-2xl text-gray-900 dark:text-white">${data.petsStr}</h4>
            <p class="text-sm text-gray-500 dark:text-gray-400 font-medium">${data.clientName} ${data.clientPhone ? '· '+data.clientPhone : ''}</p>
          </div>
        </div>
        
        <div class="grid grid-cols-2 gap-3 mt-6">
          <div class="bg-gray-50 dark:bg-[#1A211D] p-3 rounded-xl border border-gray-100 dark:border-pm-dark-border">
            <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider mb-1">拍攝日期</p>
            <p class="text-sm font-semibold text-gray-900 dark:text-white">${data.shootDate || '未定'}</p>
          </div>
          <div class="bg-gray-50 dark:bg-[#1A211D] p-3 rounded-xl border border-gray-100 dark:border-pm-dark-border">
            <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider mb-1">總收費</p>
            <p class="text-sm font-bold text-pm-oak">HK$ ${data.price} ${payBadge}</p>
          </div>
        </div>

        <div class="mt-6 border-t border-gray-100 dark:border-pm-dark-border pt-6">
          <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider mb-3">備註 / 特殊要求</p>
          <div class="bg-yellow-50/50 dark:bg-yellow-900/10 p-4 rounded-xl text-sm text-gray-700 dark:text-gray-300 whitespace-pre-wrap border border-yellow-100 dark:border-yellow-900/30">
            ${data.notes || '無特別備註'}
          </div>
        </div>
      `;

      // 顯示 Drawer
      backdrop.classList.remove('hidden');
      void backdrop.offsetWidth;
      backdrop.classList.remove('opacity-0');
      drawer.classList.remove('translate-x-full');
    };

    window.closeDrawer = function() {
      drawer.classList.add('translate-x-full');
      backdrop.classList.add('opacity-0');
      setTimeout(() => backdrop.classList.add('hidden'), 300);
    };

    // === 讀取資料與渲染 ===
    async function loadOrders() {
      const colIds = ['col-new', 'col-basic-edit', 'col-pick-photos', 'col-final-retouch', 'col-completed'];
      colIds.forEach(id => document.getElementById(id).innerHTML = `<div class="h-20 bg-white dark:bg-pm-dark-surface rounded-xl border border-gray-100 dark:border-pm-dark-border animate-pulse"></div>`);
      
      const counts = { 'col-new': 0, 'col-basic-edit': 0, 'col-pick-photos': 0, 'col-final-retouch': 0, 'col-completed': 0 };

      try {
        const ordersSnap = await getDocs(collection(db, "Orders"));
        colIds.forEach(id => document.getElementById(id).innerHTML = '');
        allOrdersData = [];
        let tableRows = '';

        for (let docSnap of ordersSnap.docs) {
          const d = docSnap.data();
          const id = docSnap.id;

          let clientName = "Unknown"; let clientPhone = "";
          if (d.clientId) {
            const cSnap = await getDoc(doc(db, "Clients", d.clientId));
            if (cSnap.exists()) { clientName = cSnap.data().name; clientPhone = cSnap.data().phone; }
          }

          let pets = d.pets || [];
          if (pets.length === 0 && d.petName) pets = [{ name: d.petName, photoUrl: d.photoUrl }];
          let petsStr = pets.length > 0 ? pets.map(p => p.name).join(' & ') : "Unknown Pet";
          let avatar = pets.length > 0 && pets[0].photoUrl ? pets[0].photoUrl : "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=150&h=150&fit=crop";

          const colId = d.status || 'col-new';
          if(counts[colId] !== undefined) counts[colId]++;

          // 儲存落 Array 畀 Drawer 用
          allOrdersData.push({ id, ...d, clientName, clientPhone, petsStr, avatar });

          // --- 渲染 Kanban Card ---
          const kanbanContainer = document.getElementById(colId) || document.getElementById('col-new');
          const searchStr = `${clientName} ${petsStr} ${d.package || ''}`.toLowerCase();
          
          let paymentBadge = d.paymentStatus === 'full' ? `<span class="bg-gray-100 dark:bg-[#1A211D] text-gray-500 px-2 py-0.5 rounded text-[9px] font-bold">已付</span>` : 
                             (d.paymentStatus === 'deposit' ? `<span class="bg-pm-oak/10 text-pm-oak px-2 py-0.5 rounded text-[9px] font-bold">訂金</span>` : `<span class="bg-red-50 text-red-500 px-2 py-0.5 rounded text-[9px] font-bold">未付</span>`);

          kanbanContainer.insertAdjacentHTML('beforeend', `
            <div data-order-id="${id}" data-search="${searchStr}" class="kanban-card bg-white dark:bg-pm-dark-surface border border-gray-200/60 dark:border-white/5 p-4 rounded-xl cursor-pointer hover:shadow-taste dark:hover:border-pm-oak/30 transition-all mb-3 group" onclick="openDrawer('${id}')">
              <div class="flex items-start gap-3">
                <img class="w-10 h-10 rounded-full object-cover shrink-0 border border-gray-100 dark:border-pm-dark-border" src="${avatar}">
                <div class="overflow-hidden flex-1">
                  <h4 class="font-medium text-sm text-gray-900 dark:text-white truncate mb-0.5">${petsStr}</h4>
                  <p class="text-[11px] text-gray-500 dark:text-gray-400 truncate mb-2">${clientName}</p>
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="text-[10px] text-gray-500 dark:text-gray-400 font-medium flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> ${d.shootDate || '未定'}</span>
                    ${paymentBadge}
                  </div>
                </div>
              </div>
            </div>
          `);

          // --- 渲染 Table Row ---
          const statusMap = { "col-new": "新預約", "col-basic-edit": "基本修輯", "col-pick-photos": "揀相", "col-final-retouch": "精修", "col-completed": "已完成" };
          const bal = Number(d.price||0) - (Number(d.depositAmount) || Math.floor(Number(d.price||0)/2));
          const balText = d.paymentStatus === 'full' ? '-' : `HK$ ${bal}`;
          const balClass = d.paymentStatus === 'full' ? 'text-gray-400' : 'text-red-500 font-bold';

          tableRows += `
            <tr class="hover:bg-gray-50 dark:hover:bg-[#1A211D]/50 transition-colors cursor-pointer" onclick="openDrawer('${id}')">
              <td class="px-6 py-4 flex items-center gap-3">
                <img src="${avatar}" class="w-8 h-8 rounded-full object-cover">
                <div><p class="font-semibold text-gray-900 dark:text-white">${petsStr}</p><p class="text-[10px] text-gray-500 uppercase tracking-wider">${clientName}</p></div>
              </td>
              <td class="px-6 py-4"><span class="bg-gray-100 dark:bg-pm-dark-border text-gray-600 dark:text-gray-300 text-[10px] px-2.5 py-1 rounded-md font-bold">${statusMap[colId]}</span></td>
              <td class="px-6 py-4 text-gray-600 dark:text-gray-300 font-medium">${d.shootDate || '未定'}</td>
              <td class="px-6 py-4 text-gray-500 dark:text-gray-400 text-xs">${d.package || '-'}</td>
              <td class="px-6 py-4 text-right ${balClass}">${balText}</td>
            </tr>
          `;
        }

        // 更新 Counts
        colIds.forEach(id => {
            const countEl = document.getElementById(`count-${id}`);
            if(countEl) countEl.innerText = counts[id];
        });

        document.getElementById('table-body').innerHTML = tableRows;
        lucide.createIcons();

        // SortableJS (拖拽)
        colIds.forEach(colId => {
          const el = document.getElementById(colId);
          if (el) {
            new Sortable(el, {
              group: 'kanban', animation: 250, dragClass: 'sortable-drag', delay: window.innerWidth < 768 ? 200 : 0, delayOnTouchOnly: true,
              onEnd: async function(evt) {
                const itemEl = evt.item; const targetColId = evt.to.id; const orderId = itemEl.getAttribute('data-order-id');
                if (orderId && evt.from.id !== evt.to.id) {
                  try { 
                      await updateDoc(doc(db, "Orders", orderId), { status: targetColId }); 
                      // 懶人做法：重新整理數據保持一致
                      setTimeout(() => loadOrders(), 500);
                  } catch(e) { evt.from.appendChild(itemEl); }
                }
              }
            });
          }
        });

        // 搜尋邏輯
        document.getElementById('global-search').addEventListener('input', (e) => {
          const term = e.target.value.toLowerCase();
          document.querySelectorAll('.kanban-card').forEach(card => {
            card.style.display = (card.getAttribute('data-search').includes(term)) ? 'flex' : 'none';
          });
        });

      } catch (err) { console.error(err); }
    }

    loadOrders();
  </script>
</body>
</html>
