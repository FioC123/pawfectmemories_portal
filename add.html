  <div id="toast-container" class="fixed bottom-8 right-8 z-[100] flex flex-col gap-3 pointer-events-none"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

    const firebaseConfig = { apiKey: "AIzaSyBhFUkCP0WslzdB2WY93hp6L-Z5g8vo40E", authDomain: "pawfect-memories-2c8a0.firebaseapp.com", projectId: "pawfect-memories-2c8a0", storageBucket: "pawfect-memories-2c8a0.firebasestorage.app", messagingSenderId: "860879002502", appId: "1:860879002502:web:eeaa936317b1fefc33aa07" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    lucide.createIcons();

    window.toggleDarkMode = function() {
      const htmlEl = document.documentElement;
      if (htmlEl.classList.contains('dark')) { htmlEl.classList.remove('dark'); localStorage.setItem('theme', 'light'); } 
      else { htmlEl.classList.add('dark'); localStorage.setItem('theme', 'dark'); }
    };

    window.showToast = function(msg, type='success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'error' ? 'bg-red-500 text-white' : 'bg-gray-900 dark:bg-white text-white dark:text-gray-900';
      const icon = type === 'error' ? 'alert-triangle' : (type === 'loading' ? 'loader' : 'check-circle');
      const spinClass = type === 'loading' ? 'animate-spin' : '';
      
      toast.className = `px-4 py-2.5 rounded-xl shadow-2xl text-xs font-bold transform transition-all translate-y-10 opacity-0 flex items-center gap-2 ${bgColor}`;
      toast.innerHTML = `<i data-lucide="${icon}" class="w-3.5 h-3.5 ${spinClass}"></i> ${msg}`;
      
      container.appendChild(toast);
      lucide.createIcons();
      requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
      
      if(type !== 'loading') {
          setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => toast.remove(), 300); }, 3000);
      }
      return toast; 
    }

    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('editId') || urlParams.get('id');

    let packageConfig = [];
    let availableTags = [];
    let currentPets = [];
    let selectedTags = [];
    let originalClientId = ""; 

    async function initPage() {
      try {
        const [snapPkg, snapTags, snapOrder] = await Promise.all([
          getDoc(doc(db, "Settings", "packages_config")),
          getDoc(doc(db, "Settings", "tags_config")),
          editId ? getDoc(doc(db, "Orders", editId)) : Promise.resolve(null)
        ]);

        packageConfig = snapPkg.exists() ? snapPkg.data().list : [];
        availableTags = snapTags.exists() ? snapTags.data().list : [];
        
        const selectEl = document.getElementById('package-select');
        selectEl.innerHTML = packageConfig.map(p => `<option value="${p.name}">${p.name} (HK$ ${p.price})</option>`).join('');

        selectEl.addEventListener('change', (e) => {
            const chosen = packageConfig.find(p => p.name === e.target.value);
            if(chosen && !editId) { document.getElementById('price').value = chosen.price; }
        });

        if (snapOrder && snapOrder.exists()) {
          document.getElementById('page-title').innerText = "編輯預約檔案資料";
          const o = snapOrder.data();
          
          selectedTags = o.tags || [];
          
          document.getElementById('shootDate').value = o.shootDate || "";
          document.getElementById('shootTime').value = o.shootTime || "";
          document.getElementById('shootLocation').value = o.shootLocation || "";
          document.getElementById('platform').value = o.platform || "Instagram";
          document.getElementById('package-select').value = o.package || "";
          document.getElementById('price').value = o.price || 0;
          document.getElementById('depositAmount').value = o.depositAmount || 0;
          document.getElementById('manualOtherFee').value = o.manualOtherFee || 0;
          document.getElementById('discount').value = o.discount || 0;
          document.getElementById('paymentStatus').value = o.paymentStatus || "unpaid";
          document.getElementById('notes').value = o.notes || "";
          document.getElementById('product').value = o.product || "";
          document.getElementById('submissionDate').value = o.submissionDate || "";
          document.getElementById('extraPaxCount').value = o.extraPaxCount || 0;
          document.getElementById('kidsCount').value = o.kidsCount || 0;
          document.getElementById('studio').value = o.studio || "";

          if(o.depositReceiptUrl) { 
              document.getElementById('depositReceiptUrl').value = o.depositReceiptUrl;
              document.getElementById('depositDate').value = o.depositDate || "";
              document.getElementById('deposit-status').classList.remove('hidden');
          }
          if(o.balanceReceiptUrl) { 
              document.getElementById('balanceReceiptUrl').value = o.balanceReceiptUrl;
              document.getElementById('balanceDate').value = o.balanceDate || "";
              document.getElementById('balance-status').classList.remove('hidden');
          }

          if (o.clientId) {
            originalClientId = o.clientId;
            const cSnap = await getDoc(doc(db, "Clients", o.clientId));
            if (cSnap.exists()) {
              const cData = cSnap.data();
              document.getElementById('clientName').value = cData.name || "";
              document.getElementById('clientPhone').value = cData.phone || "";
              document.getElementById('clientIg').value = cData.instagram || "";
              document.getElementById('clientEmail').value = cData.email || "";
              document.getElementById('clientAddress').value = cData.address || "";
            }
          }

          currentPets = o.pets || [];
          if(currentPets.length === 0 && o.petName) {
              currentPets.push({ name: o.petName, type: o.petType || "", breed: o.petBreed || "", photoUrl: o.photoUrl || "" });
          }
        } else {
          currentPets = [{ name: "", type: "", breed: "", photoUrl: "" }];
        }

        renderTagsSelection();
        renderPetsForm();

      } catch (err) {
        showToast("同步安全中心網絡出錯", "error");
      }
    }

    // 渲染動態標籤選擇區
    function renderTagsSelection() {
        const container = document.getElementById('tags-container');
        if(availableTags.length === 0) {
            container.innerHTML = `<span class="text-xs text-gray-400">請先到「系統設定」建立標籤</span>`;
            return;
        }
        
        container.innerHTML = availableTags.map(tag => {
            const isSelected = selectedTags.some(t => t.name === tag.name);
            const baseClass = isSelected 
                ? 'bg-pm-oak text-white border-pm-oak shadow-sm' 
                : 'bg-gray-50 dark:bg-[#1A211D] text-gray-500 border-gray-200 dark:border-pm-dark-border hover:border-pm-oak dark:hover:border-pm-oak';
            return `<button type="button" onclick="toggleTag('${tag.name}')" class="${baseClass} px-3 py-1.5 rounded-lg text-[10px] font-bold border transition-colors cursor-pointer">${tag.name}</button>`;
        }).join('');
    }

    window.toggleTag = (name) => {
        const idx = selectedTags.findIndex(t => t.name === name);
        if(idx > -1) { selectedTags.splice(idx, 1); }
        else { selectedTags.push({ name: name }); }
        renderTagsSelection();
    };

    // Firebase Storage 上傳
    async function uploadImageToStorage(file, path) {
        const storageRef = ref(storage, path);
        await uploadBytes(storageRef, file);
        return await getDownloadURL(storageRef);
    }

    document.getElementById('depositReceiptFile').addEventListener('change', async (e) => {
        const file = e.target.files[0]; if(!file) return;
        const loadingToast = showToast("正在上傳訂金入數紙...", "loading");
        try {
            const url = await uploadImageToStorage(file, `receipts/dep_${Date.now()}_${file.name}`);
            document.getElementById('depositReceiptUrl').value = url;
            document.getElementById('depositDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('deposit-status').classList.remove('hidden');
            loadingToast.remove();
            showToast("訂金入數紙上傳成功！");
        } catch(err) { loadingToast.remove(); showToast("上傳失敗", "error"); }
    });

    document.getElementById('balanceReceiptFile').addEventListener('change', async (e) => {
        const file = e.target.files[0]; if(!file) return;
        const loadingToast = showToast("正在上傳尾數入數紙...", "loading");
        try {
            const url = await uploadImageToStorage(file, `receipts/bal_${Date.now()}_${file.name}`);
            document.getElementById('balanceReceiptUrl').value = url;
            document.getElementById('balanceDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('balance-status').classList.remove('hidden');
            loadingToast.remove();
            showToast("尾數入數紙上傳成功！");
        } catch(err) { loadingToast.remove(); showToast("上傳失敗", "error"); }
    });

    window.uploadPetImage = async (i, inputEl) => {
        const file = inputEl.files[0]; if(!file) return;
        const loadingToast = showToast("正在上傳大頭照...", "loading");
        try {
            const url = await uploadImageToStorage(file, `avatars/pet_${Date.now()}_${file.name}`);
            updatePetField(i, 'photoUrl', url);
            document.getElementById(`pet-url-${i}`).value = url;
            loadingToast.remove();
            showToast("大頭照上傳成功！");
        } catch(e) { loadingToast.remove(); showToast("大頭照上傳失敗", "error"); }
    }

    function renderPetsForm() {
      const listEl = document.getElementById('pets-form-list');
      listEl.innerHTML = currentPets.map((p, i) => `
        <div class="pet-row-transition grid grid-cols-1 sm:grid-cols-4 gap-3 bg-gray-50/50 dark:bg-[#1A211D]/30 p-4 rounded-xl border border-gray-100 dark:border-pm-dark-border relative group">
          <div>
            <label class="text-[9px] text-gray-400 font-bold uppercase mb-0.5 block">毛孩名字 *</label>
            <input type="text" value="${p.name}" onchange="updatePetField(${i}, 'name', this.value)" required class="taste-input w-full rounded-lg text-xs font-semibold text-gray-900 dark:text-white" placeholder="如：Mochi">
          </div>
          <div>
            <label class="text-[9px] text-gray-400 font-bold uppercase mb-0.5 block">種類</label>
            <input type="text" value="${p.type}" onchange="updatePetField(${i}, 'type', this.value)" class="taste-input w-full rounded-lg text-xs font-medium text-gray-900 dark:text-white" placeholder="貓 / 狗 / 兔">
          </div>
          <div>
            <label class="text-[9px] text-gray-400 font-bold uppercase mb-0.5 block">品種</label>
            <input type="text" value="${p.breed}" onchange="updatePetField(${i}, 'breed', this.value)" class="taste-input w-full rounded-lg text-xs font-medium text-gray-900 dark:text-white" placeholder="柴犬 / 哥基">
          </div>
          
          <div class="relative">
            <label class="text-[9px] text-gray-400 font-bold uppercase mb-0.5 block">大頭照 (網址或上傳)</label>
            <div class="flex gap-2">
              <input type="url" id="pet-url-${i}" value="${p.photoUrl}" onchange="updatePetField(${i}, 'photoUrl', this.value)" class="taste-input w-full rounded-lg text-xs text-gray-500" placeholder="貼上網址">
              <label class="cursor-pointer shrink-0 bg-white dark:bg-[#121714] border border-gray-200 dark:border-pm-dark-border hover:border-pm-oak dark:hover:border-pm-oak text-gray-500 hover:text-pm-oak px-3 py-2 rounded-lg flex items-center justify-center transition-colors shadow-sm">
                <i data-lucide="upload-cloud" class="w-3.5 h-3.5"></i>
                <input type="file" class="hidden" accept="image/*" onchange="uploadPetImage(${i}, this)">
              </label>
            </div>
            ${currentPets.length > 1 ? `
            <button type="button" onclick="removePetRow(${i})" class="absolute right-0 -top-6 text-gray-400 hover:text-red-500 transition-colors">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>` : ''}
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    window.updatePetField = (i, key, val) => { currentPets[i][key] = val; };
    window.removePetRow = (i) => { currentPets.splice(i, 1); renderPetsForm(); };
    
    document.getElementById('btn-add-pet').onclick = () => {
      currentPets.push({ name: "", type: "", breed: "", photoUrl: "" });
      renderPetsForm();
    };

    async function submitData() {
      const name = document.getElementById('clientName').value.trim();
      const phone = document.getElementById('clientPhone').value.trim();
      if(!name || !phone) return showToast("請完整填寫必填欄位 (*)", "error");

      const btn = document.getElementById('btn-submit-main');
      btn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> 正在儲存...`;
      btn.classList.add('opacity-70', 'cursor-not-allowed');
      lucide.createIcons();

      try {
        const instagram = document.getElementById('clientIg').value.trim();
        const email = document.getElementById('clientEmail').value.trim();
        const address = document.getElementById('clientAddress').value.trim();

        let clientId = originalClientId;
        const clientsRef = collection(db, "Clients");
        
        if (editId && clientId) {
            await updateDoc(doc(db, "Clients", clientId), { name, phone, instagram, email, address });
        } else {
            const cSnap = await addDoc(clientsRef, { name, phone, instagram, email, address });
            clientId = cSnap.id;
        }

        const extraPax = Number(document.getElementById('extraPaxCount').value || 0);
        const manualFee = Number(document.getElementById('manualOtherFee').value || 0);
        const totalOtherFee = (extraPax * 300) + manualFee;

        const orderPayload = {
          clientId,
          tags: selectedTags, 
          shootDate: document.getElementById('shootDate').value,
          shootTime: document.getElementById('shootTime').value,
          shootLocation: document.getElementById('shootLocation').value,
          platform: document.getElementById('platform').value,
          package: document.getElementById('package-select').value,
          price: Number(document.getElementById('price').value || 0),
          depositAmount: Number(document.getElementById('depositAmount').value || 0),
          manualOtherFee: manualFee,
          otherFee: totalOtherFee,
          discount: Number(document.getElementById('discount').value || 0),
          paymentStatus: document.getElementById('paymentStatus').value,
          notes: document.getElementById('notes').value,
          product: document.getElementById('product').value,
          submissionDate: document.getElementById('submissionDate').value,
          extraPaxCount: extraPax,
          kidsCount: Number(document.getElementById('kidsCount').value || 0),
          studio: document.getElementById('studio').value,
          pets: currentPets.filter(p => p.name.trim() !== ""),
          depositReceiptUrl: document.getElementById('depositReceiptUrl').value || "",
          depositDate: document.getElementById('depositDate').value || "",
          balanceReceiptUrl: document.getElementById('balanceReceiptUrl').value || "",
          balanceDate: document.getElementById('balanceDate').value || ""
        };

        if (!editId) { orderPayload.status = "col-new"; }

        if (editId) {
          await updateDoc(doc(db, "Orders", editId), orderPayload);
          showToast("預約檔案更新成功");
        } else {
          await addDoc(collection(db, "Orders"), orderPayload);
          showToast("全新預約檔案已成功建立");
        }

        setTimeout(() => { window.location.href = 'index.html'; }, 1000);

      } catch (err) {
        showToast("資料庫安全儲存事務卡死", "error");
        btn.innerHTML = `<i data-lucide="save" class="w-4 h-4"></i> 儲存預約檔案`;
        btn.classList.remove('opacity-70', 'cursor-not-allowed');
        lucide.createIcons();
      }
    }

    document.getElementById('btn-submit-main').onclick = submitData;

    initPage();
  </script>
</body>
</html>
