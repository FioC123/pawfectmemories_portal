<!DOCTYPE html>
<html class="dark" lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <script>if(!sessionStorage.getItem('pm_admin_logged')){window.location.href='login.html';}</script>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script id="tailwind-config">
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { "surface-container-high": "#2a2a2a", "surface": "#131313", "primary": "#4edea3", "surface-container-low": "#1c1b1b", "error": "#ffb4ab", "on-surface-variant": "#bbcabf", "on-surface": "#e5e2e1" }, fontFamily: { headline: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'], cursive: ['Dancing Script', 'cursive'] } } } }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { min-height: max(884px, 100dvh); }
    input[type="text"], input[type="tel"], input[type="number"], input[type="email"], input[type="date"], input[type="time"], input[type="datetime-local"], select, textarea { width: 100%; border-radius: 0.5rem; border: 1px solid #3c4a42; background-color: #2a2a2a; color: #e5e2e1; padding: 0.75rem 1rem; outline: none; transition: border-color 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: #4edea3; box-shadow: 0 0 0 1px #4edea3; }
    .tag-checkbox { display: none; }
    .tag-label { cursor: pointer; transition: all 0.2s; opacity: 0.5; filter: grayscale(100%); border: 1px solid transparent; }
    .tag-checkbox:checked + .tag-label { opacity: 1; filter: grayscale(0%); border-color: currentColor; }
  </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen pb-32">
  
  <header class="bg-[#131313] fixed top-0 w-full z-50 h-20 flex justify-between items-center px-6 border-b border-white/5">
    <div class="flex items-center gap-4">
      <button type="button" onclick="if(document.referrer) { window.history.back(); } else { window.location.href='index.html'; }" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-primary/10 transition-colors cursor-pointer">
        <span class="material-symbols-outlined text-primary">close</span>
      </button>
      <div class="flex flex-col cursor-pointer select-none" onclick="if(document.referrer) { window.history.back(); } else { window.location.href='index.html'; }">
        <h1 class="font-cursive text-xl text-on-surface leading-none tracking-tight">Pawfect Memories</h1>
        <span class="text-[8px] text-primary font-bold tracking-[0.3em] uppercase mt-0.5 ml-0.5">Photography</span>
      </div>
    </div>
  </header>

  <main class="pt-24 px-6 max-w-2xl mx-auto">
    <form id="order-form" class="space-y-10">
      
      <section class="bg-surface-container-low p-6 rounded-xl border border-white/5">
        <h3 class="font-bold text-lg text-primary mb-4 flex items-center gap-2"><span class="material-symbols-outlined">person</span> 客人資料</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label class="block text-sm mb-1 text-gray-400">稱呼 <span class="text-error">*</span></label><input type="text" id="client-name" required></div>
          <div><label class="block text-sm mb-1 text-gray-400">聯絡電話 <span class="text-error">*</span></label><input type="tel" id="client-phone" required></div>
          <div><label class="block text-sm mb-1 text-gray-400">Email</label><input type="email" id="client-email"></div>
          <div><label class="block text-sm mb-1 text-gray-400">Instagram</label><input type="text" id="client-instagram" placeholder="@username"></div>
          <div class="md:col-span-2"><label class="block text-sm mb-1 text-gray-400">地址 / 地區</label><input type="text" id="client-address"></div>
          <div class="md:col-span-2">
            <label class="block text-sm mb-1 text-gray-400">來源平台 (Platform)</label>
            <select id="order-platform">
              <option value="">未選擇</option>
              <option value="IG">Instagram</option>
              <option value="FB">Facebook</option>
              <option value="WhatsApp">WhatsApp</option>
              <option value="Referral">朋友介紹 (Referral)</option>
              <option value="Website">網站 (Website)</option>
              <option value="Others">其他 (Others)</option>
            </select>
          </div>
        </div>
      </section>

      <section class="bg-surface-container-low p-6 rounded-xl border border-white/5">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-bold text-lg text-primary flex items-center gap-2"><span class="material-symbols-outlined">pets</span> 寵物資料</h3>
          <button type="button" id="btn-add-pet" class="text-sm font-bold text-primary bg-primary/10 px-3 py-1.5 rounded-lg hover:bg-primary/20 transition-colors">+ 新增寵物</button>
        </div>
        <div id="pets-container" class="space-y-6"></div>
      </section>

      <section class="bg-surface-container-low p-6 rounded-xl border border-white/5">
        <h3 class="font-bold text-lg text-primary mb-4 flex items-center gap-2"><span class="material-symbols-outlined">calendar_month</span> 拍攝、套餐與加項</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label class="block text-sm mb-1 text-gray-400">拍攝日期</label><input type="date" id="shoot-date"></div>
          <div><label class="block text-sm mb-1 text-gray-400">拍攝時間</label><input type="time" id="shoot-time"></div>
          <div id="conflict-warning" class="md:col-span-2 text-error text-sm font-bold hidden flex items-center gap-1 bg-error/10 p-2 rounded-md">
            <span class="material-symbols-outlined text-[18px]">warning</span>
            <span>警告：此日期與時間已有其他預約安排，請確認是否撞期！</span>
          </div>
          
          <div class="md:col-span-2 flex items-center gap-3 p-3 bg-primary/5 border border-primary/20 rounded-lg">
            <input type="checkbox" id="weekday-discount" class="w-5 h-5 rounded border-outline/30 bg-surface-container-high text-primary focus:ring-primary focus:ring-offset-0 cursor-pointer" onchange="calculateTotals()">
            <label for="weekday-discount" class="text-sm text-primary font-bold cursor-pointer select-none">
              套用平日優惠 (-HK$300) <br><span class="text-gray-400 font-normal text-xs">(選星期一至五會自動勾選，若遇紅日請手動取消)</span>
            </label>
          </div>

          <div><label class="block text-sm mb-1 text-gray-400">拍攝地點</label><input type="text" id="shoot-location" placeholder="西九文化區"></div>
          <div><label class="block text-sm mb-1 text-gray-400">Studio 名稱</label><input type="text" id="order-studio" placeholder="Studio名稱 (如適用)"></div>
          
          <div class="md:col-span-2">
            <label class="block text-sm mb-1 text-gray-400">選擇套餐 (自動讀取系統設定)</label>
            <select id="order-package" onchange="handlePackageChange()"><option value="">載入中...</option></select>
          </div>
          
          <div class="md:col-span-2 p-4 bg-[#2a2a2a] rounded-lg border border border-white/5 space-y-4">
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest border-b border-white/10 pb-2 mb-2">額外收費與折扣計算器</p>
            <div class="flex items-center justify-between">
              <label class="text-sm text-gray-300">實際 Studio 租金 (HK$)</label>
              <input type="number" id="order-studio-cost" placeholder="0" oninput="calculateTotals()" class="w-24 text-right h-8 text-sm">
            </div>
            <div class="flex items-center justify-between">
              <div>
                <label class="text-sm text-gray-300">額外人數 / 寵物 (+HK$300/位)</label>
                <p class="text-[10px] text-gray-500">套餐已包 2人1寵，超出部分請填寫</p>
              </div>
              <input type="number" id="extra-pax-count" value="0" min="0" oninput="calculateTotals()" class="w-24 text-right h-8 text-sm">
            </div>
            <div class="flex items-center justify-between">
              <label class="text-sm text-gray-300">6歲以下小童 (免費)</label>
              <input type="number" id="kids-count" value="0" min="0" class="w-24 text-right h-8 text-sm">
            </div>
            <div class="flex items-center justify-between">
              <label class="text-sm text-gray-300">手動附加費 (化妝/加相/車馬費 HK$)</label>
              <input type="number" id="manual-other-fee" value="0" placeholder="0" oninput="calculateTotals()" class="w-24 text-right h-8 text-sm">
            </div>
            
            <div class="flex items-center justify-between pt-2 border-t border-white/5">
              <div>
                <label class="text-sm text-[#ffb95f] font-bold">手動折扣優惠 (-HK$)</label>
                <p class="text-[10px] text-gray-500">適用於熟客友情價、特別減價折讓</p>
              </div>
              <input type="number" id="manual-discount-fee" value="0" min="0" placeholder="0" oninput="calculateTotals()" class="w-24 text-right h-8 text-sm border-[#ffb95f]/40 text-[#ffb95f]">
            </div>
          </div>

          <div><label class="block text-sm mb-1 text-gray-400">實體產品 (Product)</label><input type="text" id="order-product" placeholder="相簿 / 油畫..."></div>
          <div><label class="block text-sm mb-1 text-gray-400">交付日期 (Submission Date)</label><input type="date" id="submission-date"></div>
        </div>
      </section>

      <section class="bg-surface-container-low p-6 rounded-xl border border-white/5 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-1 h-full bg-primary"></div>
        <h3 class="font-bold text-lg text-primary mb-4 flex items-center gap-2 pl-2"><span class="material-symbols-outlined">payments</span> 收費與款項 (自動計算)</h3>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pl-2">
          <div><label class="block text-sm mb-1 text-gray-400">總收費 (Total HKD)</label><input type="number" id="order-price" readonly class="bg-surface font-bold text-primary border-primary/30"></div>
          <div><label class="block text-sm mb-1 text-gray-400">各項附加費總額 (Other Fee)</label><input type="number" id="other-fee" readonly class="bg-surface text-on-surface-variant border-white/10"></div>
          
          <div><label class="block text-sm mb-1 text-gray-400">已付訂金 (Deposit HKD)</label><input type="number" id="deposit-amount" placeholder="自動計 Base Price 50%" oninput="calculateTotals()"></div>
          <div class="flex flex-col justify-end pb-2"><p id="calculated-balance" class="text-error font-bold text-lg">尚欠尾數: HK$ 0</p></div>

          <div class="md:col-span-2 border-t border-white/10 my-2"></div>

          <div class="md:col-span-1">
            <label class="block text-sm mb-1 text-gray-400">付款狀態</label>
            <select id="payment-status">
              <option value="unpaid">❌ 未付款</option>
              <option value="deposit">💳 已付訂金</option>
              <option value="full">✅ 全數已付</option>
            </select>
          </div>
          <div class="md:col-span-1"></div>

          <div class="md:col-span-1 mt-2">
              <label class="block text-sm mb-1 text-gray-400">訂金證明 (自動讀取時間)</label>
              <div class="flex items-center gap-2">
                  <input type="file" id="deposit-receipt-file" accept="image/*" class="text-xs text-on-surface-variant file:bg-primary/10 file:text-primary file:border-0 file:rounded-lg file:px-3 file:py-2 w-full cursor-pointer">
                  <a id="preview-deposit-link" href="#" target="_blank" class="hidden text-primary hover:text-white" title="查看已上傳的收據"><span class="material-symbols-outlined text-[20px]">visibility</span></a>
              </div>
              <input type="hidden" id="existing-deposit-url">
          </div>
          
          <div class="md:col-span-1 mt-2">
              <label class="block text-sm mb-1 text-gray-400">尾數證明 (自動讀取時間)</label>
              <div class="flex items-center gap-2">
                  <input type="file" id="balance-receipt-file" accept="image/*" class="text-xs text-on-surface-variant file:bg-primary/10 file:text-primary file:border-0 file:rounded-lg file:px-3 file:py-2 w-full cursor-pointer">
                  <a id="preview-balance-link" href="#" target="_blank" class="hidden text-primary hover:text-white" title="查看已上傳的收據"><span class="material-symbols-outlined text-[20px]">visibility</span></a>
              </div>
              <input type="hidden" id="existing-balance-url">
          </div>

          <div><label class="block text-sm mb-1 text-gray-400">落訂日期與時間</label><input type="datetime-local" id="deposit-date"></div>
          <div><label class="block text-sm mb-1 text-gray-400">找數日期與時間</label><input type="datetime-local" id="balance-date"></div>

          <div class="md:col-span-2 mt-4"><div class="flex items-center justify-between mb-2"><label class="block text-sm text-gray-400">客戶標籤</label></div><div id="tags-selector-container" class="flex flex-wrap gap-2 p-4 bg-surface-container-high rounded-lg min-h-[60px]">載入中...</div></div>
          <div class="md:col-span-2 mt-2"><label class="block text-sm mb-1 text-gray-400">備註 / 特殊要求</label><textarea id="order-notes" rows="3"></textarea></div>
        </div>
      </section>

      <button type="submit" id="btn-submit" class="w-full bg-primary text-[#003824] font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-all text-lg cursor-pointer">儲存預約單</button>
    </form>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, getDoc, getDocs, updateDoc, setDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

    const firebaseConfig = { apiKey: "AIzaSyBhFUkCP0WslzdB2WY93hp6L-Z5g8vo40E", authDomain: "pawfect-memories-2c8a0.firebaseapp.com", projectId: "pawfect-memories-2c8a0", storageBucket: "pawfect-memories-2c8a0.firebasestorage.app", messagingSenderId: "860879002502", appId: "1:860879002502:web:eeaa936317b1fefc33aa07" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const editId = new URLSearchParams(window.location.search).get('editId');
    let editClientId = null;
    let globalPackages = [];
    let isInitialLoad = true;

    // --- 自動計算邏輯 ---
    window.handlePackageChange = function() {
      const pkgSelect = document.getElementById('order-package');
      const selectedOption = pkgSelect.options[pkgSelect.selectedIndex];
      if (!selectedOption) return;
      
      const basePrice = Number(selectedOption.getAttribute('data-price') || 0);
      
      if (!editId || !isInitialLoad) {
        document.getElementById('deposit-amount').value = Math.floor(basePrice / 2);
      }
      calculateTotals();
    };

    window.calculateTotals = function() {
        const pkgSelect = document.getElementById('order-package');
        const selectedOption = pkgSelect.options[pkgSelect.selectedIndex];
        if (!selectedOption) return;

        const basePrice = Number(selectedOption.getAttribute('data-price') || 0);
        const studioLimit = Number(selectedOption.getAttribute('data-limit') || 0);
        
        const actualStudioCost = Number(document.getElementById('order-studio-cost').value || 0);
        const extraPaxCount = Number(document.getElementById('extra-pax-count').value || 0);
        const manualOtherFee = Number(document.getElementById('manual-other-fee').value || 0);
        const depositAmount = Number(document.getElementById('deposit-amount').value || 0);
        const applyDiscount = document.getElementById('weekday-discount').checked;
        
        // 🚨 抓取手動折扣金額 🚨
        const manualDiscountFee = Number(document.getElementById('manual-discount-fee').value || 0);

        let topUp = 0;
        if (actualStudioCost > studioLimit && studioLimit > 0) topUp = actualStudioCost - studioLimit;
        else if (studioLimit === 0 && actualStudioCost > 0) topUp = actualStudioCost;

        const extraPaxCost = extraPaxCount * 300;
        const totalOtherFee = topUp + extraPaxCost + manualOtherFee;
        const weekdayDiscountAmt = applyDiscount ? 300 : 0;
        
        // 🚨 總金額 = 套餐原價 + 附加費總額 - 平日優惠 - 手動折扣 🚨
        const total = basePrice + totalOtherFee - weekdayDiscountAmt - manualDiscountFee;
        const balance = total - depositAmount;

        document.getElementById('order-price').value = total > 0 ? total : 0;
        document.getElementById('other-fee').value = totalOtherFee;
        
        const balEl = document.getElementById('calculated-balance');
        balEl.innerText = `尚欠尾數: HK$ ${balance > 0 ? balance : 0}`;
        if (balance <= 0 && total > 0) { 
            balEl.classList.replace('text-error', 'text-primary'); 
            document.getElementById('payment-status').value = 'full'; 
        } else { 
            balEl.classList.replace('text-primary', 'text-error'); 
            document.getElementById('payment-status').value = depositAmount > 0 ? 'deposit' : 'unpaid'; 
        }
    }

    async function loadDynamicPackages() {
        const snap = await getDoc(doc(db, "Settings", "packages_config"));
        if (snap.exists()) globalPackages = snap.data().list;
        else globalPackages = [
            { name: "Pawfect Outdoor", price: 2788, studioLimit: 0 }, 
            { name: "Pawfect Studio", price: 3888, studioLimit: 1000 }, 
            { name: "Pawfect Premium", price: 5888, studioLimit: 1000 }, 
            { name: "Pawfect On-site", price: 2100, studioLimit: 0 }
        ];
        
        const select = document.getElementById('order-package');
        select.innerHTML = globalPackages.map(pkg => `<option value="${pkg.name}" data-price="${pkg.price}" data-limit="${pkg.studioLimit || 0}">${pkg.name} (HK$${pkg.price}${pkg.studioLimit ? ` | 包$${pkg.studioLimit}地租` : ''})</option>`).join('');
        
        if(!editId) handlePackageChange(); 
    }

    // --- 日期與時間處理 ---
    const dateInput = document.getElementById('shoot-date'); 
    const timeInput = document.getElementById('shoot-time'); 
    const warningEl = document.getElementById('conflict-warning');
    
    dateInput.addEventListener('change', async () => {
      const selectedDate = dateInput.value; const selectedTime = timeInput.value;
      if (selectedDate && selectedTime) {
        const ordersSnap = await getDocs(collection(db, "Orders")); let isConflict = false;
        ordersSnap.forEach((docSnap) => { const data = docSnap.data(); if (editId && docSnap.id === editId) return; if (data.shootDate === selectedDate && data.shootTime === selectedTime) isConflict = true; });
        if (isConflict) warningEl.classList.remove('hidden'); else warningEl.classList.add('hidden');
      }
      if (selectedDate) {
        const day = new Date(selectedDate).getDay(); 
        const discountBox = document.getElementById('weekday-discount');
        if (!editId || !isInitialLoad) { discountBox.checked = (day >= 1 && day <= 5); }
        calculateTotals();
      }
    }); 
    timeInput.addEventListener('change', () => { dateInput.dispatchEvent(new Event('change')) });

    function attachAutoDateReader(fileInputId, dateInputId) {
      document.getElementById(fileInputId).addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file && file.lastModified) {
          const d = new Date(file.lastModified);
          const yyyy = d.getFullYear(); const mm = String(d.getMonth() + 1).padStart(2, '0'); const dd = String(d.getDate()).padStart(2, '0');
          const hh = String(d.getHours()).padStart(2, '0'); const min = String(d.getMinutes()).padStart(2, '0');
          document.getElementById(dateInputId).value = `${yyyy}-${mm}-${dd}T${hh}:${min}`;
        }
      });
    }
    attachAutoDateReader('deposit-receipt-file', 'deposit-date'); 
    attachAutoDateReader('balance-receipt-file', 'balance-date');

    // --- 寵物區塊處理 ---
    let petBlockCount = 0; const petsContainer = document.getElementById('pets-container');
    function addPetBlock(petData = null) {
      const blockId = petBlockCount++; const div = document.createElement('div'); 
      div.className = "pet-block bg-surface-container-high p-4 rounded-lg relative border border-white/5 shadow-sm"; 
      div.innerHTML = `
        ${blockId > 0 ? `<button type="button" onclick="this.closest('.pet-block').remove()" class="absolute top-2 right-2 text-error hover:bg-error/10 w-8 h-8 rounded-full flex items-center justify-center"><span class="material-symbols-outlined text-[20px]">delete</span></button>` : ''}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="${blockId > 0 ? 'pr-8' : ''}"><label class="block text-sm mb-1 text-gray-400">寵物名字 *</label><input type="text" class="pet-name-input" value="${petData?.name || ''}" required></div>
          <div>
            <label class="block text-sm mb-1 text-gray-400">種類</label>
            <select class="pet-type-input">
              <option value="狗" ${petData?.type==='狗'?'selected':''}>狗</option>
              <option value="貓" ${petData?.type==='貓'?'selected':''}>貓</option>
              <option value="兔" ${petData?.type==='兔'?'selected':''}>兔</option>
              <option value="其他" ${petData?.type==='野生'?'selected':''}>其他</option>
            </select>
          </div>
          <div class="md:col-span-2"><label class="block text-sm mb-1 text-gray-400">品種 (例如：柴犬)</label><input type="text" class="pet-breed-input" value="${petData?.breed || ''}"></div>
          <div class="md:col-span-2">
            <div class="flex items-center gap-4 mt-2">
              <img class="pet-preview w-16 h-16 rounded-full object-cover border-2 border-outline-variant" src="${petData?.photoUrl || 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=150&h=150&fit=crop'}" style="${petData?.photoUrl ? 'display:block;' : 'display:none;'}">
              <input type="file" accept="image/*" class="pet-photo-input text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-primary/10 file:text-primary cursor-pointer bg-transparent border-0 p-0">
              <input type="hidden" class="pet-existing-photo" value="${petData?.photoUrl || ''}">
            </div>
          </div>
        </div>`;
      const fileInput = div.querySelector('.pet-photo-input'); const preview = div.querySelector('.pet-preview');
      fileInput.addEventListener('change', (e) => { const file = e.target.files[0]; if(file) { preview.src = URL.createObjectURL(file); preview.style.display = "block"; } });
      petsContainer.appendChild(div);
    }
    document.getElementById('btn-add-pet').addEventListener('click', () => addPetBlock());

    // --- 標籤處理 ---
    let availableTags = []; let selectedTagNames = [];
    async function loadTags() {
      const snap = await getDoc(doc(db, "Settings", "tags_config"));
      if (snap.exists() && snap.data().list) availableTags = snap.data().list;
      const container = document.getElementById('tags-selector-container');
      if (availableTags.length === 0) return container.innerHTML = '<span class="text-sm text-on-surface-variant">尚未設定標籤</span>';
      container.innerHTML = availableTags.map((tag, i) => `
        <div class="relative inline-block">
          <input type="checkbox" id="tag-${i}" class="tag-checkbox" value="${tag.name}" data-color="${tag.color}" ${selectedTagNames.includes(tag.name)?'checked':''}>
          <label for="tag-${i}" class="tag-label inline-flex items-center px-3 py-1.5 rounded-md text-sm font-bold ${tag.color} select-none">${tag.name}</label>
        </div>`).join('');
    }

    async function init() {
      await loadDynamicPackages();
      if (editId) {
        document.querySelector('h1').innerText = "編輯預約單";
        const snap = await getDoc(doc(db, "Orders", editId));
        if (snap.exists()) {
          const d = snap.data();
          if (d.pets && d.pets.length > 0) d.pets.forEach(p => addPetBlock(p)); else addPetBlock();
          
          document.getElementById('shoot-date').value = d.shootDate || ""; 
          document.getElementById('shoot-time').value = d.shootTime || "";
          document.getElementById('shoot-location').value = d.shootLocation || ""; 
          document.getElementById('order-studio').value = d.studio || "";
          document.getElementById('order-package').value = d.package || ""; 
          document.getElementById('order-studio-cost').value = d.actualStudioCost || "";
          document.getElementById('extra-pax-count').value = d.extraPaxCount || 0; 
          document.getElementById('kids-count').value = d.kidsCount || 0;
          document.getElementById('manual-other-fee').value = d.manualOtherFee || 0;
          
          // 🚨 讀取編輯模式時的手動折扣金額 🚨
          document.getElementById('manual-discount-fee').value = d.manualDiscountFee || 0;

          document.getElementById('order-price').value = d.price || ""; 
          document.getElementById('deposit-amount').value = d.depositAmount || "";
          document.getElementById('other-fee').value = d.otherFee || ""; 
          document.getElementById('order-notes').value = d.notes || "";
          document.getElementById('payment-status').value = d.paymentStatus || "unpaid"; 
          document.getElementById('order-platform').value = d.platform || "";
          document.getElementById('deposit-date').value = (d.depositDate || "").replace(' ', 'T'); 
          document.getElementById('balance-date').value = (d.balanceDate || "").replace(' ', 'T');
          document.getElementById('order-product').value = d.product || ""; 
          document.getElementById('submission-date').value = d.submissionDate || "";
          document.getElementById('weekday-discount').checked = (d.discount === 300);

          if (d.depositReceiptUrl) {
            document.getElementById('existing-deposit-url').value = d.depositReceiptUrl;
            document.getElementById('preview-deposit-link').href = d.depositReceiptUrl;
            document.getElementById('preview-deposit-link').classList.remove('hidden');
          }
          if (d.balanceReceiptUrl) {
            document.getElementById('existing-balance-url').value = d.balanceReceiptUrl;
            document.getElementById('preview-balance-link').href = d.balanceReceiptUrl;
            document.getElementById('preview-balance-link').classList.remove('hidden');
          }

          if (d.tags) selectedTagNames = d.tags.map(t => t.name);
          if (d.clientId) {
            editClientId = d.clientId; const cSnap = await getDoc(doc(db, "Clients", editClientId));
            if(cSnap.exists()) { 
                const c = cSnap.data(); 
                document.getElementById('client-name').value = c.name || ""; 
                document.getElementById('client-phone').value = c.phone || ""; 
                document.getElementById('client-email').value = c.email || ""; 
                document.getElementById('client-instagram').value = c.instagram || ""; 
                document.getElementById('client-address').value = c.address || ""; 
            }
          }
          isInitialLoad = false;
          calculateTotals();
        }
      } else { addPetBlock(); isInitialLoad = false; }
      loadTags();
    }
    init();

    // --- 儲長表單與檔案上傳 ---
    const submitBtn = document.getElementById('btn-submit');
    document.getElementById('order-form').addEventListener('submit', async (e) => {
      e.preventDefault(); submitBtn.innerText = "上傳資料中..."; submitBtn.disabled = true;
      try {
        const checkedTags = []; document.querySelectorAll('.tag-checkbox:checked').forEach(cb => { checkedTags.push({ name: cb.value, color: cb.getAttribute('data-color') }); });
        const clientPayload = { name: document.getElementById('client-name').value.trim(), phone: document.getElementById('client-phone').value.trim(), email: document.getElementById('client-email').value.trim(), instagram: document.getElementById('client-instagram').value.trim(), address: document.getElementById('client-address').value.trim(), updatedAt: new Date() };

        const petsArray = [];
        for (let block of document.querySelectorAll('.pet-block')) {
          const file = block.querySelector('.pet-photo-input').files[0]; let photoUrl = block.querySelector('.pet-existing-photo').value;
          if (file) { const fileRef = ref(storage, `pets/${Date.now()}_${file.name}`); await uploadBytes(fileRef, file); photoUrl = await getDownloadURL(fileRef); }
          petsArray.push({ name: block.querySelector('.pet-name-input').value.trim(), type: block.querySelector('.pet-type-input').value, breed: block.querySelector('.pet-breed-input').value.trim(), photoUrl: photoUrl });
        }

        let depositReceiptUrl = document.getElementById('existing-deposit-url').value; 
        let balanceReceiptUrl = document.getElementById('existing-balance-url').value;
        
        const depFile = document.getElementById('deposit-receipt-file').files[0]; 
        if (depFile) { 
            const depRef = ref(storage, `receipts/${Date.now()}_dep_${depFile.name}`); 
            await uploadBytes(depRef, depFile); 
            depositReceiptUrl = await getDownloadURL(depRef); 
        }
        
        const balFile = document.getElementById('balance-receipt-file').files[0]; 
        if (balFile) { 
            const balRef = ref(storage, `receipts/${Date.now()}_bal_${balFile.name}`); 
            await uploadBytes(balRef, balFile); 
            balanceReceiptUrl = await getDownloadURL(balRef); 
        }

        const isDiscount = document.getElementById('weekday-discount').checked;

        const orderData = {
          pets: petsArray, 
          shootDate: document.getElementById('shoot-date').value, 
          shootTime: document.getElementById('shoot-time').value,
          shootLocation: document.getElementById('shoot-location').value.trim(), 
          package: document.getElementById('order-package').value,
          actualStudioCost: Number(document.getElementById('order-studio-cost').value || 0), 
          extraPaxCount: Number(document.getElementById('extra-pax-count').value || 0), 
          kidsCount: Number(document.getElementById('kids-count').value || 0), 
          manualOtherFee: Number(document.getElementById('manual-other-fee').value || 0),
          
          // 🚨 將手動折扣欄位儲存至 Firebase 🚨
          manualDiscountFee: Number(document.getElementById('manual-discount-fee').value || 0),

          price: Number(document.getElementById('order-price').value || 0), 
          depositAmount: Number(document.getElementById('deposit-amount').value || 0), 
          otherFee: Number(document.getElementById('other-fee').value || 0), 
          discount: isDiscount ? 300 : 0,
          notes: document.getElementById('order-notes').value.trim(), 
          paymentStatus: document.getElementById('payment-status').value, 
          tags: checkedTags, 
          depositReceiptUrl, 
          balanceReceiptUrl, 
          platform: document.getElementById('order-platform').value, 
          studio: document.getElementById('order-studio').value.trim(),
          depositDate: document.getElementById('deposit-date').value.replace('T', ' '), 
          balanceDate: document.getElementById('balance-date').value.replace('T', ' '), 
          product: document.getElementById('order-product').value.trim(), 
          submissionDate: document.getElementById('submission-date').value, 
          updatedAt: new Date()
        };

        if (editId && editClientId) { 
            await updateDoc(doc(db, "Clients", editClientId), clientPayload); 
            await updateDoc(doc(db, "Orders", editId), orderData); 
        } else {
          let nextInvoiceNum = 1361; const q = query(collection(db, "Orders"), orderBy("invoiceNumber", "desc"), limit(1)); const numSnap = await getDocs(q);
          if (!numSnap.empty && numSnap.docs[0].data().invoiceNumber) nextInvoiceNum = numSnap.docs[0].data().invoiceNumber + 1;
          orderData.invoiceNumber = nextInvoiceNum; orderData.displayId = String(nextInvoiceNum).padStart(7, '0');
          clientPayload.createdAt = new Date(); const clientRef = await addDoc(collection(db, "Clients"), clientPayload);
          orderData.clientId = clientRef.id; orderData.status = "col-new"; orderData.createdAt = new Date();
          await setDoc(doc(db, "Orders", orderData.displayId), orderData);
        }
        window.location.href = 'index.html';
      } catch (error) { 
          console.error(error);
          submitBtn.innerText = "❌ 儲存失敗"; submitBtn.classList.add("bg-error", "text-surface"); submitBtn.disabled = false; 
          setTimeout(() => { submitBtn.innerText = "儲存預約單"; submitBtn.classList.remove("bg-error", "text-surface"); }, 3000); 
      }
    });
  </script>
</body>
</html>
