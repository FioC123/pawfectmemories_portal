<!DOCTYPE html>
<html lang="zh-Hant" class="light">
<head>
  <meta charset="utf-8">
  <script>if(!sessionStorage.getItem('pm_admin_logged') && !localStorage.getItem('pm_admin_logged')){window.location.href='login.html';}</script>
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>新增與編輯預約 | Pawfect Memories</title>
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600&family=Noto+Sans+HK:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script id="tailwind-config">
    tailwind.config = {
      future: { hoverOnlyWhenSupported: true }, 
      darkMode: 'class', 
      theme: { 
        extend: { 
          colors: { 
            "pm-green": "rgb(var(--pm-primary) / <alpha-value>)",
            "pm-oak": "rgb(var(--pm-primary) / <alpha-value>)",
            "pm-cream": "rgb(var(--pm-page) / <alpha-value>)",
            "pm-dark-bg": "rgb(var(--pm-page) / <alpha-value>)",
            "pm-dark-surface": "rgb(var(--pm-card) / <alpha-value>)",
            "pm-dark-border": "rgb(var(--pm-line) / <alpha-value>)",
            "pm-sidebar": "rgb(var(--pm-sidebar) / <alpha-value>)",
            "pm-fill": "rgb(var(--pm-fill) / <alpha-value>)",
            "pm-elevated": "rgb(var(--pm-elevated) / <alpha-value>)",
            "pm-ink": "rgb(var(--pm-ink) / <alpha-value>)",
            "pm-page": "rgb(var(--pm-page) / <alpha-value>)",
            "pm-on": "rgb(var(--pm-on) / <alpha-value>)",
            "pm-secondary": "rgb(var(--pm-secondary) / <alpha-value>)",
            "pm-muted": "rgb(var(--pm-muted) / <alpha-value>)",
            "pm-success": "rgb(var(--pm-success) / <alpha-value>)",
            "pm-warning": "rgb(var(--pm-warning) / <alpha-value>)",
            "pm-danger": "rgb(var(--pm-danger) / <alpha-value>)",
            "pm-info": "rgb(var(--pm-info) / <alpha-value>)",
            "pm-sage": "rgb(var(--pm-sage) / <alpha-value>)",
            "pm-clay": "rgb(var(--pm-clay) / <alpha-value>)",
            "error": "rgb(var(--pm-danger) / <alpha-value>)"
          }, 
          fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['"Noto Sans HK"', '"Inter"', 'sans-serif'] },
          boxShadow: {
            'taste': '0 4px 20px -4px rgba(0, 0, 0, 0.04), 0 1px 4px -1px rgba(0, 0, 0, 0.02)', 
            'taste-dark': '0 20px 40px -10px rgba(0, 0, 0, 0.5), 0 1px 8px -1px rgba(0, 0, 0, 0.3)' 
          }
        } 
      } 
    }
  </script>
  <style>
    body { min-height: 100dvh; overflow: hidden; transition: background-color var(--duration-fast) var(--ease-smooth-out), color var(--duration-fast) var(--ease-smooth-out); -webkit-font-smoothing: antialiased; }
    i[data-lucide] { display: inline-block; vertical-align: text-bottom; }
    
    .taste-input {
        background-color: var(--fill) !important;
        border: 1px solid transparent !important;
        transition: background-color var(--duration-quick) var(--ease), border-color var(--duration-quick) var(--ease), box-shadow var(--duration-quick) var(--ease-out);
    }
    .dark .taste-input { background-color: var(--elevated) !important; }
    @media (hover: hover) and (pointer: fine) {
      .taste-input:hover { background-color: color-mix(in srgb, var(--fill) 82%, var(--ink)) !important; }
      .dark .taste-input:hover { background-color: color-mix(in srgb, var(--elevated) 86%, var(--ink)) !important; }
    }
    .taste-input:focus {
        background-color: var(--card) !important;
        border-color: var(--primary) !important;
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent) !important;
        outline: none;
    }
    .dark .taste-input:focus { background-color: var(--card) !important; }
    
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    
    select.taste-select {
        appearance: none;
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%239A9288' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
        background-position: right 0.75rem center;
        background-repeat: no-repeat;
        background-size: 1.5em 1.5em;
        padding-right: 2.5rem;
    }
    
    .pet-row-transition { animation: none; }
  </style>
  <meta name="theme-color" content="#F6F3EE">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta && document.documentElement.classList.contains("dark")) meta.setAttribute("content", "#1A1816");
    })();
  </script>
  <link rel="stylesheet" href="pm.css">
</head>
<body class="pm-app pm-admin bg-pm-cream dark:bg-pm-dark-bg text-pm-ink font-sans selection:bg-pm-oak/30 selection:text-pm-ink flex h-screen overflow-hidden">

  <aside class="hidden md:flex flex-col justify-between w-16 bg-pm-sidebar border-r border-gray-200/60 dark:border-pm-dark-border h-full pm-named group z-40 relative shadow-sm shrink-0">
    <div class="flex flex-col items-start w-full overflow-hidden">
      <div class="h-20 flex items-center px-4 w-full shrink-0 border-b border-gray-100 dark:border-white/5">
        <img src="logo_black.png" alt="Pawfect Memories" class="w-8 h-8 object-contain shrink-0 dark:hidden">
        <img src="logo_white.png" alt="Pawfect Memories" class="w-8 h-8 object-contain shrink-0 hidden dark:block">
        <span class="ml-3 font-serif font-bold text-[16px] text-pm-ink whitespace-nowrap tracking-tight">Pawfect Memories</span>
      </div>
      <nav class="w-full mt-6 flex flex-col gap-1.5 px-2.5">
        <a href="index.html" class="flex items-center px-3.5 py-3 rounded-xl text-gray-400 hover:bg-gray-50/80 dark:hover:bg-pm-fill/70 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white pm-named w-full overflow-hidden font-medium">
          <i data-lucide="layout-dashboard" class="w-5 h-5 shrink-0"></i>
          <span class="ml-4 whitespace-nowrap">工作區 (Workspace)</span>
        </a>
        <a href="add.html" class="flex items-center px-3.5 py-3 rounded-xl bg-pm-fill text-pm-oak font-semibold pm-named w-full overflow-hidden shadow-inner dark:shadow-none">
          <i data-lucide="plus-square" class="w-5 h-5 shrink-0"></i>
          <span class="ml-4 whitespace-nowrap">新增預約 (New)</span>
        </a>
        <a href="dashboard.html" class="flex items-center px-3.5 py-3 rounded-xl text-gray-400 hover:bg-gray-50/80 dark:hover:bg-pm-fill/70 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white pm-named w-full overflow-hidden font-medium">
          <i data-lucide="pie-chart" class="w-5 h-5 shrink-0"></i>
          <span class="ml-4 whitespace-nowrap">財務中心 (Finance)</span>
        </a>
        <a href="settings.html" class="flex items-center px-3.5 py-3 rounded-xl text-gray-400 hover:bg-gray-50/80 dark:hover:bg-pm-fill/70 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white pm-named w-full overflow-hidden font-medium">
          <i data-lucide="settings" class="w-5 h-5 shrink-0"></i>
          <span class="ml-4 whitespace-nowrap">系統設定 (Settings)</span>
        </a>
      </nav>
    </div>
    
    <div class="px-2.5 pb-6 flex flex-col gap-2 w-full overflow-hidden border-t border-gray-100 dark:border-white/5 pt-4">
      <button onclick="toggleDarkMode()" class="flex items-center px-3 py-3 rounded-xl text-gray-500 hover:bg-gray-100 dark:hover:bg-pm-fill hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-colors w-full overflow-hidden">
        <i data-lucide="moon" class="w-5 h-5 shrink-0 dark:hidden"></i><i data-lucide="sun" class="w-5 h-5 shrink-0 hidden dark:block"></i>
        <span class="ml-4 whitespace-nowrap font-medium">主題切換 (Theme)</span>
      </button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
    
    <header class="pm-pagehead shrink-0">
      <div class="pm-pagehead-row">
        <button type="button" onclick="window.location.href='index.html';" class="pm-iconbtn" aria-label="返回工作區"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
        <h1 id="page-title" class="flex-1">建立全新預約檔案</h1>
        <button type="button" class="pm-iconbtn md:hidden" onclick="toggleDarkMode()" aria-label="切換主題">
          <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
          <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
        </button>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto custom-scrollbar p-6 md:p-8 bg-pm-cream dark:bg-pm-dark-bg" id="form-container">
      <div class="max-w-4xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 pb-24">
        
        <div class="lg:col-span-7 bg-white dark:bg-pm-dark-surface p-6 md:p-8 rounded-[24px] border border-gray-200/50 dark:border-white/5 shadow-taste dark:shadow-taste-dark space-y-4">
          <h3 class="font-serif font-bold text-base text-gray-900 dark:text-white flex items-center gap-2 border-b border-gray-100 dark:border-pm-dark-border pb-3"><i data-lucide="user" class="w-4 h-4 text-pm-oak"></i> 客戶及預約時間</h3>
          
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="text-[10px] text-gray-400 font-bold uppercase mb-1 block">客人姓名 *</label>
              <input type="text" id="clientName" required class="taste-input w-full rounded-xl text-xs font-semibold text-gray-900 dark:text-white" placeholder="陳大文">
            </div>
            <div>
              <label class="text-[10px] text-gray-400 font-bold uppercase mb-1 block">聯絡電話 *</label>
              <input type="tel" id="clientPhone" required class="taste-input w-full rounded-xl text-xs font-semibold text-gray-900 dark:text-white" placeholder="91234567">
            </div>
            <div>
              <label class="text-[10px] text-gray-400 font-bold uppercase mb-1 block">Instagram (IG)</label>
              <input type="text" id="clientIg" class="taste-input w-full rounded-xl text-xs font-semibold text-gray-900 dark:text-white" placeholder="@username">
            </div>
            <div>
              <label class="text-[10px] text-gray-400 font-bold uppercase mb-1 block">電郵地址 (Email)</label>
              <input type="email" id="clientEmail" class="taste-input w-full rounded-xl text-xs font-semibold text-gray-900 dark:text-white" placeholder="example@email.com">
            </div>
          </div>

          <div>
             <label class="text-[10px] text-gray-400 font-bold uppercase mb-1 block">聯絡 / 寄送地址</label>
             <input type="text" id="clientAddress" class="taste-input w-full rounded-xl text-xs font-semibold text-gray-900 dark:text-white" placeholder="填寫詳細地址以寄送相架/相簿...">
          </div>

          <div class="border-t border-gray-100 dark:border-pm-dark-border pt-4 mt-2">
             <label class="text-[10px] text-gray-400 font-bold uppercase mb-2 block">客戶分類標籤</label>
             <div id="tags-container" class="flex flex-wrap gap-2 min-h-[30px]">
                 <span class="text-xs text-gray-400 animate-pulse">載入標籤中...</span>
             </div>
          </div>

          <div class="grid grid-cols-2 gap-4 border-t border-gray-100 dark:border-pm-dark-border pt-4 mt-2">
            <div>
              <label class="text-[10px] text-gray-400 font-bold uppercase mb-1 block">拍攝日期</label>
              <input type="date" id="shootDate" class="taste-input w-full rounded-xl text-xs font-semibold text-gray-900 dark:text-white">
            </div>
            <div>
              <label class="text-[10px] text-gray-400 font-bold uppercase mb-1 block">拍攝時間</label>
              <input type="time" id="shootTime" class="taste-input w-full rounded-xl text-xs font-semibold text-gray-900 dark:text-white">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="text-[10px] text-gray-400 font-bold uppercase mb-1 block">客源平台</label>
              <select id="platform" class="taste-select taste-input w-full rounded-xl text-xs font-semibold text-gray-900 dark:text-white">
                <option value="Instagram">Instagram</option>
                <option value="WhatsApp">WhatsApp</option>
                <option value="熟客轉介紹">熟客轉介紹</option>
                <option value="廣告引流">廣告引流</option>
              </select>
            </div>
            <div>
              <label class="text-[10px] text-gray-400 font-bold uppercase mb-1 block">拍攝地點 / 影樓</label>
              <input type="text" id="shootLocation" class="taste-input w-full rounded-xl text-xs font-semibold text-gray-900 dark:text-white" placeholder="荔枝角影樓 / 室外公園">
            </div>
          </div>

          <div class="grid grid-cols-3 gap-3 bg-gray-50 dark:bg-pm-fill p-3 rounded-xl border border-gray-100 dark:border-transparent mt-2">
            <div>
              <label class="text-[9px] text-gray-400 font-bold uppercase mb-0.5 block">額外人數/寵物</label>
              <input type="number" id="extraPaxCount" value="0" min="0" class="taste-input w-full rounded-lg text-xs font-bold text-pm-oak text-center">
            </div>
            <div>
              <label class="text-[9px] text-gray-400 font-bold uppercase mb-0.5 block">6歲以下小童</label>
              <input type="number" id="kidsCount" value="0" min="0" class="taste-input w-full rounded-lg text-xs font-bold text-gray-500 text-center">
            </div>
            <div>
              <label class="text-[9px] text-gray-400 font-bold uppercase mb-0.5 block">指定合作影樓</label>
              <input type="text" id="studio" class="taste-input w-full rounded-lg text-xs font-semibold text-gray-900 dark:text-white" placeholder="無">
            </div>
          </div>
        </div>

        <div class="lg:col-span-5 bg-white dark:bg-pm-dark-surface p-6 md:p-8 rounded-[24px] border border-gray-200/50 dark:border-white/5 shadow-taste dark:shadow-taste-dark space-y-4">
          <h3 class="font-serif font-bold text-base text-gray-900 dark:text-white flex items-center gap-2 border-b border-gray-100 dark:border-pm-dark-border pb-3"><i data-lucide="wallet" class="w-4 h-4 text-pm-oak"></i> 服務套餐與財務狀況</h3>
          
          <div>
            <label class="text-[10px] text-gray-400 font-bold uppercase mb-1 block">選擇服務套餐</label>
            <select id="package-select" class="taste-select taste-input w-full rounded-xl text-xs font-bold text-pm-oak">
               </select>
          </div>

          <p id="studio-included-note" class="hidden text-[11px] leading-relaxed font-semibold text-pm-oak bg-pm-oak/10 border border-pm-oak/25 rounded-xl px-3 py-2.5"></p>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="text-[10px] text-gray-400 font-bold uppercase mb-1 block">實收總金額 (HK$)</label>
              <input type="number" id="price" class="taste-input w-full rounded-xl text-sm font-bold text-pm-oak">
            </div>
            <div>
              <label class="text-[10px] text-gray-400 font-bold uppercase mb-1 block">已付訂金額 (HK$)</label>
              <input type="number" id="depositAmount" class="taste-input w-full rounded-xl text-sm font-bold text-gray-700 dark:text-gray-300">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4 border-t border-gray-100 dark:border-pm-dark-border pt-3">
            <div>
              <label class="text-[10px] text-gray-400 font-bold uppercase mb-1 block" for="extraStudioFee">額外 Studio 費用</label>
              <input type="number" id="extraStudioFee" value="0" min="0" class="taste-input w-full rounded-xl text-xs font-semibold text-gray-900 dark:text-white">
              <p id="extra-studio-hint" class="text-[10px] text-gray-400 mt-1 leading-snug">只填超出已包租金的金額</p>
            </div>
            <div>
              <label class="text-[10px] text-gray-400 font-bold uppercase mb-1 block" for="manualOtherFee">附加費項目金額</label>
              <input type="number" id="manualOtherFee" value="0" class="taste-input w-full rounded-xl text-xs font-semibold text-gray-500">
              <p class="text-[10px] text-gray-400 mt-1 leading-snug">化妝、加相、車馬等。不要填已包的影樓租金。</p>
            </div>
          </div>

          <div>
            <label class="text-[10px] text-gray-400 font-bold uppercase mb-1 block" for="discount">平日扣減折扣</label>
            <input type="number" id="discount" value="0" min="0" class="taste-input w-full rounded-xl text-xs font-semibold text-gray-500">
          </div>
          <p id="finance-breakdown" class="text-[10px] text-gray-400 leading-relaxed"></p>

          <div>
            <label class="text-[10px] text-gray-400 font-bold uppercase mb-1 block">目前付款進度狀態</label>
            <select id="paymentStatus" class="taste-select taste-input w-full rounded-xl text-xs font-semibold text-gray-700 dark:text-gray-300">
              <option value="unpaid">尚未付款</option>
              <option value="deposit">已付訂金</option>
              <option value="full">全數已付</option>
            </select>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 border-t border-gray-100 dark:border-pm-dark-border pt-4 mt-4">
            <div class="bg-gray-50 dark:bg-pm-fill p-3 rounded-xl border border-gray-100 dark:border-transparent">
              <label class="text-[9px] text-gray-400 font-bold uppercase tracking-wider mb-2 flex items-center justify-between">
                <span>訂金入數紙</span>
                <span id="deposit-status" class="text-pm-success hidden"><i data-lucide="check-circle" class="w-3 h-3"></i></span>
              </label>
              <input type="file" id="depositReceiptFile" accept="image/*" class="w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-2.5 file:border-0 file:text-[10px] file:font-bold file:bg-pm-oak/10 file:text-pm-oak hover:file:bg-pm-oak/20 file:rounded-lg cursor-pointer pm-named">
              <p id="deposit-slip-label" class="text-[10px] text-gray-400 mt-2 hidden"></p>
              <label for="depositReceivedAt" class="text-[9px] text-gray-400 font-bold tracking-wider mt-2 mb-1 block">入數時間（香港時間）</label>
              <input type="datetime-local" id="depositReceivedAt" class="taste-input w-full rounded-lg text-xs font-semibold text-gray-900 dark:text-white">
              <input type="hidden" id="depositReceiptUrl">
              <input type="hidden" id="depositDate">
              <input type="hidden" id="depositSlipUploadedAt">
            </div>
            <div class="bg-gray-50 dark:bg-pm-fill p-3 rounded-xl border border-gray-100 dark:border-transparent">
              <label class="text-[9px] text-gray-400 font-bold uppercase tracking-wider mb-2 flex items-center justify-between">
                <span>尾數入數紙</span>
                <span id="balance-status" class="text-pm-success hidden"><i data-lucide="check-circle" class="w-3 h-3"></i></span>
              </label>
              <input type="file" id="balanceReceiptFile" accept="image/*" class="w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-2.5 file:border-0 file:text-[10px] file:font-bold file:bg-pm-oak/10 file:text-pm-oak hover:file:bg-pm-oak/20 file:rounded-lg cursor-pointer pm-named">
              <p id="balance-slip-label" class="text-[10px] text-gray-400 mt-2 hidden"></p>
              <label for="balanceReceivedAt" class="text-[9px] text-gray-400 font-bold tracking-wider mt-2 mb-1 block">入數時間（香港時間）</label>
              <input type="datetime-local" id="balanceReceivedAt" class="taste-input w-full rounded-lg text-xs font-semibold text-gray-900 dark:text-white">
              <input type="hidden" id="balanceReceiptUrl">
              <input type="hidden" id="balanceDate">
              <input type="hidden" id="balanceSlipUploadedAt">
            </div>
          </div>

        </div>

        <div class="lg:col-span-12 bg-white dark:bg-pm-dark-surface p-6 md:p-8 rounded-[24px] border border-gray-200/50 dark:border-white/5 shadow-taste dark:shadow-taste-dark space-y-4">
          <div class="flex items-center justify-between border-b border-gray-100 dark:border-pm-dark-border pb-3">
            <h3 class="font-serif font-bold text-base text-gray-900 dark:text-white flex items-center gap-2"><i data-lucide="smile" class="w-4 h-4 text-pm-oak"></i> 拍攝毛孩詳細細節</h3>
            <button type="button" id="btn-add-pet" class="text-xs font-bold text-pm-oak hover:opacity-80 flex items-center gap-1"><i data-lucide="plus-circle" class="w-4 h-4"></i> 新增拍攝毛孩</button>
          </div>
          
          <div id="pets-form-list" class="space-y-4">
             </div>
        </div>

        <div class="lg:col-span-12 bg-white dark:bg-pm-dark-surface p-6 md:p-8 rounded-[24px] border border-gray-200/50 dark:border-white/5 shadow-taste dark:shadow-taste-dark grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="md:col-span-2 space-y-2">
            <label class="text-[10px] text-gray-400 font-bold tracking-wider flex items-center gap-1"><i data-lucide="sticky-note" class="w-3 h-3"></i> 特殊預約叮囑 / 備註資訊</label>
            <textarea id="notes" rows="4" class="taste-input w-full rounded-xl text-xs text-gray-800 dark:text-gray-200 placeholder:text-gray-400" placeholder="入影樓需要穿襪子、小狗性格比較害羞、需要多安排降溫休息時間..."></textarea>
          </div>
          <div class="space-y-4">
            <div>
              <label class="text-[10px] text-gray-400 font-bold uppercase mb-1 block">包含實體產品</label>
              <input type="text" id="product" class="taste-input w-full rounded-xl text-xs font-semibold text-gray-900 dark:text-white" placeholder="如：12吋高級相簿、實體木框相架">
            </div>
            <div>
              <label class="text-[10px] text-gray-400 font-bold uppercase mb-1 block">相片預計交付貨期</label>
              <input type="text" id="submissionDate" class="taste-input w-full rounded-xl text-xs font-semibold text-gray-900 dark:text-white" placeholder="如：拍攝後 4-6 星期內交付">
            </div>
          </div>
        </div>

      </div>
    </main>
    <div class="pm-actionbar">
      <button type="button" id="btn-submit-main" class="pm-btn">
        <i data-lucide="save" class="w-5 h-5"></i> 儲存預約檔案
      </button>
    </div>
  </div>

  <nav class="pm-tabbar" aria-label="主要導覽">
    <a href="index.html"><i data-lucide="layout-dashboard"></i><span>工作區</span></a>
    <a href="add.html" class="is-current"><i data-lucide="plus-square"></i><span>新增</span></a>
    <a href="dashboard.html"><i data-lucide="pie-chart"></i><span>財務</span></a>
    <a href="settings.html"><i data-lucide="settings"></i><span>設定</span></a>
  </nav>

  <div id="toast-container" class="fixed bottom-8 right-8 z-[100] flex flex-col gap-3 pointer-events-none"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";
    import { DEFAULT_PET_PHOTO, escAttr, petPreviewSrc } from "./pets-avatars.js";
    import { applySlipUpload, formatPaymentStamp, hkDateTimeLocalValue, hkWallToIso } from "./payment-times.js";
    import { extraStudioFromOrder, includedStudioLimit, packageOptionLabel, quoteBooking } from "./booking-finance.js";

    const firebaseConfig = { apiKey: "AIzaSyBhFUkCP0WslzdB2WY93hp6L-Z5g8vo40E", authDomain: "pawfect-memories-2c8a0.firebaseapp.com", projectId: "pawfect-memories-2c8a0", storageBucket: "pawfect-memories-2c8a0.firebasestorage.app", messagingSenderId: "860879002502", appId: "1:860879002502:web:eeaa936317b1fefc33aa07" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    lucide.createIcons();

    window.toggleDarkMode = function() {
      const htmlEl = document.documentElement;
      const dark = !htmlEl.classList.contains('dark');
      htmlEl.classList.toggle('dark', dark);
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = dark ? '#1A1816' : '#F6F3EE';
    };

    window.showToast = function(msg, type='success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'error' ? 'bg-red-500 text-pm-on' : 'bg-pm-ink text-pm-page';
      const icon = type === 'error' ? 'alert-triangle' : (type === 'loading' ? 'loader' : 'check-circle');
      const spinClass = type === 'loading' ? 'animate-spin' : '';
      
      toast.className = `pm-toast flex items-center gap-2 ${bgColor}`;
      toast.innerHTML = `<i data-lucide="${icon}" class="w-3.5 h-3.5 ${spinClass}"></i> ${msg}`;
      
      container.appendChild(toast);
      lucide.createIcons();
      requestAnimationFrame(() => toast.classList.add('is-in'));
      
      if(type !== 'loading') {
          setTimeout(() => { toast.classList.remove('is-in'); toast.classList.add('is-out'); setTimeout(() => toast.remove(), 160); }, 3000);
      }
      return toast; 
    }

    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('editId') || urlParams.get('id');

    let packageConfig = [];
    let availableTags = [];
    let currentPets = [];
    let selectedTags = [];
    let originalClientId = "";
    let suppressFinance = false;

    function selectedPackage() {
      const name = document.getElementById('package-select').value;
      return packageConfig.find(p => p.name === name) || null;
    }

    function hkd(n) {
      return `HK$${Number(n || 0).toLocaleString()}`;
    }

    function refreshStudioHint(pkg) {
      const note = document.getElementById('studio-included-note');
      const hint = document.getElementById('extra-studio-hint');
      if (!pkg) {
        note.textContent = "";
        note.classList.add('hidden');
        hint.textContent = "只填超出已包租金的金額；未包租金的套餐則填整筆影樓費。";
        return;
      }
      const included = includedStudioLimit(pkg);
      if (included > 0) {
        note.textContent = `此套餐已包影樓租金 ${hkd(included)}，請勿把這筆記入「附加費項目金額」。只有超出 ${hkd(included)} 的差額才填「額外 Studio 費用」。`;
        note.classList.remove('hidden');
        hint.textContent = `只填超出已包 ${hkd(included)} 的金額`;
      } else {
        note.textContent = "";
        note.classList.add('hidden');
        hint.textContent = "此套餐未包租金。如需另收影樓費，整筆填在這裡。";
      }
    }

    function currentQuote(pkg) {
      return quoteBooking({
        packagePrice: pkg ? pkg.price : 0,
        studioLimit: pkg ? pkg.studioLimit : 0,
        extraStudioFee: document.getElementById('extraStudioFee').value,
        manualOtherFee: document.getElementById('manualOtherFee').value,
        extraPaxCount: document.getElementById('extraPaxCount').value,
        discount: document.getElementById('discount').value
      });
    }

    function renderBreakdown(quote, displayedTotal) {
      const el = document.getElementById('finance-breakdown');
      if (!quote) { el.textContent = ""; return; }
      const packageBit = quote.includedStudio > 0
        ? `套餐 ${hkd(quote.packagePrice)}（已包租金 ${hkd(quote.includedStudio)}）`
        : `套餐 ${hkd(quote.packagePrice)}`;
      const bits = [packageBit, `額外 Studio ${hkd(quote.extraStudioFee)}`, `附加費 ${hkd(quote.manualOtherFee)}`];
      if (quote.extraPaxCost > 0) bits.push(`額外人數 ${hkd(quote.extraPaxCost)}`);
      if (quote.discount > 0) bits.push(`折扣 −${hkd(quote.discount)}`);
      bits.push(`實收 ${hkd(quote.total)}`);
      let text = bits.join(" · ");
      if (displayedTotal != null && Math.abs(Number(displayedTotal) - quote.total) > 0.001) {
        text += ` · 目前欄位 ${hkd(displayedTotal)}，改動費用後會按公式更新`;
      }
      el.textContent = text;
    }

    function applyFinanceTotal() {
      const pkg = selectedPackage();
      refreshStudioHint(pkg);
      if (suppressFinance) return;
      if (!pkg) {
        document.getElementById('finance-breakdown').textContent = "此套餐不在目前費率表，實收維持手填。額外 Studio 與附加費仍會分開記錄。";
        return;
      }
      const quote = currentQuote(pkg);
      document.getElementById('price').value = quote.total;
      renderBreakdown(quote);
    }

    function bindFinanceInputs() {
      ["extraStudioFee", "manualOtherFee", "discount", "extraPaxCount"].forEach((id) => {
        document.getElementById(id).addEventListener("input", applyFinanceTotal);
      });
    } 

    async function initPage() {
      try {
        const [snapPkg, snapTags, snapOrder] = await Promise.all([
          getDoc(doc(db, "Settings", "packages_config")),
          getDoc(doc(db, "Settings", "tags_config")),
          editId ? getDoc(doc(db, "Orders", editId)) : Promise.resolve(null)
        ]);

        packageConfig = snapPkg.exists() ? snapPkg.data().list : [];
        availableTags = snapTags.exists() ? snapTags.data().list : [];
        
        const selectEl = document.getElementById('package-select');
        selectEl.innerHTML = packageConfig.map(p => `<option value="${escAttr(p.name)}">${escAttr(packageOptionLabel(p))}</option>`).join('');
        selectEl.addEventListener('change', applyFinanceTotal);
        bindFinanceInputs();

        if (snapOrder && snapOrder.exists()) {
          document.getElementById('page-title').innerText = "編輯預約檔案資料";
          const o = snapOrder.data();
          
          selectedTags = o.tags || [];
          
          document.getElementById('shootDate').value = o.shootDate || "";
          document.getElementById('shootTime').value = o.shootTime || "";
          document.getElementById('shootLocation').value = o.shootLocation || "";
          document.getElementById('platform').value = o.platform || "Instagram";
          suppressFinance = true;
          if (o.package && !packageConfig.some(p => p.name === o.package)) {
            const opt = document.createElement('option');
            opt.value = o.package;
            opt.textContent = `${o.package}（已不在費率表）`;
            selectEl.appendChild(opt);
          }
          const savedPkg = packageConfig.find(p => p.name === o.package) || null;
          document.getElementById('package-select').value = o.package || "";
          document.getElementById('price').value = o.price || 0;
          document.getElementById('depositAmount').value = o.depositAmount || 0;
          document.getElementById('extraStudioFee').value = extraStudioFromOrder(o, savedPkg);
          document.getElementById('manualOtherFee').value = o.manualOtherFee || 0;
          document.getElementById('discount').value = o.discount || 0;
          document.getElementById('paymentStatus').value = o.paymentStatus || "unpaid";
          document.getElementById('notes').value = o.notes || "";
          document.getElementById('product').value = o.product || "";
          document.getElementById('submissionDate').value = o.submissionDate || "";
          document.getElementById('extraPaxCount').value = o.extraPaxCount || 0;
          document.getElementById('kidsCount').value = o.kidsCount || 0;
          document.getElementById('studio').value = o.studio || "";

          if(o.depositReceiptUrl) { 
              document.getElementById('depositReceiptUrl').value = o.depositReceiptUrl;
              document.getElementById('deposit-status').classList.remove('hidden');
          }
          fillPaymentTimes("deposit", o);
          if(o.balanceReceiptUrl) { 
              document.getElementById('balanceReceiptUrl').value = o.balanceReceiptUrl;
              document.getElementById('balance-status').classList.remove('hidden');
          }
          fillPaymentTimes("balance", o);

          if (o.clientId) {
            originalClientId = o.clientId;
            const cSnap = await getDoc(doc(db, "Clients", o.clientId));
            if (cSnap.exists()) {
              const cData = cSnap.data();
              document.getElementById('clientName').value = cData.name || "";
              document.getElementById('clientPhone').value = cData.phone || "";
              document.getElementById('clientIg').value = cData.instagram || "";
              document.getElementById('clientEmail').value = cData.email || "";
              document.getElementById('clientAddress').value = cData.address || "";
            }
          }

          currentPets = o.pets || [];
          if(currentPets.length === 0 && o.petName) {
              currentPets.push({ name: o.petName, type: o.petType || "", breed: o.petBreed || "", photoUrl: o.photoUrl || "" });
          }
          suppressFinance = false;
          const loadedPkg = selectedPackage();
          refreshStudioHint(loadedPkg);
          renderBreakdown(loadedPkg ? currentQuote(loadedPkg) : null, Number(o.price || 0));
          if (!loadedPkg) document.getElementById('finance-breakdown').textContent = "此套餐不在目前費率表，實收維持已儲存金額。";
        } else {
          currentPets = [{ name: "", type: "", breed: "", photoUrl: "" }];
          applyFinanceTotal();
        }

        renderTagsSelection();
        renderPetsForm();

      } catch (err) {
        suppressFinance = false;
        showToast("同步安全中心網絡出錯", "error");
      }
    }

    // 渲染動態標籤選擇區
    function renderTagsSelection() {
        const container = document.getElementById('tags-container');
        if(availableTags.length === 0) {
            container.innerHTML = `<span class="text-xs text-gray-400">請先到「系統設定」建立標籤</span>`;
            return;
        }
        
        container.innerHTML = availableTags.map(tag => {
            const isSelected = selectedTags.some(t => t.name === tag.name);
            const baseClass = isSelected 
                ? 'bg-pm-oak text-white border-pm-oak shadow-sm' 
                : 'bg-gray-50 dark:bg-pm-fill text-gray-500 border-gray-200 dark:border-pm-dark-border hover:border-pm-oak dark:hover:border-pm-oak';
            return `<button type="button" onclick="toggleTag('${tag.name}')" class="${baseClass} px-3 py-1.5 rounded-lg text-[10px] font-bold border transition-colors cursor-pointer">${tag.name}</button>`;
        }).join('');
    }

    window.toggleTag = (name) => {
        const idx = selectedTags.findIndex(t => t.name === name);
        if(idx > -1) { selectedTags.splice(idx, 1); }
        else { selectedTags.push({ name: name }); }
        renderTagsSelection();
    };

    // Firebase Storage 上傳
    async function uploadImageToStorage(file, path) {
        const storageRef = ref(storage, path);
        await uploadBytes(storageRef, file);
        return await getDownloadURL(storageRef);
    }

    function showSlipLabel(prefix, raw) {
        const el = document.getElementById(`${prefix}-slip-label`);
        const text = formatPaymentStamp(raw);
        if (!text) { el.textContent = ""; el.classList.add("hidden"); return; }
        el.textContent = `入數紙上傳：${text}`;
        el.classList.remove("hidden");
    }

    function fillPaymentTimes(prefix, order) {
        const slipKey = prefix === "deposit" ? "depositSlipUploadedAt" : "balanceSlipUploadedAt";
        const legacyKey = prefix === "deposit" ? "depositDate" : "balanceDate";
        const receivedKey = prefix === "deposit" ? "depositReceivedAt" : "balanceReceivedAt";
        document.getElementById(slipKey).value = order[slipKey] || "";
        document.getElementById(legacyKey).value = order[legacyKey] || "";
        document.getElementById(receivedKey).value = hkDateTimeLocalValue(order[receivedKey]);
        showSlipLabel(prefix, order[slipKey] || order[legacyKey] || "");
    }

    function markSlipUploaded(prefix) {
        const receivedEl = document.getElementById(prefix === "deposit" ? "depositReceivedAt" : "balanceReceivedAt");
        const stamp = applySlipUpload({ receivedAt: receivedEl.value });
        document.getElementById(prefix === "deposit" ? "depositSlipUploadedAt" : "balanceSlipUploadedAt").value = stamp.slipUploadedAt;
        document.getElementById(prefix === "deposit" ? "depositDate" : "balanceDate").value = stamp.legacyDate;
        receivedEl.value = stamp.receivedAt;
        showSlipLabel(prefix, stamp.slipUploadedAt);
        document.getElementById(`${prefix}-status`).classList.remove("hidden");
        lucide.createIcons();
    }

    document.getElementById('depositReceiptFile').addEventListener('change', async (e) => {
        const file = e.target.files[0]; if(!file) return;
        const loadingToast = showToast("正在上傳訂金入數紙...", "loading");
        try {
            const url = await uploadImageToStorage(file, `receipts/dep_${Date.now()}_${file.name}`);
            document.getElementById('depositReceiptUrl').value = url;
            markSlipUploaded("deposit");
            loadingToast.remove();
            showToast("訂金入數紙上傳成功！");
        } catch(err) { loadingToast.remove(); showToast("上傳失敗", "error"); }
    });

    document.getElementById('balanceReceiptFile').addEventListener('change', async (e) => {
        const file = e.target.files[0]; if(!file) return;
        const loadingToast = showToast("正在上傳尾數入數紙...", "loading");
        try {
            const url = await uploadImageToStorage(file, `receipts/bal_${Date.now()}_${file.name}`);
            document.getElementById('balanceReceiptUrl').value = url;
            markSlipUploaded("balance");
            loadingToast.remove();
            showToast("尾數入數紙上傳成功！");
        } catch(err) { loadingToast.remove(); showToast("上傳失敗", "error"); }
    });

    window.uploadPetImage = async (i, inputEl) => {
        const file = inputEl.files[0]; if(!file) return;
        const loadingToast = showToast("正在上傳大頭照...", "loading");
        try {
            const url = await uploadImageToStorage(file, `avatars/pet_${Date.now()}_${file.name}`);
            updatePetField(i, 'photoUrl', url);
            document.getElementById(`pet-url-${i}`).value = url;
            loadingToast.remove();
            showToast("大頭照上傳成功！");
        } catch(e) { loadingToast.remove(); showToast("大頭照上傳失敗", "error"); }
    }

    function renderPetsForm() {
      const listEl = document.getElementById('pets-form-list');
      listEl.innerHTML = currentPets.map((p, i) => `
        <div class="pet-row-transition grid grid-cols-1 sm:grid-cols-4 gap-3 bg-gray-50/50 dark:bg-pm-fill/40 p-4 rounded-xl border border-gray-100 dark:border-pm-dark-border relative group">
          <div>
            <label class="text-[9px] text-gray-400 font-bold uppercase mb-0.5 block">毛孩名字 *</label>
            <input type="text" value="${p.name}" onchange="updatePetField(${i}, 'name', this.value)" required class="taste-input w-full rounded-lg text-xs font-semibold text-gray-900 dark:text-white" placeholder="如：Mochi">
          </div>
          <div>
            <label class="text-[9px] text-gray-400 font-bold uppercase mb-0.5 block">種類</label>
            <input type="text" value="${p.type}" onchange="updatePetField(${i}, 'type', this.value)" class="taste-input w-full rounded-lg text-xs font-medium text-gray-900 dark:text-white" placeholder="貓 / 狗 / 兔">
          </div>
          <div>
            <label class="text-[9px] text-gray-400 font-bold uppercase mb-0.5 block">品種</label>
            <input type="text" value="${p.breed}" onchange="updatePetField(${i}, 'breed', this.value)" class="taste-input w-full rounded-lg text-xs font-medium text-gray-900 dark:text-white" placeholder="柴犬 / 哥基">
          </div>
          
          <div class="relative">
            <label class="text-[9px] text-gray-400 font-bold uppercase mb-0.5 block">大頭照 (網址或上傳)</label>
            <div class="flex gap-2 items-center">
              <img id="pet-preview-${i}" src="${escAttr(petPreviewSrc(p.photoUrl))}" alt="${escAttr(p.name || '')}" class="w-9 h-9 rounded-full object-cover shrink-0 border border-gray-100 dark:border-pm-dark-border bg-gray-50 dark:bg-pm-dark-bg" onerror="this.onerror=null;this.src='${escAttr(DEFAULT_PET_PHOTO)}'">
              <input type="url" id="pet-url-${i}" value="${escAttr(p.photoUrl || '')}" oninput="updatePetField(${i}, 'photoUrl', this.value)" class="taste-input w-full rounded-lg text-xs text-gray-500" placeholder="貼上網址">
              <label class="cursor-pointer shrink-0 bg-white dark:bg-pm-dark-surface border border-gray-200 dark:border-pm-dark-border hover:border-pm-oak dark:hover:border-pm-oak text-gray-500 hover:text-pm-oak px-3 py-2 rounded-lg flex items-center justify-center transition-colors shadow-sm">
                <i data-lucide="upload-cloud" class="w-3.5 h-3.5"></i>
                <input type="file" class="hidden" accept="image/*" onchange="uploadPetImage(${i}, this)">
              </label>
            </div>
            ${currentPets.length > 1 ? `
            <button type="button" onclick="removePetRow(${i})" class="absolute right-0 -top-6 text-gray-400 hover:text-red-500 transition-colors">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>` : ''}
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    window.updatePetField = (i, key, val) => {
      currentPets[i][key] = val;
      if (key === 'photoUrl') {
        const img = document.getElementById(`pet-preview-${i}`);
        if (img) img.src = petPreviewSrc(val);
      }
    };
    window.removePetRow = (i) => { currentPets.splice(i, 1); renderPetsForm(); };
    
    document.getElementById('btn-add-pet').onclick = () => {
      currentPets.push({ name: "", type: "", breed: "", photoUrl: "" });
      renderPetsForm();
    };

    async function submitData() {
      const name = document.getElementById('clientName').value.trim();
      const phone = document.getElementById('clientPhone').value.trim();
      if(!name || !phone) return showToast("請完整填寫必填欄位 (*)", "error");

      const btn = document.getElementById('btn-submit-main');
      btn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> 正在儲存...`;
      btn.classList.add('opacity-70', 'cursor-not-allowed');
      lucide.createIcons();

      try {
        const instagram = document.getElementById('clientIg').value.trim();
        const email = document.getElementById('clientEmail').value.trim();
        const address = document.getElementById('clientAddress').value.trim();

        let clientId = originalClientId;
        const clientsRef = collection(db, "Clients");
        
        if (editId && clientId) {
            await updateDoc(doc(db, "Clients", clientId), { name, phone, instagram, email, address });
        } else {
            const cSnap = await addDoc(clientsRef, { name, phone, instagram, email, address });
            clientId = cSnap.id;
        }

        const pkg = selectedPackage();
        const quote = currentQuote(pkg);
        const extraPax = quote.extraPaxCount;

        const orderPayload = {
          clientId,
          tags: selectedTags, 
          shootDate: document.getElementById('shootDate').value,
          shootTime: document.getElementById('shootTime').value,
          shootLocation: document.getElementById('shootLocation').value,
          platform: document.getElementById('platform').value,
          package: document.getElementById('package-select').value,
          price: Number(document.getElementById('price').value || 0),
          depositAmount: Number(document.getElementById('depositAmount').value || 0),
          extraStudioFee: quote.extraStudioFee,
          manualOtherFee: quote.manualOtherFee,
          otherFee: quote.otherFee,
          discount: quote.discount,
          paymentStatus: document.getElementById('paymentStatus').value,
          notes: document.getElementById('notes').value,
          product: document.getElementById('product').value,
          submissionDate: document.getElementById('submissionDate').value,
          extraPaxCount: extraPax,
          kidsCount: Number(document.getElementById('kidsCount').value || 0),
          studio: document.getElementById('studio').value,
          pets: currentPets.filter(p => p.name.trim() !== ""),
          depositReceiptUrl: document.getElementById('depositReceiptUrl').value || "",
          depositDate: document.getElementById('depositDate').value || "",
          depositSlipUploadedAt: document.getElementById('depositSlipUploadedAt').value || "",
          depositReceivedAt: hkWallToIso(document.getElementById('depositReceivedAt').value),
          balanceReceiptUrl: document.getElementById('balanceReceiptUrl').value || "",
          balanceDate: document.getElementById('balanceDate').value || "",
          balanceSlipUploadedAt: document.getElementById('balanceSlipUploadedAt').value || "",
          balanceReceivedAt: hkWallToIso(document.getElementById('balanceReceivedAt').value)
        };

        if (!editId) { orderPayload.status = "col-new"; }

        if (editId) {
          await updateDoc(doc(db, "Orders", editId), orderPayload);
          showToast("預約檔案更新成功");
        } else {
          await addDoc(collection(db, "Orders"), orderPayload);
          showToast("全新預約檔案已成功建立");
        }

        setTimeout(() => { window.location.href = 'index.html'; }, 1000);

      } catch (err) {
        showToast("資料庫安全儲存事務卡死", "error");
        btn.innerHTML = `<i data-lucide="save" class="w-4 h-4"></i> 儲存預約檔案`;
        btn.classList.remove('opacity-70', 'cursor-not-allowed');
        lucide.createIcons();
      }
    }

    document.getElementById('btn-submit-main').onclick = submitData;

    initPage();
  </script>
</body>
</html>
